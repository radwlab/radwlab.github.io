<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADWLAB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #08090d;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Arka plan parlama efekti */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }
        /* Ana Kart */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            width: 340px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .status {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        p {
            color: #8a8d9b;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        /* Butonlar */
        .links a {
            display: block;
            margin: 12px 0;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: #e0e0e0;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .links a:hover {
            background: #00f2fe;
            color: #000;
            font-weight: 700;
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="card">
        <div class="status">● SYSTEM ONLINE</div>
        <h1>RADWLAB</h1>
        <p>Developer & Cyber Space</p>
        
        <div class="links">
            <a href="https://github.com/radwlab" target="_blank">GitHub Profile</a>
            <a href="https://discord.com" target="_blank">Discord Server</a>
        </div>
    </div>
</body>
</html>
