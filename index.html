<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>forever</title>
<link rel="icon" href="mertbest.png">
<link rel="apple-touch-icon" href="mertbest.png">
<style>
:root{
  --line:rgba(255,255,255,.075);
  --dim:rgba(255,255,255,.4);
  --glass:rgba(9,9,9,.55);
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
button,input{outline:none;font:inherit;color:inherit}
:focus-visible{outline:1.5px solid rgba(255,255,255,.75);outline-offset:3px}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}

/* video */
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;
  transition:opacity .7s ease;transform:scale(1.04);will-change:transform}
#bg.on{opacity:1}
#bg.gl{animation:glitch .45s steps(2,end)}
@keyframes glitch{
  0%{filter:hue-rotate(0) saturate(1);clip-path:inset(0)}
  20%{filter:hue-rotate(90deg) saturate(3) contrast(1.4);clip-path:inset(12% 0 55% 0);transform:scale(1.04) translateX(-14px)}
  40%{filter:hue-rotate(-60deg) saturate(2);clip-path:inset(60% 0 8% 0);transform:scale(1.04) translateX(16px)}
  60%{filter:hue-rotate(160deg) contrast(1.6);clip-path:inset(30% 0 30% 0);transform:scale(1.04) translateX(-8px)}
  100%{filter:none;clip-path:inset(0)}
}

/* mat siyah katmanlar */
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.38) 100%)}
#flash{position:fixed;inset:0;z-index:4;background:#000;opacity:0;pointer-events:none}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}

/* avatar */
#av-wrapper{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:58px;pointer-events:none}
#avw{position:relative;width:112px;height:112px;will-change:transform}
#av{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  box-shadow:0 0 0 rgba(255,255,255,0);border:1px solid rgba(255,255,255,.1)}
#av img{width:100%;height:100%;border-radius:50%;object-fit:cover;pointer-events:none}

#dc-row{pointer-events:auto;display:flex;align-items:center;gap:12px;margin-top:6px}
#dc-text{display:grid;place-items:center;height:46px;padding:0 20px;border-radius:99px;background:rgba(9,9,9,.6);
  border:1px solid rgba(255,255,255,calc(.08 + var(--m,0)*.2));color:rgba(255,255,255,calc(.55 + var(--m,0)*.45));
  font:500 .78rem var(--mono);letter-spacing:.22em;text-decoration:none;will-change:transform}
#dc-btn{pointer-events:auto;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;
  background:rgba(9,9,9,.6);border:1px solid rgba(255,255,255,calc(.08 + var(--m,0)*.2));
  color:rgba(255,255,255,calc(.55 + var(--m,0)*.45));text-decoration:none;will-change:transform}
#dc-btn svg{width:22px;height:22px;fill:currentColor}

/* paneller: mat siyah cam */
.g{background:var(--glass);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(26px) brightness(.72);-webkit-backdrop-filter:blur(26px) brightness(.72);
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
.ui{position:fixed;z-index:100;opacity:0;transform:translateY(14px);transition:opacity .9s .5s,transform .9s .5s}
body.in .ui{opacity:1;transform:none}

#tl{top:22px;left:22px;display:flex;align-items:center;gap:12px;padding:10px 16px;font:500 .7rem var(--mono);letter-spacing:.08em}
#tl i.sep{width:1px;height:11px;background:var(--line)}
#rootname{display:inline-block;position:relative;white-space:pre}
#rootname .root-char{display:inline-block;color:rgba(245,245,245,.62);animation:rootMono 3s linear infinite;}
#rootname .root-char:nth-child(1){animation-delay:0s}
#rootname .root-char:nth-child(2){animation-delay:.12s}
#rootname .root-char:nth-child(3){animation-delay:.24s}
#rootname .root-char:nth-child(4){animation-delay:.36s}
#rootname .root-char:nth-child(5){animation-delay:.48s}
#rootname .root-char:nth-child(6){animation-delay:.60s}
#rootname .root-char:nth-child(7){animation-delay:.72s}
#rootname .root-char:nth-child(8){animation-delay:.84s}
#rootname .root-char:nth-child(9){animation-delay:.96s}
@keyframes rootMono{0%,100%{color:rgba(245,245,245,.62);text-shadow:none}50%{color:rgba(35,35,35,.58);text-shadow:none}}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e8e8e8;box-shadow:0 0 8px rgba(255,255,255,.45);margin-right:7px;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}

#bl{bottom:24px;left:22px}
#pick{width:132px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  font:500 .72rem var(--mono);letter-spacing:.08em;-webkit-user-select:none;user-select:none;will-change:transform}
#pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pick b{font-weight:400;opacity:.4;margin-left:8px}
#list{position:absolute;bottom:calc(100% + 14px);left:0;width:190px;max-height:200px;overflow-y:auto;padding:6px;border-radius:14px;
  background:rgba(8,8,8,.82);border:1px solid var(--line);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  box-shadow:0 18px 50px rgba(0,0,0,.6);
  opacity:0;visibility:hidden;transform:translateY(8px) scale(.97);transform-origin:bottom left;transition:all .25s cubic-bezier(.16,1,.3,1)}
#list.open{opacity:1;visibility:visible;transform:none}
.it{display:flex;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;font:500 .72rem var(--mono);color:var(--dim);letter-spacing:.06em;transition:.15s}
.it:hover{color:#fff;background:rgba(255,255,255,.04)}
.it em{font-style:normal;opacity:.5}
.it.act{color:#fff;background:rgba(255,255,255,.08)}

#cc{bottom:24px;left:50%;transform:translate(-50%,14px);display:flex;flex-direction:column;align-items:center;gap:12px}
body.in #cc{transform:translateX(-50%)}
#badge{padding:7px 15px;border-radius:10px;font:500 .66rem var(--mono);letter-spacing:.14em;display:flex;gap:9px;align-items:center}
#badge s{text-decoration:none;opacity:.4}
#dock{display:flex;padding:8px;gap:8px;border-radius:20px}

/* büyüteç butonları: ortak stil (--m = büyütme yoğunluğu, JS verir) */
.cb{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(255,255,255,calc(.05 + var(--m,0)*.18));
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,calc(var(--m,0)*.2)),rgba(255,255,255,calc(.035 + var(--m,0)*.05)) 72%);
  color:rgba(255,255,255,calc(.6 + var(--m,0)*.4));
  -webkit-user-select:none;user-select:none;will-change:transform}
.cb svg{width:16px;height:16px;fill:currentColor}

#br{bottom:24px;right:22px;display:flex;align-items:center;gap:18px;padding:8px 14px;height:50px}
#mute{width:34px;height:34px;border-radius:11px}
#mute svg{width:15px;height:15px}
#vol{position:relative;width:70px;height:16px;display:flex;align-items:center;will-change:transform}
#vol .tr{position:absolute;left:0;right:0;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
#vol .fl{position:absolute;left:0;height:5px;border-radius:3px;background:rgba(255,255,255,.8);transition:width .05s linear}
#vol input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}

#prog{position:fixed;left:0;bottom:0;height:2px;width:0;z-index:101;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));opacity:.7}

/* giriş */
#splash{position:fixed;inset:0;z-index:9999;background:#030303;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  transition:opacity 1s ease,visibility 1s,filter 1s,transform 1s}
#splash.out{opacity:0;visibility:hidden;filter:blur(14px);transform:scale(1.15);pointer-events:none}
#typed{font:500 1.15rem var(--mono);letter-spacing:.25em;min-height:1.6rem;position:relative}
#typed.gl{animation:tg .35s steps(2) 1}
@keyframes tg{0%{text-shadow:3px 0 #f0f,-3px 0 #0ff;transform:translateX(-3px)}50%{text-shadow:-4px 0 #f0f,4px 0 #0ff;transform:translateX(4px)}100%{text-shadow:none;transform:none}}
#typed u{display:inline-block;width:8px;height:1.1rem;background:#fff;vertical-align:middle;margin-left:5px;animation:bk .8s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
#enter{padding:11px 30px;border:1px solid rgba(255,255,255,.14);border-radius:99px;background:rgba(255,255,255,.025);color:rgba(255,255,255,.55);
  font:400 .72rem var(--mono);letter-spacing:.3em;cursor:pointer;opacity:0;pointer-events:none;will-change:transform;
  transition:opacity .4s ease,color .3s,border-color .3s,letter-spacing .3s,box-shadow .3s}
#enter:hover{color:#fff;letter-spacing:.38em;border-color:rgba(255,255,255,.55);box-shadow:0 0 30px rgba(255,255,255,.12)}
#enter.show{opacity:1;pointer-events:auto}

/* dokunmatik ekran: hover yok, basınca büyüsün */
@media(hover:none){
  .cb,#dc-btn,#dc-text,#pick{transition:transform .18s ease}
  .cb:active,#dc-btn:active,#dc-text:active{transform:scale(1.15)}
  #pick:active{transform:scale(1.06)}
}
@media(prefers-reduced-motion:reduce){.dot{animation:none}#bg.gl{animation:none}}

@media(max-width:768px){
  #tl{top:14px;left:14px;padding:8px 12px}
  #bl{left:14px;bottom:20px}#pick{width:104px;padding:10px 12px}
  #cc{bottom:20px}#br{right:14px;bottom:20px;padding:7px 11px;gap:16px}#vol{width:50px}
  .cb{width:40px;height:40px}#dock{gap:8px;padding:7px}
  #mute{width:34px;height:34px}
  #list{width:150px;bottom:calc(100% + 54px);max-height:180px;overflow-y:auto}
}
</style>
</head>
<body>

<div id="splash">
  <div id="typed"><span id="tt"></span><u id="cur"></u></div>
  <button id="enter" data-mag="1.22" data-sig="55">giriş</button>
</div>

<video id="bg" loop playsinline webkit-playsinline preload="none"></video>
<div class="vig"></div><div id="flash"></div>
<canvas id="fx"></canvas>

<div id="av-wrapper">
  <div id="avw"><div id="av"><img src="mert.PNG" alt=""></div></div>
  <div id="dc-row">
    <a id="dc-btn" data-mag="1.3" data-sig="45" aria-label="Discord" href="https://discord.gg/ebedi" target="_blank" rel="noopener" title="Discord">
    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .078-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.098.245.195.372.288a.077.077 0 0 1-.006.128c-.598.35-1.222.648-1.873.892-.041.016-.062.064-.041.106.356.699.768 1.364 1.225 1.994.019.027.054.038.085.029a19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
  </a>
    <a id="dc-text" data-mag="1.12" data-sig="60" href="https://discord.gg/ebedi" target="_blank" rel="noopener">ebedi</a>
  </div>
</div>

<div id="tl" class="ui g"><span id="rootname" aria-label="root@mert"><span class="root-char">r</span><span class="root-char">o</span><span class="root-char">o</span><span class="root-char">t</span><span class="root-char">@</span><span class="root-char">m</span><span class="root-char">e</span><span class="root-char">r</span><span class="root-char">t</span></span><i class="sep"></i><span><i class="dot"></i><span id="ping">-- ms</span></span><i class="sep"></i><span id="clock">00:00:00</span></div>

<div id="bl" class="ui">
  <div id="list"></div>
  <button id="pick" class="g" data-mag="1.04" data-sig="90"><span id="pickName">...</span><b>▴</b></button>
</div>

<div id="cc" class="ui">
  <div id="badge" class="g"><s id="num">01/17</s><span id="name">marvel</span></div>
  <div id="dock" class="g">
    <button class="cb" id="prev" data-mag="1.28" data-sig="34" aria-label="önceki"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="cb" id="pp" data-mag="1.28" data-sig="34" aria-label="oynat/durdur"><svg viewBox="0 0 24 24" id="ppi"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
    <button class="cb" id="next" data-mag="1.28" data-sig="34" aria-label="sonraki"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
  </div>
</div>

<div id="br" class="ui g">
  <button id="mute" class="cb" data-mag="1.22" data-sig="34" aria-label="sesi aç/kapat"><svg viewBox="0 0 24 24" id="mi"></svg></button>
  <div id="vol" data-mag="1.38" data-sig="58"><div class="tr"></div><div class="fl" id="fl"></div><input type="range" id="vs" min="0" max="1" step="0.01" value="0.5"></div>
</div>
<div id="prog"></div>

<script>
const vids = [
  {n:"batman",f:"batman.mp4"},
  {n:"bumblebee",f:"bee.mp4"},
  {n:"heathnes",f:"heathnes.MP4"},
  {n:"spiderman",f:"spiderman.mp4"},
  {n:"ironman",f:"ironman.MP4"},
  {n:"cod",f:"mw.MP4"},
  {n:"john wick",f:"john wick.MP4"},
  {n:"mother of dragon",f:"mother of dragon.MP4"},
  {n:"jurrasic",f:"jurrasic.MP4"},
  {n:"batman",f:"batman.MP4"},
  {n:"shadow",f:"shadow.mp4"},
  {n:"atreides",f:"atreides.mp4"},
  {n:"prime",f:"prime.mp4"},
  {n:"bumblebee",f:"bumblebee.mp4"},
  {n:"southpaw",f:"southpaw.MP4"},
  {n:"morty",f:"c137.mp4"},
  {n:"scream",f:"scream.mp4"}
];
const $ = id => document.getElementById(id);
const v = $('bg'), avw = $('avw'), av = $('av'), flash = $('flash');
let idx = 0, started = false, last = 0.5;
let actx, an, buf;

const ICON_ON  = '<path d="M13.5 4.06c0-1.34-1.62-2-2.56-1.06l-4.5 4.5H4.5C3.36 7.5 2.44 8.43 2.44 9.57v4.86c0 1.14.92 2.07 2.06 2.07h1.94l4.5 4.5c.94.95 2.56.28 2.56-1.06V4.06zM18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/>';
const ICON_OFF = '<path d="M13.5 4.06c0-1.34-1.62-2-2.56-1.06l-4.5 4.5H4.5C3.36 7.5 2.44 8.43 2.44 9.57v4.86c0 1.14.92 2.07 2.06 2.07h1.94l4.5 4.5c.94.95 2.56.28 2.56-1.06V4.06z"/><path d="M16 9.5l5 5m0-5l-5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>';
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

/* scramble (harfler karışıp yerine oturur) */
const CH = "▯▮01#$%&*+<>?/\\|";
function scramble(el, text, dur = 520){
  const t0 = performance.now();
  (function s(now){
    const p = Math.min((now - t0) / dur, 1);
    let out = "";
    for (let i = 0; i < text.length; i++){
      out += (text[i] === " " || i < text.length * p) ? text[i] : CH[Math.random()*CH.length|0];
    }
    el.textContent = out;
    if (p < 1) requestAnimationFrame(s);
  })(t0);
}

/* giriş yazısı */
const hi = "hi stalker";
let ci = 0;
(function type(){
  if (ci < hi.length) {
    $('tt').textContent += hi[ci++];
    if (Math.random() < .35) { $('typed').classList.remove('gl'); void $('typed').offsetWidth; $('typed').classList.add('gl'); }
    setTimeout(type, 90 + Math.random()*70);
  } else { $('cur').style.display = 'none'; $('enter').classList.add('show'); }
})();

/* video */
function load(i, fx = true){
  idx = (i + vids.length) % vids.length;
  v.classList.remove('on');
  v.src = vids[idx].f;
  v.load();
  v.play().catch(()=>{});
  if (fx) glitch();
  ui();
}
function glitch(){
  v.classList.remove('gl'); void v.offsetWidth; v.classList.add('gl');
  flash.animate([{opacity:.55},{opacity:0}],{duration:420,easing:'ease-out'});
  const n = $('name'); scramble(n, vids[idx].n);
  scramble($('pickName'), vids[idx].n);
}
v.addEventListener('loadeddata', () => v.classList.add('on'));

function ui(){
  const n = vids[idx].n;
  $('name').textContent = n;
  $('pickName').textContent = n;
  $('num').textContent = String(idx+1).padStart(2,'0') + '/' + String(vids.length).padStart(2,'0');
  $('list').innerHTML = vids.map((x,k) =>
    `<div class="it ${k===idx?'act':''}" data-k="${k}"><em>${String(k+1).padStart(2,'0')}</em>${x.n}</div>`).join('');
}
$('list').addEventListener('click', e => {
  const it = e.target.closest('.it'); if (!it) return;
  load(+it.dataset.k); setPP(true); $('list').classList.remove('open');
});
$('pick').onclick = e => { e.stopPropagation(); $('list').classList.toggle('open'); };
document.addEventListener('click', e => { if (!$('bl').contains(e.target)) $('list').classList.remove('open'); });

function setPP(p){ $('ppi').innerHTML = p ? PAUSE : PLAY; }
function toggle(){ if (v.paused) { v.play().catch(()=>{}); setPP(true); } else { v.pause(); setPP(false); } }
$('prev').onclick = () => { load(idx-1); setPP(true); };
$('next').onclick = () => { load(idx+1); setPP(true); };
$('pp').onclick = toggle;
v.addEventListener('ended', () => $('next').click());

/* ses */
function setVol(x){
  v.volume = x; v.muted = x === 0;
  $('fl').style.width = (x*100) + '%';
  $('mi').innerHTML = x === 0 ? ICON_OFF : ICON_ON;
  if (x > 0) last = x;
}
$('vs').oninput = e => setVol(+e.target.value);
$('mute').onclick = () => {
  const x = (v.muted || v.volume === 0) ? (last || .5) : 0;
  $('vs').value = x; setVol(x);
};
setVol(.5);

/* Web Audio */
function initAudio(){
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    an = actx.createAnalyser();
    an.fftSize = 256;
    an.smoothingTimeConstant = .55;
    const s = actx.createMediaElementSource(v);
    s.connect(an); an.connect(actx.destination);
    buf = new Uint8Array(an.frequencyBinCount);
  } catch(e){ console.log(e); }
}

function start(){
  if (started) return;
  started = true;
  $('splash').classList.add('out');
  document.body.classList.add('in');
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  load(0, false);
  v.muted = false; v.volume = +$('vs').value;
  v.play().then(()=>setPP(true)).catch(()=>{ v.muted = true; v.play(); setPP(true); });
  flash.animate([{opacity:.9},{opacity:0}],{duration:900,easing:'ease-out'});
}
$('enter').onclick = start;

addEventListener('keydown', e => {
  if (!started) { if (e.key === 'Enter') start(); return; }
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('prev').click();
  else if (e.key.toLowerCase() === 'm') $('mute').click();
});

/* saat, ping */
const pad = n => String(n).padStart(2,'0');
function tick(){ const d = new Date(); $('clock').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
setInterval(tick, 1000); tick();
/* ping: ziyaretçinin kendi internet gecikmesi (Cloudflare'in en yakın sunucusuna) */
const PING_URL = 'https://www.cloudflare.com/cdn-cgi/trace';
async function once(){
  const t = performance.now();
  await fetch(PING_URL + '?t=' + Date.now(), {mode:'no-cors', cache:'no-store'});
  return performance.now() - t;
}
let pingAvg = 0;
async function ping(){
  try {
    await once();                       /* ilk istek bağlantı kurulumunu içerir, sayılmaz */
    const ms = Math.min(await once(), await once());
    pingAvg = pingAvg ? pingAvg*.6 + ms*.4 : ms;
    $('ping').textContent = Math.round(pingAvg) + ' ms';
  } catch { $('ping').textContent = navigator.onLine ? '-- ms' : 'offline'; }
}
ping(); setInterval(ping, 5000);

/* sekme başlığı animasyonu */
const T = "forever", seq = [];
for (let i = 1; i <= T.length; i++) seq.push(T.slice(0,i));
for (let i = T.length - 1; i >= 1; i--) seq.push(T.slice(0,i));
let ti = 0; setInterval(() => { document.title = seq[ti++ % seq.length] + "_"; }, 400);

/* canvas: parçacıklar + ses halkası + dalga efekti */
const cv = $('fx'), cx = cv.getContext('2d');
let W, H, D;
function rs(){ D = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; cv.width = W*D; cv.height = H*D; cx.setTransform(D,0,0,D,0,0); }
rs(); addEventListener('resize', rs);
const P = Array.from({length: innerWidth < 768 ? 40 : 80}, () => ({
  x: Math.random()*innerWidth, y: Math.random()*innerHeight,
  vx: (Math.random()-.5)*.35, vy: (Math.random()-.5)*.35, r: Math.random()*1.5+.4
}));
const ripples = [];
let mx = innerWidth/2, my = innerHeight/2, tx = 0, ty = 0;
function pointer(x, y){ mx = x; my = y; tx = (x/W - .5); ty = (y/H - .5);  }
addEventListener('mousemove', e => pointer(e.clientX, e.clientY));
addEventListener('touchmove', e => pointer(e.touches[0].clientX, e.touches[0].clientY), {passive:true});

let sc = 1, lvl = 0, hue = 0;
function frame(t){
  requestAnimationFrame(frame);
  let target = 0;
  const live = !v.paused && buf && !v.muted;
  if (live) {
    an.getByteFrequencyData(buf);
    let bass = 0;
    for (let i = 0; i < 4; i++) bass += buf[i];
    bass = bass / 4 / 255;
    target = Math.pow(bass, 1.8) * 1.4;
  }
  lvl += (target - lvl) * (target > lvl ? .7 : .18);

  const idle = live ? 0 : (.5 + .5*Math.sin(t/1000)) * .015;
  sc = .95 + lvl * .42 + idle;
  avw.style.transform = `translate(${tx*14}px,${ty*14}px) scale(${sc})`;
  av.style.boxShadow = `0 0 ${lvl * 26}px rgba(255,255,255,${Math.min(lvl * 0.22, .35)})`;
  if (started) v.style.transform = `scale(${1.04 + lvl*.01}) translate(${-tx*8}px,${-ty*8}px)`;

  cx.clearRect(0, 0, W, H);

  /* tıklama dalgaları */
  for (let i = ripples.length - 1; i >= 0; i--){
    const r = ripples[i]; r.r += 7; r.a *= .955;
    cx.strokeStyle = `rgba(255,255,255,${r.a})`; cx.lineWidth = 1.5;
    cx.beginPath(); cx.arc(r.x, r.y, r.r, 0, 6.283); cx.stroke();
    if (r.a < .02) ripples.splice(i, 1);
  }

  if (started && v.duration) $('prog').style.width = (v.currentTime/v.duration*100) + '%';
}
requestAnimationFrame(frame);

/* büyüteç efekti: imleç yaklaştıkça butonlar dock gibi büyür */
(function(){
  const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
  if (!fine || calm) return;

  const GAP = 8;
  const items = [...document.querySelectorAll('[data-mag]')].map(el => ({
    el, dock: !!el.closest('#dock'),
    max: +el.dataset.mag, sig: +(el.dataset.sig || 40),
    s: 1, cx: 0, cy: 0, w: 0, shift: 0, press: false
  }));
  const dockItems = items.filter(o => o.dock);
  let px = -9999, py = -9999, raf = 0, measured = false;

  function measure(){
    items.forEach(o => {
      const keep = o.el.style.transform;
      o.el.style.transform = 'none';
      const r = o.el.getBoundingClientRect();
      o.cx = r.left + r.width/2; o.cy = r.top + r.height/2; o.w = r.width;
      o.el.style.transform = keep;
    });
    measured = true;
  }
  addEventListener('resize', () => { measured = false; setTimeout(measure, 120); });
  addEventListener('load', () => setTimeout(measure, 1800));
  $('enter').addEventListener('click', () => setTimeout(measure, 1700));
  setTimeout(measure, 300);

  function wake(){ if (!raf) raf = requestAnimationFrame(step); }

  function step(){
    raf = 0;
    if (!measured) return;
    const near = px > -9000;
    let busy = false;

    items.forEach(o => {
      let t = 1;
      const hidden = o.el.id === 'enter' && !o.el.classList.contains('show');
      if (near && !hidden){
        const dx = px - o.cx, dy = py - o.cy;
        t = 1 + (o.max - 1) * Math.exp(-(dx*dx + dy*dy) / (2*o.sig*o.sig));
        if (o.press) t *= .92;
      }
      o.s += (t - o.s) * .22;
      if (Math.abs(t - o.s) > .003) busy = true; else o.s = t;
    });

    /* dock: büyüyen butonlar komşuları iter, toplam ortada kalır */
    if (dockItems.length){
      const n = dockItems.length;
      const total = dockItems.reduce((a,o) => a + o.w*o.s, 0) + GAP*(n-1);
      const c = (dockItems[0].cx + dockItems[n-1].cx) / 2;
      let x = c - total/2;
      dockItems.forEach(o => { o.shift = x + o.w*o.s/2 - o.cx; x += o.w*o.s + GAP; });
    }

    items.forEach(o => {
      const k = Math.max(0, Math.min(1, (o.s - 1) / (o.max - 1)));
      if (o.s < 1.003 && !o.press){
        o.el.style.transform = ''; o.el.style.zIndex = '';
        o.el.style.removeProperty('--m');
        return;
      }
      const lift = -(o.s - 1) * (o.dock ? 7 : 3);
      o.el.style.transform = `translate(${o.dock ? o.shift : 0}px,${lift}px) scale(${o.s})`;
      o.el.style.zIndex = Math.round(o.s * 10);
      o.el.style.setProperty('--m', k.toFixed(3));
    });

    if (busy) wake();
  }

  addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    px = e.clientX; py = e.clientY; wake();
  }, {passive:true});
  document.documentElement.addEventListener('pointerleave', () => { px = py = -9999; wake(); });
  items.forEach(o => {
    o.el.addEventListener('pointerdown', () => { o.press = true; wake(); });
  });
  addEventListener('pointerup', () => { items.forEach(o => o.press = false); wake(); });
})();
</script>
