<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>radw</title>
    <link rel="icon" type="image/jpeg" href="radw.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --border-color: rgba(255, 255, 255, 0.12);
            --glass-bg: rgba(15, 15, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100dvh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-text {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #717175 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 1.1em;
            display: flex;
            align-items: center;
        }

        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 0.8em;
            background-color: #ffffff;
            margin-left: 6px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .enter-btn {
            background: rgba(20, 20, 25, 0.8);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            padding: 12px 28px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            animation: fadeInBtn 0.8s forwards 1.2s;
        }

        .enter-btn:hover {
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(35, 35, 45, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .enter-btn:active {
            transform: scale(0.96) translateY(0);
        }

        @keyframes fadeInBtn {
            to { opacity: 1; }
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(3, 3, 5, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            padding-top: env(safe-area-inset-top);
            height: calc(52px + env(safe-area-inset-top));
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-group.right {
            justify-content: flex-end;
        }

        .nav-btn {
            background: rgba(20, 20, 25, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-logo {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-decoration: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .system-info {
            display: none;
        }

        @media (min-width: 480px) {
            .system-info {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 0.7rem;
                font-weight: 500;
                color: var(--text-secondary);
            }
            .system-info .clock-val {
                color: var(--text-primary);
                font-variant-numeric: tabular-nums;
            }
            .ping-val {
                color: #32d74b;
                font-variant-numeric: tabular-nums;
            }
        }

        .bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            z-index: 1;
            background: #000;
        }

        .bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
            filter: brightness(1.05) contrast(1.02);
        }

        .video-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }

        .content-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            gap: 16px;
            text-align: center;
        }

        .main-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7), 0 0 25px rgba(0,0,0,0.5);
        }

        .main-subtitle {
            font-size: 1rem;
            font-weight: 400;
            font-style: italic;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.08em;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
        }

        .overlay-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(3, 3, 5, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
        }

        .overlay-menu.open {
            opacity: 1;
            visibility: visible;
        }

        .menu-card {
            background: rgba(12, 12, 16, 0.85);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: 22px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transform: translateY(20px) scale(0.97);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .overlay-menu.open .menu-card {
            transform: translateY(0) scale(1);
        }

        .menu-header {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-primary);
            text-align: left;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 5px;
            text-align: center;
        }

        .audio-dock {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(15, 15, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .audio-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
        }

        .audio-icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .audio-slider-container {
            display: flex;
            align-items: center;
            width: 90px;
        }

        .audio-slider {
            width: 90px;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-text"><span id="typewriter"></span><span class="cursor-blink"></span></div>
        <button class="enter-btn" id="enterBtn">giriş</button>

    <nav>

        </div>
        <a href="#" class="nav-logo">radw</a>

        <div class="menu-card">

            <div class="menu-list" id="videoList"></div>
            <button class="close-btn" id="closePanelBtn">kapat</button>
        </div>
    </div>

    <div class="overlay-menu" id="socialModal">
        <div class="menu-card">
            <div class="menu-header">sosyal</div>
            <div class="menu-list">
                <a href="https://open.spotify.com/user/317c2weftqao52xztynzzozjboyi?si=B-LYuz_hRzKZFmEVQajlzQ&utm_source=copy-link" target="_blank" class="menu-item" onclick="playThumpSound()">
                    <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.599-.12-.42.18-.78.6-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.54.72.24 1.08zm1.44-3.84c-.301.48-.921.6-1.401.3-3.24-1.98-8.16-2.58-11.94-1.44-.54.18-1.14-.12-1.32-.66-.18-.54.12-1.14.66-1.32 4.38-1.32 9.84-.66 13.62 1.68.48.3.66.96.38 1.44zm.12-4C15.24 7.32 8.82 7.14 5.16 8.28c-.66.18-1.38-.18-1.56-.84-.18-.66.18-1.38.84-1.56 4.32-1.32 11.52-1.14 15.96 1.5.6.36.78 1.14.42 1.74-.36.6-1.14.78-1.74.42z"/></svg>
                    Spotify
                </a>
                <a href="https://www.instagram.com/radwoxie?igsi=dGZqcjIwZDZwcDUw&utm_source=qr" target="_blank" class="menu-item" onclick="playThumpSound()">

            <button class="close-btn" id="closeSocialBtn">kapat</button>

    <div class="audio-dock" id="audioDock">
        <button class="audio-icon-btn" id="muteToggleBtn" title="Sesi Aç/Kapat">
            <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.068.926-2.068 2.068v6.864c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/></svg>
        </button>

            <input type="range" class="audio-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
        </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('liveClock');
            if(clockEl) clockEl.textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function measurePing() {
            const startTime = performance.now();
            fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
                .then(() => {
                    const duration = Math.round(performance.now() - startTime);
                    const pingEl = document.getElementById('livePing');
                    if(pingEl) pingEl.textContent = `${duration}ms`;
                })
                .catch(() => {
                    const pingEl = document.getElementById('livePing');
                    if(pingEl) pingEl.textContent = '12ms';
                });
        }
        setInterval(measurePing, 5000);
        measurePing();

        function playThumpSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(110, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        const textToType = "radw";
        const typewriterElement = document.getElementById('typewriter');
        const splashScreen = document.getElementById('splash-screen');
        const enterBtn = document.getElementById('enterBtn');
        let charIndex = 0;
        let hasInteracted = false;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typewriterElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 180);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeWriter, 200);
            initVideoPlaylist();
        });

        const videos = [
            { name: "how deep is your love", src: "how%20deep%20is%20your%20love.mp4" },
            { name: "pagani", src: "pagani.mp4" },
            { name: "jordan", src: "jordan.mp4" },
            { name: "south", src: "south.mp4" },
            { name: "paw", src: "paw.mp4" }
        ];

        let currentVideoIndex = 0;
        const bgVideo = document.getElementById('bgVideo');
        const videoListContainer = document.getElementById('videoList');

        function initVideoPlaylist() {
            videoListContainer.innerHTML = '';
            videos.forEach((vid, index) => {
                const item = document.createElement('div');
                item.className = `menu-item ${index === currentVideoIndex ? 'active' : ''}`;
                item.innerText = vid.name;
                item.addEventListener('click', () => {
                    playThumpSound();
                    switchVideo(index);
                    togglePanel(false);
                });
                videoListContainer.appendChild(item);
            });
        }

        function switchVideo(index) {
            currentVideoIndex = index;
            bgVideo.src = videos[currentVideoIndex].src;
            bgVideo.load();
            const vol = parseFloat(document.getElementById('volumeSlider').value);
            bgVideo.volume = vol;
            bgVideo.muted = (vol === 0);
            bgVideo.play().catch(() => {});
            
            document.querySelectorAll('#videoList .menu-item').forEach((el, idx) => {
                if (idx === index) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function startSite() {
            if (hasInteracted) return;
            hasInteracted = true;
            playThumpSound();
            splashScreen.classList.add('fade-out');
            switchVideo(0);
        }

        enterBtn.addEventListener('click', startSite);
        enterBtn.addEventListener('touchend', startSite);

        const panelModal = document.getElementById('panelModal');
        const socialModal = document.getElementById('socialModal');

        function togglePanel(open) {
            playThumpSound();
            if (open) panelModal.classList.add('open');
            else panelModal.classList.remove('open');
        }

        function toggleSocial(open) {
            playThumpSound();
            if (open) socialModal.classList.add('open');
            else socialModal.classList.remove('open');
        }

        document.getElementById('panelBtn').addEventListener('click', () => togglePanel(true));
        document.getElementById('closePanelBtn').addEventListener('click', () => togglePanel(false));
        
        document.getElementById('meBtn').addEventListener('click', () => toggleSocial(true));
        document.getElementById('closeSocialBtn').addEventListener('click', () => toggleSocial(false));

        panelModal.addEventListener('click', (e) => { if (e.target === panelModal) togglePanel(false); });
        socialModal.addEventListener('click', (e) => { if (e.target === socialModal) toggleSocial(false); });

        const volumeSlider = document.getElementById('volumeSlider');
        const muteToggleBtn = document.getElementById('muteToggleBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        let lastVolume = 0.5;

        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            bgVideo.volume = vol;
            bgVideo.muted = (vol === 0);
            updateVolumeIcon(vol);
            if (vol > 0) lastVolume = vol;
        });

        muteToggleBtn.addEventListener('click', () => {
            playThumpSound();
            if (bgVideo.muted || bgVideo.volume === 0) {
                bgVideo.muted = false;
                bgVideo.volume = lastVolume > 0 ? lastVolume : 0.5;
                volumeSlider.value = bgVideo.volume;
                updateVolumeIcon(bgVideo.volume);
            } else {
                lastVolume = bgVideo.volume;
                bgVideo.muted = true;
                bgVideo.volume = 0;
                volumeSlider.value = 0;
                updateVolumeIcon(0);
            }
        });
