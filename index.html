<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radw :: Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
            overflow: hidden;
            background: #000;
        }

        /* Parçacık Efekti Kanvası */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* İlk Giriş Ekranı */
        .entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .entry-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .entry-text {
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Arka Plan Videosu */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.6);
        }

        /* Ortadaki Buzlu Cam Kart */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 380px;
            padding: 40px 25px 25px 25px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 18px;
        }

        .title {
            font-size: 2rem;
            font-style: italic;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* Sosyal Medya İkonları Alanı */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .social-icon {
            display: inline-block;
            opacity: 0.9;
            transition: transform 0.3s, opacity 0.3s;
        }
        .social-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .social-icon svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .audio-player {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
        }

        .volume-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #mute-btn {
            cursor: pointer;
            font-size: 0.85rem;
        }

        .slider-input {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, #ffffff 70%, rgba(255, 255, 255, 0.3) 70%);
            outline: none;
            cursor: pointer;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .slider-input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Ziyaretçi Sayacı Tasarımı */
        .visitor-counter {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .visitor-counter span {
            color: #fff;
            font-weight: 700;
        }

        /* Geliştirilmiş Kayan Yazı Şeridi */
        .marquee-container {
            position: absolute;
            bottom: -35px;
            left: 0;
            width: 100%;
            height: 30px;
            overflow: hidden;
            z-index: 20;
            display: flex;
            align-items: center;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: marqueeScroll 20s linear infinite;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6))
                      drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.8));
        }

        @keyframes marqueeScroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

        <div class="audio-player">
            <div class="volume-bar">
                <span id="mute-btn">🔊</span>
                <input type="range" id="volume-slider" class="slider-input" min="0" max="100" value="70">

        </div>

        <!-- Ziyaretçi Sayacı -->
        <div class="visitor-counter">
            👁️ Görüntülenme: <span id="visit-count">436</span>
        </div>

        <!-- Kayan Yazı -->
        <div class="marquee-container">
            <div class="marquee-text">
                // 7/24 online // radar aktif // mert keskin // system ready // 7/24 online // radar aktif // mert keskin // system ready //
            </div>
        </div>
    </div>

    <script>
        // Ses Kontrol Scripti
        const entryScreen = document.getElementById('entry-screen');
        const video = document.getElementById('bg-video');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');
        let lastVolume = 70;

        entryScreen.addEventListener('click', function() {
            entryScreen.classList.add('hidden');
            video.muted = false;
            video.volume = 0.7;
            setVolumeUI(70);
        });

        function setVolumeUI(val) {
            volumeSlider.value = val;
            volumeSlider.style.background = `linear-gradient(to right, #ffffff ${val}%, rgba(255, 255, 255, 0.3) ${val}%)`;
            
            if (val == 0 || video.muted) {
                muteBtn.textContent = '🔇';
            } else if (val < 50) {
                muteBtn.textContent = '🔉';
            } else {
                muteBtn.textContent = '🔊';
            }
        }

        volumeSlider.addEventListener('input', function() {
            var val = this.value;
            video.volume = val / 100;
            video.muted = (val == 0);
            setVolumeUI(val);
        });

        muteBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (video.muted || video.volume === 0) {
                video.muted = false;
                var targetVol = lastVolume > 0 ? lastVolume : 70;
                video.volume = targetVol / 100;
                setVolumeUI(targetVol);
            } else {
                lastVolume = volumeSlider.value;
                video.muted = true;
                setVolumeUI(0);
            }
        });

        // Ziyaretçi Sayacı Mantığı
        let visits = localStorage.getItem('site_visits');
        if (!visits) {
            visits = 436;
        } else {
            visits = parseInt(visits) + 1;
        }
        localStorage.setItem('site_visits', visits);
        document.getElementById('visit-count').textContent = visits;

        // Fare Parçacık Efekti Scripti
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('mousemove', function(event) {
            for (let i = 0; i < 2; i++) {
                particles.push({
                    x: event.x,
                    y: event.y,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: (Math.random() - 0.5) * 2,
                    life: 100
                });
            }
        });

        function handleParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= 2;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life / 100})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            requestAnimationFrame(handleParticles);
        }
        handleParticles();
    </script>
</body>
