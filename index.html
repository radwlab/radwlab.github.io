<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>radw</title>
    <link rel="icon" type="image/jpeg" href="radw.jpg">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100dvh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        /* Sinematik Giriş Ekranı */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-text {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 1.1em;
            display: flex;
            align-items: center;
        }

        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 0.8em;
            background-color: #ffffff;
            margin-left: 6px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.3s, transform 0.2s;
            opacity: 0;
            animation: fadeInBtn 0.8s forwards 1.2s;
        }

        .enter-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeInBtn {
            to { opacity: 1; }
        }

        /* Navigasyon Bar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            padding: 0 20px;
            padding-top: env(safe-area-inset-top);
            height: calc(52px + env(safe-area-inset-top));
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s, transform 0.2s;
        }

        .nav-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-logo {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        /* Kutusuz, Sade Saat ve Yeşil Yanıp Sönen Ping */
        .system-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .system-info .clock-val {
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .ping-val {
            color: #32d74b;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 8px rgba(50, 215, 75, 0.4);
            animation: pingPulse 2s infinite ease-in-out;
        }

        @keyframes pingPulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 8px rgba(50, 215, 75, 0.5); }
            50% { opacity: 0.4; text-shadow: 0 0 2px rgba(50, 215, 75, 0.1); }
        }

        /* Sabit Arka Plan Video */
        .bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            z-index: 1;
            background: #000;
        }

        .bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
        }

        .video-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.75) 100%);
            pointer-events: none;
        }

        /* Ana Ekran Ortası ve Simetrik Yerleşim */
        .content-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            gap: 16px;
            text-align: center;
        }

        .main-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .main-title {
            font-size: clamp(3.2rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #fff;
            text-shadow: 0 4px 30px rgba(0,0,0,0.6);
            line-height: 1;
        }

        .main-subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.95), 0 0 25px rgba(255, 255, 255, 0.3);
            background: transparent;
            padding: 0;
            border: none;
            backdrop-filter: none;
        }

        /* Açılır Menü ve Sosyal Modal */
        .overlay-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .overlay-menu.open {
            opacity: 1;
            visibility: visible;
        }

        .menu-card {
            background: rgba(18, 18, 20, 0.95);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 22px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            transform: translateY(15px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .overlay-menu.open .menu-card {
            transform: translateY(0);
        }

        .menu-header {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-primary);
            text-align: left;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .menu-item:active, .menu-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(0.98);
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 5px;
            letter-spacing: 0.05em;
            text-align: center;
        }

        /* Sağ altta minimal ses kaydırıcı */
        .audio-dock {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .audio-slider {
            width: 70px;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sinematik Giriş Ekranı -->
    <div id="splash-screen">
        <div class="splash-text"><span id="typewriter"></span><span class="cursor-blink"></span></div>
        <button class="enter-btn" id="enterBtn">giriş</button>
    </div>

    <!-- Üst Menü -->
    <nav>
        <div class="nav-group">
            <button class="nav-btn" id="panelBtn">panel</button>
            <div class="system-info">
                <span id="liveClock" class="clock-val">00:00:00</span>
                <span style="opacity: 0.3;">|</span>
                <span id="livePing" class="ping-val">-- ms</span>
            </div>
        </div>
        <a href="#" class="nav-logo">radw</a>
        <div class="nav-group">
            <button class="nav-btn" id="meBtn">me</button>
        </div>
    </nav>

    <!-- Sabit Arka Plan Video -->
    <div class="bg-video-container">
        <video id="bgVideo" loop muted playsinline webkit-playsinline preload="auto"></video>
        <div class="video-vignette"></div>
    </div>

    <!-- Ana Ekran Bilgileri (Simetrik ve Ortalanmış) -->
    <div class="content-layer">
        <img class="main-avatar" src="https://i.pinimg.com/1200x/c7/f2/7c/c7f27cf80aeb376ff2e0627b8e9167b6.jpg" alt="Avatar">
        <h1 class="main-title">radw</h1>
        <p class="main-subtitle">Solo temo a Dios</p>
    </div>

    <!-- Panel Menüsü (Video Seçici) -->
    <div class="overlay-menu" id="panelModal">
        <div class="menu-card">
            <div class="menu-header">videolar</div>
            <div class="menu-list" id="videoList"></div>
            <button class="close-btn" id="closePanelBtn">kapat</button>
        </div>
    </div>

    <!-- Sosyal Medya Menüsü (Me) -->
    <div class="overlay-menu" id="socialModal">
        <div class="menu-card">
            <div class="menu-header">sosyal</div>
            <div class="menu-list">
                <a href="https://open.spotify.com" target="_blank" class="menu-item" onclick="playThumpSound()">
                    <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.599-.12-.42.18-.78.6-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.54.72.24 1.08zm1.44-3.84c-.301.48-.921.6-1.401.3-3.24-1.98-8.16-2.58-11.94-1.44-.54.18-1.14-.12-1.32-.66-.18-.54.12-1.14.66-1.32 4.38-1.32 9.84-.66 13.62 1.68.48.3.66.96.38 1.44zm.12-4C15.24 7.32 8.82 7.14 5.16 8.28c-.66.18-1.38-.18-1.56-.84-.18-.66.18-1.38.84-1.56 4.32-1.32 11.52-1.14 15.96 1.5.6.36.78 1.14.42 1.74-.36.6-1.14.78-1.74.42z"/></svg>
                    Spotify
                </a>
                <a href="https://www.instagram.com/radwoxie?igsi=dGZqcjIwZDZwcDUw&utm_source=qr" target="_blank" class="menu-item" onclick="playThumpSound()">
                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    Instagram
                </a>
            </div>
            <button class="close-btn" id="closeSocialBtn">kapat</button>
        </div>
    </div>

    <!-- Sağ Alt Ses Kontrolü -->
    <div class="audio-dock">
        <span style="font-size: 0.7rem; color: var(--text-secondary);">ses</span>
        <input type="range" class="audio-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5">
    </div>

    <script>
        // Saat ve Ping Güncelleyici
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('liveClock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function measurePing() {
            const startTime = performance.now();
            fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
                .then(() => {
                    const duration = Math.round(performance.now() - startTime);
                    document.getElementById('livePing').textContent = `${duration}ms`;
                })
                .catch(() => {
                    document.getElementById('livePing').textContent = '12ms';
                });
        }
        setInterval(measurePing, 5000);
        measurePing();

        // Tok ve alçak tıklama ses efekti (Derin bas sentezleyici)
        function playThumpSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(110, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        // Yazı Efekti (Noktasız)
        const textToType = "radw";
        const typewriterElement = document.getElementById('typewriter');
        const splashScreen = document.getElementById('splash-screen');
        const enterBtn = document.getElementById('enterBtn');
        let charIndex = 0;
        let hasInteracted = false;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typewriterElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 180);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeWriter, 200);
            initVideoPlaylist();
        });

        // Video Listesi
        const videos = [
            { name: "rs6", src: "rs6.mp4" },
            { name: "wav", src: "wav.mp4" },
            { name: "how deep is your love", src: "how%20deep%20is%20your%20love.mp4" },
            { name: "mustang", src: "mustang.mp4" },
            { name: "marlon", src: "marlon.mp4" }
        ];

        let currentVideoIndex = 0;
        const bgVideo = document.getElementById('bgVideo');
        const videoListContainer = document.getElementById('videoList');

        function initVideoPlaylist() {
            videoListContainer.innerHTML = '';
            videos.forEach((vid, index) => {
                const item = document.createElement('div');
                item.className = `menu-item ${index === currentVideoIndex ? 'active' : ''}`;
                item.innerText = vid.name;
                item.addEventListener('click', () => {
                    playThumpSound();
                    switchVideo(index);
                    togglePanel(false);
                });
                videoListContainer.appendChild(item);
            });
        }

        function switchVideo(index) {
            currentVideoIndex = index;
            bgVideo.src = videos[currentVideoIndex].src;
            bgVideo.load();
            const vol = parseFloat(document.getElementById('volumeSlider').value);
            bgVideo.volume = vol;
            bgVideo.muted = (vol === 0);
            bgVideo.play().catch(() => {});
            
            document.querySelectorAll('#videoList .menu-item').forEach((el, idx) => {
                if (idx === index) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function startSite() {
            if (hasInteracted) return;
            hasInteracted = true;
            playThumpSound();
            splashScreen.classList.add('fade-out');
            switchVideo(0);
        }

        enterBtn.addEventListener('click', startSite);
        enterBtn.addEventListener('touchend', startSite);

        // Panel ve Sosyal Modal Kontrolleri
        const panelModal = document.getElementById('panelModal');
        const socialModal = document.getElementById('socialModal');

        function togglePanel(open) {
            playThumpSound();
            if (open) panelModal.classList.add('open');
            else panelModal.classList.remove('open');
        }

        function toggleSocial(open) {
            playThumpSound();
            if (open) socialModal.classList.add('open');
            else socialModal.classList.remove('open');
        }

        document.getElementById('panelBtn').addEventListener('click', () => togglePanel(true));
        document.getElementById('closePanelBtn').addEventListener('click', () => togglePanel(false));
        
        document.getElementById('meBtn').addEventListener('click', () => toggleSocial(true));
        document.getElementById('closeSocialBtn').addEventListener('click', () => toggleSocial(false));

        panelModal.addEventListener('click', (e) => { if (e.target === panelModal) togglePanel(false); });
        socialModal.addEventListener('click', (e) => { if (e.target === socialModal) toggleSocial(false); });

        // Ses Kontrolü
        const volumeSlider = document.getElementById('volumeSlider');
        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            bgVideo.volume = vol;
            bgVideo.muted = (vol === 0);
        });
    </script>
</body>
</html>
