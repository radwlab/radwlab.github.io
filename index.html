<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/png" href="mertbest.png">
    <link rel="apple-touch-icon" href="mertbest.png">
    <title>forever</title>
    <style>
        :root {
            --black: #000;
            --white: #fff;
            --muted: rgba(255,255,255,.48);
            --glass: rgba(8,8,10,.58);
            --border: rgba(255,255,255,.09);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            scrollbar-width: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* =========================
           GİRİŞ
        ========================= */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 25px;
            background: #000;
            transition:
                opacity .65s ease,
                visibility .65s ease;
        }
        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .intro {
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 25px;
        }
        .typewriter-text {
            font-family: monospace;
            font-size: 14px;
            letter-spacing: .16em;
            color: rgba(255,255,255,.9);
        }
        .cursor {
            width: 7px;
            height: 15px;
            background: #fff;
            animation: blink .75s infinite;
        }
        @keyframes blink {
            0%, 45% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }
        .enter-btn {
            appearance: none;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.035);
            color: #fff;
            border-radius: 12px;
            padding: 11px 26px;
            font-size: 12px;
            letter-spacing: .13em;
            cursor: pointer;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition:
                opacity .5s ease,
                transform .5s ease,
                background .2s ease,
                border-color .2s ease;
        }
        .enter-btn.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .enter-btn:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.25);
        }
        /* =========================
           VIDEO
        ========================= */
        .video-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: #000;
        }
        .video-layer::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    180deg,
                    rgba(0,0,0,.32) 0%,
                    transparent 30%,
                    transparent 65%,
                    rgba(0,0,0,.5) 100%
                );
            pointer-events: none;
        }
        #bgVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.01);
        }
        /* =========================
           ÜST DURUM
        ========================= */
        .status {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 15px 45px rgba(0,0,0,.3);
            font-size: 10px;
            letter-spacing: .08em;
        }
        .online {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,.72);
        }
        .online-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,.9);
        }
        .separator {
            width: 1px;
            height: 11px;
            background: rgba(255,255,255,.13);
        }
        #clockText {
            color: rgba(255,255,255,.7);
            font-variant-numeric: tabular-nums;
        }
        /* =========================
           SES TEPKİLİ MERKEZ
        ========================= */
        .center-stage {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 20;
            width: 170px;
            height: 170px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        /*
            Büyük halka yok.
            Sadece küçük ve ince bir halka.
        */
        .mini-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 108px;
            height: 108px;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 50%;
            opacity: .35;
            box-shadow:
                0 0 10px rgba(255,255,255,.08);
            will-change:
                transform,
                opacity,
                box-shadow;
        }
        .mini-ring::before {
            content: "";
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(255,255,255,.055);
            border-radius: 50%;
        }
        /*
            Avatar
        */
        .avatar-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 94px;
            height: 94px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            padding: 2px;
            background: rgba(255,255,255,.13);
            box-shadow:
                0 0 0 1px rgba(255,255,255,.06),
                0 0 25px rgba(0,0,0,.95);
            will-change:
                transform,
                box-shadow,
                border-radius;
        }
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }
        /*
            Bass vurduğunda arkadan büyüyen ışık.
        */
        .audio-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #fff;
            filter: blur(32px);
            opacity: .08;
            z-index: -1;
            will-change:
                transform,
                opacity;
        }
        /* =========================
           TRACK
        ========================= */
        .track-info {
            position: fixed;
            left: 50%;
            bottom: 105px;
            z-index: 100;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            width: max-content;
            max-width: 70vw;
        }
        .track-small {
            font-size: 8px;
            letter-spacing: .22em;
            color: rgba(255,255,255,.35);
            text-transform: uppercase;
            margin-bottom: 7px;
        }
        #marqueeText {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .13em;
            text-transform: lowercase;
            color: rgba(255,255,255,.85);
        }
        /* =========================
           ALT KONTROLLER
        ========================= */
        .bottom-bar {
            position: fixed;
            left: 50%;
            bottom: 25px;
            z-index: 100;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 15px 50px rgba(0,0,0,.45);
        }
        .control {
            width: 34px;
            height: 32px;
            border: 1px solid rgba(255,255,255,.045);
            border-radius: 9px;
            background: rgba(255,255,255,.025);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition:
                background .18s ease,
                border-color .18s ease,
                transform .18s ease;
        }
        .control:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.14);
        }
        .control:active {
            transform: scale(.92);
        }
        .control svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }
        /* =========================
           VIDEO SEÇİCİ
        ========================= */
        .selector {
            position: fixed;
            left: 24px;
            bottom: 25px;
            z-index: 100;
        }
        .selector-button {
            height: 46px;
            min-width: 120px;
            padding: 0 13px;
            display: flex;
            align-items: center;
            gap: 9px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--glass);
            color: #fff;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            cursor: pointer;
            transition: .2s ease;
        }
        .selector-button:hover {
            background: rgba(20,20,22,.75);
            border-color: rgba(255,255,255,.18);
        }
        .selector-icon {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,.6);
            flex-shrink: 0;
        }
        .selector-name {
            font-size: 10px;
            letter-spacing: .08em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .selector-arrow {
            margin-left: auto;
            width: 9px;
            height: 9px;
            border-right: 1px solid rgba(255,255,255,.6);
            border-bottom: 1px solid rgba(255,255,255,.6);
            transform: rotate(45deg) translateY(-2px);
        }
        .video-menu {
            position: absolute;
            left: 0;
            bottom: 55px;
            width: 190px;
            padding: 7px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: rgba(5,5,7,.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 60px rgba(0,0,0,.65);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px) scale(.97);
            transform-origin: bottom left;
            transition: .2s ease;
        }
        .video-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .video-item {
            width: 100%;
            padding: 9px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: rgba(255,255,255,.62);
            font-size: 10px;
            text-align: left;
            cursor: pointer;
            transition: .15s ease;
        }
        .video-item:hover {
            color: #fff;
            background: rgba(255,255,255,.055);
        }
        .video-item.active {
            color: #fff;
            background: rgba(255,255,255,.085);
        }
        .item-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            opacity: .5;
        }
        /* =========================
           SES
        ========================= */
        .volume {
            position: fixed;
            right: 24px;
            bottom: 25px;
            z-index: 100;
            height: 46px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .volume-button {
            width: 17px;
            height: 17px;
            border: 0;
            background: transparent;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: .7;
        }
        .volume-button:hover {
            opacity: 1;
        }
        .volume-button svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }
        .slider {
            width: 65px;
            height: 3px;
            appearance: none;
            -webkit-appearance: none;
            background: rgba(255,255,255,.12);
            border-radius: 10px;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        .slider::-moz-range-thumb {
            width: 9px;
            height: 9px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        /* =========================
           MOBİL
        ========================= */
        @media (max-width: 768px) {
            .status {
                top: 14px;
                left: 14px;
            }
            .center-stage {
                width: 150px;
                height: 150px;
            }
            .avatar-wrap {
                width: 82px;
                height: 82px;
            }
            .mini-ring {
                width: 96px;
                height: 96px;
            }
            .track-info {
                bottom: 105px;
            }
            .selector {
                left: 14px;
                bottom: 18px;
            }
            .volume {
                right: 14px;
                bottom: 18px;
            }
            .bottom-bar {
                bottom: 18px;
            }
            .selector-button {
                min-width: 95px;
                height: 42px;
            }
            .volume {
                height: 42px;
            }
            .slider {
                width: 42px;
            }
            .control {
                width: 32px;
                height: 30px;
            }
        }
        @media (max-width: 470px) {
            .track-info {
                bottom: 88px;
            }
            .selector-button {
                min-width: 42px;
                width: 42px;
                padding: 0;
                justify-content: center;
            }
            .selector-name,
            .selector-arrow {
                display: none;
            }
            .volume {
                padding: 0 9px;
            }
            .slider {
                display: none;
            }
            .center-stage {
                width: 140px;
                height: 140px;
            }
            .avatar-wrap {
                width: 76px;
                height: 76px;
            }
            .mini-ring {
                width: 88px;
                height: 88px;
            }
        }
    </style>
</head>
<body>
    <!-- GİRİŞ -->
    <div id="splash-screen">
        <div class="intro">
            <span class="typewriter-text" id="typedText"></span>
            <span class="cursor" id="typeCursor"></span>
        </div>
        <button class="enter-btn" id="enterBtn">
            giriş
        </button>
    </div>
    <!-- ARKA PLAN VIDEO -->
    <div class="video-layer">
        <video
            id="bgVideo"
            loop
            playsinline
            webkit-playsinline
            preload="metadata">
        </video>
    </div>
    <!-- PING / SAAT -->
    <div class="status">
        <div class="online">
            <span class="online-dot"></span>
            <span id="pingText">-- ms</span>
        </div>
        <div class="separator"></div>
        <div id="clockText">
            00:00:00
        </div>
    </div>
    <!-- MERKEZ -->
    <div class="center-stage">
        <div
            class="audio-glow"
            id="audioGlow">
        </div>
        <div
            class="mini-ring"
            id="reactiveRing">
        </div>
        <div
            class="avatar-wrap"
            id="avatarElement">
            <img
                src="mert.PNG"
                class="avatar"
                alt="forever">
        </div>
    </div>
    <!-- VİDEO ADI -->
    <div class="track-info">
        <div class="track-small">
            now playing
        </div>
        <div id="marqueeText">
            beyaz
        </div>
    </div>
    <!-- VİDEO SEÇİCİ -->
    <div
        class="selector"
        id="selector">
        <div
            class="video-menu"
            id="videoPopupList">
        </div>
        <button
            class="selector-button"
            id="marqueeBtn">
            <span class="selector-icon"></span>
            <span
                class="selector-name"
                id="selectorName">
                beyaz
            </span>
            <span class="selector-arrow"></span>
        </button>
    </div>
    <!-- KONTROLLER -->
    <div class="bottom-bar">
        <button
            class="control"
            id="prevVideoBtn"
            title="Önceki">
            <svg viewBox="0 0 24 24">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
        </button>
        <button
            class="control"
            id="playPauseBtn"
            title="Oynat / Durdur">
            <svg
                id="playPauseIcon"
                viewBox="0 0 24 24">
                <path d="
                    M6 19h4V5H6v14zm8-14v14h4V5h-4z
                "/>
            </svg>
        </button>
        <button
            class="control"
            id="nextVideoBtn"
            title="Sonraki">
            <svg viewBox="0 0 24 24">
                <path d="
                    M6 18l8.5-6L6 6v12z
                    M16 6v12h2V6h-2z
                "/>
            </svg>
        </button>
    </div>
    <!-- SES -->
    <div class="volume">
        <button
            class="volume-button"
            id="muteToggleBtn">
            <svg
                id="volumeIcon"
                viewBox="0 0 24 24">
                <path d="
                    M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508
                    c-1.141 0-2.068.926-2.068 2.068v6.864
                    c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5
                    c.944.945 2.56.276 2.56-1.06V4.06z
                    M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05
                    c1.48-.74 2.5-2.26 2.5-4.02z
                "/>
            </svg>
        </button>
        <input
            type="range"
            class="slider"
            id="volumeSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.5">
    </div>
<script>
    /* =====================================================
       VİDEO LİSTESİ
       SADECE 6 VİDEO
    ===================================================== */
    const videoList = [
        {
            name: "beyaz",
            file: "beyaz.mp4"
        },
        {
            name: "atreides",
            file: "atreides.mp4"
        },
        {
            name: "prime",
            file: "prime.mp4"
        },
        {
            name: "southpaw",
            file: "southpaw.MP4"
        },
        {
            name: "zehir",
            file: "zehir.MP4"
        },
        {
            name: "scream",
            file: "scream.mp4"
        }
    ];
    /* =====================================================
       ELEMENTLER
    ===================================================== */
    const bgVideo =
        document.getElementById("bgVideo");
    const splashScreen =
        document.getElementById("splash-screen");
    const enterBtn =
        document.getElementById("enterBtn");
    const typedText =
        document.getElementById("typedText");
    const typeCursor =
        document.getElementById("typeCursor");
    const marqueeText =
        document.getElementById("marqueeText");
    const selectorName =
        document.getElementById("selectorName");
    const clockText =
        document.getElementById("clockText");
    const pingText =
        document.getElementById("pingText");
    const avatarElement =
        document.getElementById("avatarElement");
    const audioGlow =
        document.getElementById("audioGlow");
    const reactiveRing =
        document.getElementById("reactiveRing");
    const videoPopupList =
        document.getElementById("videoPopupList");
    const marqueeBtn =
        document.getElementById("marqueeBtn");
    const prevVideoBtn =
        document.getElementById("prevVideoBtn");
    const nextVideoBtn =
        document.getElementById("nextVideoBtn");
    const playPauseBtn =
        document.getElementById("playPauseBtn");
    const playPauseIcon =
        document.getElementById("playPauseIcon");
    const volumeSlider =
        document.getElementById("volumeSlider");
    const muteToggleBtn =
        document.getElementById("muteToggleBtn");
    const volumeIcon =
        document.getElementById("volumeIcon");
    /* =====================================================
       DEĞİŞKENLER
    ===================================================== */
    let currentVideoIndex = 0;
    let hasInteracted = false;
    let audioCtx = null;
    let analyser = null;
    let audioSource = null;
    let dataArray = null;
    let audioInitialized = false;
    let lastVolume = 0.5;
    /*
        Yumuşatılmış değerler.
        Ani sıçramaları kontrol ediyoruz.
    */
    let smoothBass = 0;
    let smoothKick = 0;
    let smoothMid = 0;
    /* =====================================================
       AUDIO CONTEXT
    ===================================================== */
    function initAudio() {
        if (audioInitialized) {
            return;
        }
        try {
            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;
            if (!AudioContext) {
                return;
            }
            audioCtx =
                new AudioContext();
            analyser =
                audioCtx.createAnalyser();
            /*
                256 FFT:
                Daha fazla frekans bölgesi,
                daha hassas ses tepkisi.
            */
            analyser.fftSize = 256;
            /*
                Düşük smoothing:
                Bass vuruşlarını daha hızlı yakalar.
            */
            analyser.smoothingTimeConstant = 0.35;
            analyser.minDecibels = -90;
            analyser.maxDecibels = -5;
            audioSource =
                audioCtx.createMediaElementSource(
                    bgVideo
                );
            audioSource.connect(
                analyser
            );
            analyser.connect(
                audioCtx.destination
            );
            dataArray =
                new Uint8Array(
                    analyser.frequencyBinCount
                );
            audioInitialized = true;
        } catch (error) {
            console.log(
                "Audio analyzer başlatılamadı:",
                error
            );
        }
    }
    /* =====================================================
       SES REAKSİYONU
    ===================================================== */
    function animateAudio() {
        requestAnimationFrame(
            animateAudio
        );
        if (
            !audioInitialized ||
            !analyser ||
            !dataArray ||
            bgVideo.paused
        ) {
            /*
                Müzik durduğunda yavaşça
                normal hale dön.
            */
            smoothBass *= .92;
            smoothKick *= .90;
            smoothMid *= .94;
            const idleScale =
                1 + smoothBass * .20;
            avatarElement.style.transform =
                `translate(-50%, -50%) scale(${idleScale})`;
            return;
        }
        analyser.getByteFrequencyData(
            dataArray
        );
        /* =================================================
           BASS
        ================================================= */
        let bass = 0;
        let kick = 0;
        let mids = 0;
        /*
            İlk 5 frekans:
            en düşük bass.
        */
        const kickCount =
            Math.min(
                5,
                dataArray.length
            );
        for (
            let i = 0;
            i < kickCount;
            i++
        ) {
            kick +=
                dataArray[i];
        }
        kick /=
            kickCount;
        /*
            Biraz daha geniş bass bölgesi.
        */
        const bassEnd =
            Math.min(
                18,
                dataArray.length
            );
        for (
            let i = 0;
            i < bassEnd;
            i++
        ) {
            bass +=
                dataArray[i];
        }
        bass /=
            bassEnd;
        /*
            Mid frekansları.
        */
        const midStart =
            bassEnd;
        const midEnd =
            Math.min(
                55,
                dataArray.length
            );
        for (
            let i = midStart;
            i < midEnd;
            i++
        ) {
            mids +=
                dataArray[i];
        }
        mids /=
            Math.max(
                1,
                midEnd - midStart
            );
        /* =================================================
           NORMALIZE
        ================================================= */
        let bassPower =
            Math.pow(
                bass / 145,
                1.15
            );
        let kickPower =
            Math.pow(
                kick / 135,
                1.2
            );
        let midPower =
            mids / 190;
        bassPower =
            Math.max(
                0,
                Math.min(
                    1,
                    bassPower
                )
            );
        kickPower =
            Math.max(
                0,
                Math.min(
                    1,
                    kickPower
                )
            );
        midPower =
            Math.max(
                0,
                Math.min(
                    1,
                    midPower
                )
            );
        /* =================================================
           SMOOTH
        ================================================= */
        /*
            Yükselirken hızlı,
            düşerken biraz daha yumuşak.
        */
        smoothBass +=
            (bassPower - smoothBass) *
            (
                bassPower > smoothBass
                    ? .42
                    : .16
            );
        smoothKick +=
            (kickPower - smoothKick) *
            (
                kickPower > smoothKick
                    ? .55
                    : .18
            );
        smoothMid +=
            (midPower - smoothMid) *
            .20;
        /* =================================================
           AVATAR SCALE
        ================================================= */
        const scale =
            1
            + smoothBass * .42
            + smoothKick * .22
            + smoothMid * .035;
        /* =================================================
           ORGANIC MOVEMENT
        ================================================= */
        const now =
            performance.now();
        const wobbleX =
            Math.sin(
                now / 105
            ) *
            smoothBass *
            2.4;
        const wobbleY =
            Math.cos(
                now / 125
            ) *
            smoothBass *
            1.8;
        const rotation =
            Math.sin(
                now / 90
            ) *
            smoothKick *
            2;
        avatarElement.style.transform =
            `
            translate(
                calc(-50% + ${wobbleX}px),
                calc(-50% + ${wobbleY}px)
            )
            scale(${scale})
            rotate(${rotation}deg)
            `;
        /* =================================================
           AVATAR ŞEKİL DEĞİŞİMİ
        ================================================= */
        const radius =
            50 +
            Math.sin(
                now / 70
            ) *
            smoothBass *
            5;
        avatarElement.style.borderRadius =
            `${radius}%`;
        /* =================================================
           GLOW
        ================================================= */
        const innerGlow =
            15 +
            smoothBass * 70 +
            smoothKick * 35;
        const outerGlow =
            30 +
            smoothBass * 100;
        const glowOpacity =
            .10 +
            smoothBass * .72;
        avatarElement.style.boxShadow =
            `
            0 0 0 1px rgba(255,255,255,.12),
            0 0 ${innerGlow}px rgba(
                255,
                255,
                255,
                ${glowOpacity}
            ),
            0 0 ${outerGlow}px rgba(
                255,
                255,
                255,
                ${glowOpacity * .20}
            ),
            0 0 80px rgba(0,0,0,.95)
            `;
        /* =================================================
           KÜÇÜK HALKA
        ================================================= */
        const ringScale =
            1
            + smoothBass * .30
            + smoothKick * .15;
        reactiveRing.style.transform =
            `
            translate(-50%, -50%)
            scale(${ringScale})
            `;
        reactiveRing.style.opacity =
            .18 +
            smoothBass * .78;
        reactiveRing.style.boxShadow =
            `
            0 0 ${
                8 + smoothBass * 30
            }px rgba(
                255,
                255,
                255,
                ${.08 + smoothBass * .28}
            )
            `;
        /* =================================================
           ARKA GLOW
        ================================================= */
        const glowScale =
            1
            + smoothBass * 2.2
            + smoothKick * .9;
        audioGlow.style.transform =
            `
            translate(-50%, -50%)
            scale(${glowScale})
            `;
        audioGlow.style.opacity =
            .035
            + smoothBass * .34
            + smoothKick * .18;
    }
    animateAudio();
    /* =====================================================
       SAAT
    ===================================================== */
    function updateClock() {
        const now =
            new Date();
        const hours =
            String(
                now.getHours()
            ).padStart(
                2,
                "0"
            );
        const minutes =
            String(
                now.getMinutes()
            ).padStart(
                2,
                "0"
            );
        const seconds =
            String(
                now.getSeconds()
            ).padStart(
                2,
                "0"
            );
        clockText.textContent =
            `${hours}:${minutes}:${seconds}`;
    }
    updateClock();
    setInterval(
        updateClock,
        1000
    );
    /* =====================================================
       PING
    ===================================================== */
    async function measurePing() {
        const start =
            performance.now();
        try {
            await fetch(
                window.location.href,
                {
                    method: "HEAD",
                    cache: "no-store"
                }
            );
            const ms =
                Math.round(
                    performance.now() - start
                );
            pingText.textContent =
                `${ms} ms`;
        } catch {
            pingText.textContent =
                "-- ms";
        }
    }
    measurePing();
    setInterval(
        measurePing,
        10000
    );
    /* =====================================================
       TYPEWRITER
    ===================================================== */
    const greeting =
        "hi stalker";
    let charIndex = 0;
    function typeWriter() {
        if (
            charIndex <
            greeting.length
        ) {
            typedText.textContent +=
                greeting.charAt(
                    charIndex
                );
            charIndex++;
            setTimeout(
                typeWriter,
                90
            );
        } else {
            typeCursor.style.display =
                "none";
            enterBtn.classList.add(
                "show"
            );
        }
    }
    window.addEventListener(
        "DOMContentLoaded",
        () => {
            updateVideoListUI();
            setTimeout(
                typeWriter,
                300
            );
        }
    );
    /* =====================================================
       VIDEO YÜKLE
    ===================================================== */
    function loadVideo(index) {
        currentVideoIndex =
            (
                index +
                videoList.length
            ) %
            videoList.length;
        const video =
            videoList[
                currentVideoIndex
            ];
        bgVideo.src =
            video.file;
        bgVideo.load();
        bgVideo.play()
            .then(() => {
                updatePlayPauseIcon(
                    true
                );
            })
            .catch(() => {});
        marqueeText.textContent =
            video.name;
        selectorName.textContent =
            video.name;
        updateVideoListUI();
    }
    /* =====================================================
       VIDEO MENÜSÜ
    ===================================================== */
    function updateVideoListUI() {
        videoPopupList.innerHTML =
            "";
        videoList.forEach(
            (video, index) => {
                const item =
                    document.createElement(
                        "button"
                    );
                item.className =
                    "video-item" +
                    (
                        index ===
                        currentVideoIndex
                            ? " active"
                            : ""
                    );
                item.innerHTML =
                    `
                    <span class="item-dot"></span>
                    <span>
                        ${video.name}
                    </span>
                    `;
                item.addEventListener(
                    "click",
                    event => {
                        event.stopPropagation();
                        loadVideo(
                            index
                        );
                        closeMenu();
                    }
                );
                videoPopupList.appendChild(
                    item
                );
            }
        );
    }
    function closeMenu() {
        videoPopupList.classList.remove(
            "open"
        );
    }
    marqueeBtn.addEventListener(
        "click",
        event => {
            event.stopPropagation();
            videoPopupList.classList.toggle(
                "open"
            );
        }
    );
    document.addEventListener(
        "click",
        event => {
            if (
                !document
                    .getElementById("selector")
                    .contains(event.target)
            ) {
                closeMenu();
            }
        }
    );
    /* =====================================================
       PLAY / PAUSE
    ===================================================== */
    function updatePlayPauseIcon(
        playing
    ) {
        if (playing) {
            playPauseIcon.innerHTML =
                `
                <path d="
                M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                `;
        } else {
            playPauseIcon.innerHTML =
                `
                <path d="
                M8 5v14l11-7z"/>
                `;
        }
    }
    playPauseBtn.addEventListener(
        "click",
        () => {
            if (
                bgVideo.paused
            ) {
                bgVideo.play()
                    .then(() => {
                        updatePlayPauseIcon(
                            true
                        );
                    })
                    .catch(() => {});
            } else {
                bgVideo.pause();
                updatePlayPauseIcon(
                    false
                );
            }
        }
    );
    /* =====================================================
       ÖNCEKİ
    ===================================================== */
    prevVideoBtn.addEventListener(
        "click",
        () => {
            loadVideo(
                currentVideoIndex - 1
            );
            closeMenu();
        }
    );
    /* =====================================================
       SONRAKİ
    ===================================================== */
    nextVideoBtn.addEventListener(
        "click",
        () => {
            loadVideo(
                currentVideoIndex + 1
            );
            closeMenu();
        }
    );
    /* =====================================================
       SITEYİ BAŞLAT
    ===================================================== */
    function startSite() {
        if (hasInteracted) {
            return;
        }
        hasInteracted = true;
        splashScreen.classList.add(
            "fade-out"
        );
        /*
            Kullanıcı tıklamasından hemen sonra
            AudioContext başlatılıyor.
        */
        initAudio();
        if (
            audioCtx &&
            audioCtx.state === "suspended"
        ) {
            audioCtx.resume();
        }
        const volume =
            parseFloat(
                volumeSlider.value
            );
        bgVideo.volume =
            volume;
        bgVideo.muted =
            false;
        loadVideo(0);
        bgVideo.play()
            .then(() => {
                updatePlayPauseIcon(
                    true
                );
            })
            .catch(() => {
                /*
                    Bazı mobil tarayıcılarda
                    sesli autoplay engellenirse
                    sessiz başlat.
                */
                bgVideo.muted =
                    true;
                bgVideo.play();
                updatePlayPauseIcon(
                    true
                );
            });
    }
    enterBtn.addEventListener(
        "click",
        startSite
    );
    /* =====================================================
       SES SLIDER
    ===================================================== */
    volumeSlider.addEventListener(
        "input",
        event => {
            const value =
                parseFloat(
                    event.target.value
                );
            bgVideo.volume =
                value;
            bgVideo.muted =
                value === 0;
            if (value > 0) {
                lastVolume =
                    value;
            }
            updateVolumeIcon(
                value
            );
        }
    );
    /* =====================================================
       MUTE
    ===================================================== */
    muteToggleBtn.addEventListener(
        "click",
        () => {
            if (
                bgVideo.muted ||
                bgVideo.volume === 0
            ) {
                const value =
                    lastVolume > 0
                        ? lastVolume
                        : .5;
                bgVideo.muted =
                    false;
                bgVideo.volume =
                    value;
                volumeSlider.value =
                    value;
                updateVolumeIcon(
                    value
                );
            } else {
                lastVolume =
                    bgVideo.volume;
                bgVideo.muted =
                    true;
                bgVideo.volume =
                    0;
                volumeSlider.value =
                    0;
                updateVolumeIcon(
                    0
                );
            }
        }
    );
    /* =====================================================
       SES İKONU
    ===================================================== */
    function updateVolumeIcon(
        volume
    ) {
        if (
            volume === 0
        ) {
            volumeIcon.innerHTML =
                `
                <path d="
                M3.63 3.63a.996.996 0 0 0 0 1.41L7.29 8.7
                4.5 11.49c-1.141 0-2.068.926-2.068 2.068v6.864
                c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5
                c.944.945 2.56.276 2.56-1.06v-3.37l4.36 4.36
                a.996.996 0 1 0 1.41-1.41L5.04 3.63
                a.996.996 0 0 0-1.41 0z"/>
                `;
        } else {
            volumeIcon.innerHTML =
                `
                <path d="
                M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508
                c-1.141 0-2.068.926-2.068 2.068v6.864
                c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5
                c.944.945 2.56.276 2.56-1.06V4.06z
                M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05
                c1.48-.74 2.5-2.26 2.5-4.02z"/>
                `;
        }
    }
</script>
