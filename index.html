<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>radw</title>
    <link rel="icon" type="image/jpeg" href="radw.jpg">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100dvh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        /* Sinematik Giriş Ekranı */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-text {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 1.1em;
            display: flex;
            align-items: center;
        }

        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 0.8em;
            background-color: #ffffff;
            margin-left: 6px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.3s, transform 0.2s;
            opacity: 0;
            animation: fadeInBtn 0.8s forwards 1.2s;
        }

        .enter-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeInBtn {
            to { opacity: 1; }
        }

        /* Navigasyon Bar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            padding: 0 20px;
            padding-top: env(safe-area-inset-top);
            height: calc(52px + env(safe-area-inset-top));
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s, transform 0.2s;
        }

        .nav-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-logo {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        /* Sabit Arka Plan Video */
        .bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            z-index: 1;
            background: #000;
        }

        .bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
        }

        .video-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.75) 100%);
            pointer-events: none;
        }

        /* Ana Ekran Ortası */
        .content-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            gap: 15px;
            text-align: center;
        }

        .main-title {
            font-size: clamp(3.5rem, 9vw, 6.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #fff;
            text-shadow: 0 4px 30px rgba(0,0,0,0.6);
        }

        .main-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .main-subtitle {
            font-size: 1rem;
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Açılır Menü ve Modallar */
        .overlay-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .overlay-menu.open {
            opacity: 1;
            visibility: visible;
        }

        .menu-card {
            background: rgba(18, 18, 20, 0.95);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 22px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            transform: translateY(15px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .overlay-menu.open .menu-card {
            transform: translateY(0);
        }

        .menu-header {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-primary);
            text-align: left;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .menu-item:active, .menu-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(0.98);
        }

        /* Discord Profil Tasarımı */
        .discord-profile {
            align-items: center;
            text-align: center;
            gap: 14px;
        }

        .discord-banner {
            width: 100%;
            height: 70px;
            background: #5865F2;
            border-radius: 12px;
            position: relative;
        }

        .discord-avatar-wrapper {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
        }

        .discord-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #121214;
            object-fit: cover;
        }

        .discord-status-dot {
            width: 14px;
            height: 14px;
            background-color: #3ba55d;
            border: 3px solid #121214;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }

        .discord-names {
            margin-top: 20px;
        }

        .discord-display-name {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .discord-username {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .discord-activity {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 12px;
            width: 100%;
            font-size: 0.8rem;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 5px;
            letter-spacing: 0.05em;
        }

        /* Sağ altta minimal ses kaydırıcı */
        .audio-dock {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .audio-slider {
            width: 70px;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-text"><span id="typewriter"></span><span class="cursor-blink"></span></div>
        <button class="enter-btn" id="enterBtn">giriş</button>
    </div>

    <nav>
        <div class="nav-group">
            <button class="nav-btn" id="panelBtn">panel</button>
        </div>
        <a href="#" class="nav-logo">radw.</a>
        <div class="nav-group">
            <button class="nav-btn" id="meBtn">me</button>
        </div>
    </nav>

    <div class="bg-video-container">
        <video id="bgVideo" loop muted playsinline></video>
        <div class="video-vignette"></div>
    </div>

    <div class="content-layer">
        <img class="main-avatar" src="https://i.pinimg.com/1200x/c7/f2/7c/c7f27cf80aeb376ff2e0627b8e9167b6.jpg" alt="Avatar">
        <h1 class="main-title">radw.</h1>
        <p class="main-subtitle">Solo temo a Dios</p>
    </div>

    <div class="overlay-menu" id="panelModal">
        <div class="menu-card">
            <div class="menu-header">videolar</div>
            <div class="menu-list" id="videoList"></div>
            <button class="close-btn" id="closePanelBtn">kapat</button>
        </div>
    </div>

    <div class="overlay-menu" id="discordModal">
        <div class="menu-card discord-profile">
            <div class="discord-banner">
                <div class="discord-avatar-wrapper">
                    <img class="discord-avatar" src="https://i.pinimg.com/1200x/c7/f2/7c/c7f27cf80aeb376ff2e0627b8e9167b6.jpg" alt="Discord Avatar">
                    <div class="discord-status-dot"></div>
                </div>
            </div>
            <div class="discord-names">
                <div class="discord-display-name">radw</div>
                <div class="discord-username">@radwoxie</div>
            </div>
            <div class="discord-activity">
                <span style="font-size: 1.2rem;">🎮</span>
                <div>
                    <div style="font-size: 0.65rem; color: var(--text-secondary);">AKTİVİTE</div>
                    <div style="font-weight: 500; font-size: 0.8rem;">Counter-Strike 2 oynuyor</div>
                </div>
            </div>
            <button class="close-btn" id="closeDiscordBtn">kapat</button>
        </div>
    </div>

    <div class="audio-dock">
        <span style="font-size: 0.7rem; color: var(--text-secondary);">ses</span>
        <input type="range" class="audio-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5">
    </div>

    <script>
        // Tok ve alçak tıklama ses efekti (Derin bas sentezleyici)
        function playThumpSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(110, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        // Yazı Efekti
        const textToType = "radw.";
        const typewriterElement = document.getElementById('typewriter');
        const splashScreen = document.getElementById('splash-screen');
        const enterBtn = document.getElementById('enterBtn');
        let charIndex = 0;
        let hasInteracted = false;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typewriterElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 180);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeWriter, 200);
            initVideoPlaylist();
        });

        // Video Listesi
        const videos = [
            { name: "rs6", src: "rs6.mp4" },
            { name: "wav", src: "wav.mp4" },
            { name: "how deep is your love", src: "how%20deep%20is%20your%20love.mp4" },
            { name: "mustang", src: "mustang.mp4" },
            { name: "marlon", src: "marlon.mp4" }
        ];

        let currentVideoIndex = 0;
        const bgVideo = document.getElementById('bgVideo');
        const videoListContainer = document.getElementById('videoList');

        function initVideoPlaylist() {
            videoListContainer.innerHTML = '';
            videos.forEach((vid, index) => {
                const item = document.createElement('div');
                item.className = `menu-item ${index === currentVideoIndex ? 'active' : ''}`;
                item.innerText = vid.name;
                item.addEventListener('click', () => {
                    playThumpSound();
                    switchVideo(index);
                    togglePanel(false);
                });
                videoListContainer.appendChild(item);
            });
        }

        function switchVideo(index) {
            currentVideoIndex = index;
            bgVideo.src = videos[currentVideoIndex].src;
            bgVideo.load();
            const vol = parseFloat(document.getElementById('volumeSlider').value);
            bgVideo.volume = vol;
            bgVideo.muted = (vol === 0);
            bgVideo.play().catch(() => {});
            
            document.querySelectorAll('.menu-item').forEach((el, idx) => {
                if (idx === index) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function startSite() {
            if (hasInteracted) return;
            hasInteracted = true;
            playThumpSound();
            splashScreen.classList.add('fade-out');
            switchVideo(0);
        }

        enterBtn.addEventListener('click', startSite);
        enterBtn.addEventListener('touchend', startSite);

        // Panel ve Discord Modal Kontrolleri
        const panelModal = document.getElementById('panelModal');
        const discordModal = document.getElementById('discordModal');

        function togglePanel(open) {
            playThumpSound();
            if (open) panelModal.classList.add('open');
            else panelModal.classList.remove('open');
        }

        function toggleDiscord(open) {
            playThumpSound();
            if (open) discordModal.classList.add('open');
            else discordModal.classList.remove('open');
        }

        document.getElementById('panelBtn').addEventListener('click', () => togglePanel(true));
        document.getElementById('closePanelBtn').addEventListener('click', () => togglePanel(false));
        
        document.getElementById('meBtn').addEventListener('click', () => toggleDiscord(true));
        document.getElementById('closeDiscordBtn').addEventListener('click', () => toggleDiscord(false));

        panelModal.addEventListener('click', (e) => { if (e.target === panelModal) togglePanel(false); });
        discordModal.addEventListener('click', (e) => { if (e.target === discordModal) toggleDiscord(false); });

        // Ses Kontrolü
        const volumeSlider = document.getElementById('volumeSlider');
        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            bgVideo.volume = vol;
            bgVideo.muted = (vol === 0);
        });
    </script>
</body>
</html>
