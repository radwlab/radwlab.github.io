<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>radw</title>
    <link rel="icon" type="image/jpeg" href="radw.jpg">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: var(--bg-color);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100dvh;
            overflow-y: hidden;
        }

        /* Sinematik Giriş Ekranı (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .splash-text {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: #ffffff;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Navigasyon Bar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            padding: 0 30px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .ping-dot {
            width: 6px;
            height: 6px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 8px #30d158;
        }

        .nav-logo {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        /* Ana Akış Konteynerı */
        .main-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        section {
            width: 100%;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        section.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Hero Bölümü */
        .hero-section {
            background: radial-gradient(circle at center, #111 0%, #000 70%);
            text-align: center;
            flex-direction: column;
        }

        .hero-title {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        .hero-profile-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .hero-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
        }

        /* Avatarın Altında İtalik ve Hafif Yan Duran Söz */
        .hero-subtitle {
            font-size: clamp(0.95rem, 1.8vw, 1.15rem);
            font-style: italic;
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            transform: rotate(-1.5deg);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* Video Bölümleri */
        .video-section {
            background: #000;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            -o-object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            bottom: max(40px, env(safe-area-inset-bottom, 20px) + 20px);
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 100;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            padding: 20px;
            border-radius: 20px;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-name {
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .audio-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .audio-slider {
            width: 90px;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .hero-title {
                margin-bottom: 20px;
            }
            .hero-avatar {
                width: 120px;
                height: 120px;
            }
            .video-overlay {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                left: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Sinematik Giriş Ekranı -->
    <div id="splash-screen">
        <div class="splash-text"><span id="typewriter"></span><span class="cursor-blink"></span></div>
    </div>

    <!-- Üst Menü -->
    <nav>
        <div class="nav-left">
            <div class="ping-dot"></div>
            <span id="ping-text">14 ms</span>
            <span>|</span>
            <span id="clock-text">00:00:00</span>
        </div>
        <div class="nav-right">
            <a href="#" class="nav-logo">radw.</a>
        </div>
    </nav>

    <!-- Ana Akış Konteynerı -->
    <div class="main-container" id="mainContainer">
        
        <!-- 1. Bölüm: Hero (Giriş) -->
        <section class="hero-section active">
            <h1 class="hero-title">radw.</h1>
            <div class="hero-profile-box">
                <img class="hero-avatar" src="https://i.pinimg.com/1200x/c7/f2/7c/c7f27cf80aeb376ff2e0627b8e9167b6.jpg" alt="Radw Avatar">
                <!-- Avatarın Altında İtalik ve Hafif Yan Duran Söz -->
                <p class="hero-subtitle">"Solo temo a Dios"</p>
            </div>
            <div class="scroll-indicator">KEŞFETMEK İÇİN KAYDIRIN ↓</div>
        </section>

        <!-- 2. Bölüm: rs6 (rs6.mp4) -->
        <section class="video-section">
            <div class="video-wrapper">
                <video class="section-vid" loop playsinline preload="auto">
                    <source src="rs6.mp4" type="video/mp4">
                </video>
            </div>
            <div class="video-overlay">
                <div class="video-info"><span class="video-name">rs6</span></div>
                <div class="audio-control">
                    <span>Ses</span>
                    <input type="range" class="audio-slider" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>
        </section>

        <!-- 3. Bölüm: wav.mp4 -->
        <section class="video-section">
            <div class="video-wrapper">
                <video class="section-vid" loop playsinline preload="auto">
                    <source src="wav.mp4" type="video/mp4">
                </video>
            </div>
            <div class="video-overlay">
                <div class="video-info"><span class="video-name">wav</span></div>
                <div class="audio-control">
                    <span>Ses</span>
                    <input type="range" class="audio-slider" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>
        </section>

        <!-- 4. Bölüm: how deep is your love.mp4 -->
        <section class="video-section">
            <div class="video-wrapper">
                <video class="section-vid" loop playsinline preload="auto">
                    <source src="how deep is your love.mp4" type="video/mp4">
                </video>
            </div>
            <div class="video-overlay">
                <div class="video-info"><span class="video-name">how deep is your love</span></div>
                <div class="audio-control">
                    <span>Ses</span>
                    <input type="range" class="audio-slider" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>
        </section>

    </div>

    <script>
        // Sinematik Daktilo Efekti ve Giriş Kaldırma
        const textToType = "radw.";
        const typewriterElement = document.getElementById('typewriter');
        const splashScreen = document.getElementById('splash-screen');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typewriterElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 220);
            } else {
                setTimeout(() => {
                    splashScreen.classList.add('fade-out');
                    unlockMedia();
                }, 600);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeWriter, 400);
        });

        // Canlı Saat
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-text').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Rastgele Ping Değişimi
        setInterval(() => {
            const randomPing = Math.floor(Math.random() * 8) + 12;
            document.getElementById('ping-text').innerText = randomPing + ' ms';
        }, 3000);

        // --- AKIŞ VE VİDEO YÖNETİMİ ---
        const sections = document.querySelectorAll('#mainContainer > section');
        let currentIndex = 0;
        let isAnimating = false;

        sections.forEach((section, idx) => {
            if (idx === 0) return;
            const video = section.querySelector('video');
            if (video) {
                video.load();
            }
        });

        function unlockMedia() {
            sections.forEach((section, idx) => {
                if (idx === 0) return;
                const video = section.querySelector('video');
                if (video) {
                    video.muted = true;
                    video.play().then(() => {
                        video.pause();
                        video.currentTime = 0;
                    }).catch(() => {});
                }
            });
        }

        function goToSection(index) {
            if (index < 0 || index >= sections.length || isAnimating) return;
            isAnimating = true;

            if (currentIndex > 0) {
                const prevVideo = sections[currentIndex].querySelector('video');
                if (prevVideo) {
                    prevVideo.pause();
                    prevVideo.currentTime = 0;
                }
            }

            sections[currentIndex].classList.remove('active');
            currentIndex = index;
            sections[currentIndex].classList.add('active');

            if (currentIndex > 0) {
                const currentVideo = sections[currentIndex].querySelector('video');
                const currentSlider = sections[currentIndex].querySelector('.audio-slider');
                if (currentVideo && currentSlider) {
                    currentVideo.muted = false;
                    currentVideo.volume = parseFloat(currentSlider.value);
                    currentVideo.play().catch(() => {});
                }
            }

            setTimeout(() => {
                isAnimating = false;
            }, 600);
        }

        window.addEventListener('wheel', (e) => {
            if (isAnimating || !splashScreen.classList.contains('fade-out')) return;
            if (Math.abs(e.deltaY) < 15) return;

            if (e.deltaY > 0) {
                goToSection(currentIndex + 1);
            } else {
                goToSection(currentIndex - 1);
            }
        }, { passive: true });

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (isAnimating || !splashScreen.classList.contains('fade-out')) return;
            let touchEndY = e.changedTouches[0].clientY;
            let diff = touchStartY - touchEndY;

            if (Math.abs(diff) > 35) {
                if (diff > 0) {
                    goToSection(currentIndex + 1);
                } else {
                    goToSection(currentIndex - 1);
                }
            }
        }, { passive: true });

        document.querySelectorAll('.audio-slider').forEach(slider => {
            slider.addEventListener('input', (e) => {
                const section = e.target.closest('section');
                const videoElement = section.querySelector('video');
                const volume = parseFloat(e.target.value);
                
                if (videoElement) {
                    videoElement.volume = volume;
                    videoElement.muted = (volume === 0);
                }
            });
        });
    </script>
</body>
</html>
