<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radwlab :: Interactive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d0f12;
            color: #00ffcc;
        }

        /* Background Video Container */
        .bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }
        .bg-video-container video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            filter: brightness(0.35) contrast(1.1) blur(1px);
        }

        /* Main Container */
        .main-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Terminal Window */
        .terminal {
            width: 100%;
            max-width: 800px;
            height: 500px;
            background: rgba(13, 15, 18, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 255, 204, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        /* Terminal Top Bar */
        .terminal-header {
            background: rgba(20, 24, 30, 0.9);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
        }
        .terminal-title {
            font-size: 13px;
            letter-spacing: 1px;
            color: #8ab4f8;
            font-weight: bold;
        }
        .terminal-dots {
            display: flex;
            gap: 6px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        /* Terminal Body Content */
        .terminal-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Terminal Input Line */
        .terminal-input-line {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: rgba(10, 12, 15, 0.9);
            border-top: 1px solid rgba(0, 255, 204, 0.2);
        }
        .prompt-symbol {
            color: #ff007f;
            font-weight: bold;
            margin-right: 8px;
        }
        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
        }

        /* Quick Action Buttons (Redesigned & Sleek) */
        .action-buttons-bar {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(16, 20, 26, 0.85);
            border-top: 1px solid rgba(0, 255, 204, 0.15);
            flex-wrap: wrap;
            justify-content: center;
        }
        .cmd-btn {
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid rgba(0, 255, 204, 0.35);
            color: #00ffcc;
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .cmd-btn:hover {
            background: rgba(0, 255, 204, 0.25);
            border-color: #00ffcc;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            transform: translateY(-1px);
        }
        .cmd-btn:active {
            transform: translateY(1px);
        }

        /* Footer Info Bar */
        .footer-info {
            margin-top: 15px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Interactive Elements */
        .cmd-link {
            color: #ffbd2e;
            cursor: pointer;
            text-decoration: underline;
        }
        .cmd-link:hover {
            color: #ffa500;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 204, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 204, 0.6);
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <div class="bg-video-container">
        <video autoplay muted loop playsinfile>
            <source src="background.mp4" type="video/mp4">
        </video>
    </div>

    <div class="main-wrapper">
        <div class="terminal">
            <div class="terminal-header">
                <div class="terminal-title">root@radwlab:~#</div>
                <div class="terminal-dots">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>
            </div>

            <div class="terminal-body" id="terminal-body">
                <div>Sistem başlatıldı... radwlab v2.4 aktif.</div>
                <div>Yardım almak için <span class="cmd-link" onclick="runCommand('help')">help</span> yazabilir veya aşağıdaki butonları kullanabilirsiniz.</div>
                <br>
            </div>

            <!-- Sleek Modern Quick Command Buttons -->
            <div class="action-buttons-bar">
                <button class="cmd-btn" onclick="runCommand('help')">⚡ help</button>
                <button class="cmd-btn" onclick="runCommand('about')">ℹ️ about</button>
                <button class="cmd-btn" onclick="runCommand('status')">🟢 status</button>
                <button class="cmd-btn" onclick="runCommand('sysinfo')">💻 sysinfo</button>
                <button class="cmd-btn" onclick="runCommand('ping')">📡 ping</button>
                <button class="cmd-btn" onclick="runCommand('quote')">💬 quote</button>
                <button class="cmd-btn" onclick="runCommand('matrix')">🕶️ matrix</button>
                <button class="cmd-btn" onclick="runCommand('clear')">🧹 clear</button>
            </div>

            <div class="terminal-input-line">
                <span class="prompt-symbol">➜</span>
                <span style="color: #8ab4f8; margin-right: 6px;">~</span>
                <input type="text" id="terminal-input" class="terminal-input" autofocus placeholder="Komut yazın (örn: help)...">
            </div>
        </div>

        <div class="footer-info">
            radwlab.com &bull; Ziyaretçi Sayısı: <span id="visit-count">501</span>
        </div>
    </div>

    <script>
        const terminalBody = document.getElementById('terminal-body');
        const terminalInput = document.getElementById('terminal-input');

        const commandHistory = [];
        let historyIndex = -1;

        const quotes = [
            { en: "Simplicity is the ultimate sophistication.", tr: "Basitlik en üst düzey sofistikeliktir." },
            { en: "Code is like humor. When you have to explain it, it’s bad.", tr: "Kod mizah gibidir. Açıklamak zorunda kalıyorsan, kötüdür." },
            { en: "Make it work, make it right, make it fast.", tr: "Önce çalıştır, sonra düzelt, en son hızlandır." },
            { en: "Talk is cheap. Show me the code.", tr: "Laf lafı açar, bana kodu göster." }
        ];

        function runCommand(cmdText) {
            if (!cmdText.trim()) return;

            const cmdClean = cmdText.trim().toLowerCase();
            commandHistory.push(cmdClean);
            historyIndex = commandHistory.length;

            const userLine = document.createElement('div');
            userLine.innerHTML = `<span style="color: #ff007f;">➜</span> <span style="color: #8ab4f8;">~</span> <span style="color: #fff;">${escapeHtml(cmdText)}</span>`;
            terminalBody.appendChild(userLine);

            const respLine = document.createElement('div');
            respLine.style.margin = "4px 0 12px 0";
            respLine.style.color = "#a9b7c6";

            const parts = cmdClean.split(' ');
            const cmd = parts[0];

            if (cmd === 'help') {
                respLine.innerHTML = `Mevcut Komutlar:<br>
                - <span class='cmd-link' onclick='runCommand("about")'>about</span>: Proje hakkında bilgi verir.<br>
                - <span class='cmd-link' onclick='runCommand("status")'>status</span>: Sistem durumunu gösterir.<br>
                - <span class='cmd-link' onclick='runCommand("sysinfo")'>sysinfo</span>: Tarayıcı ve ekran bilgilerinizi gösterir.<br>
                - <span class='cmd-link' onclick='runCommand("ping")'>ping</span>: Sunucu gecikmesini ölçer.<br>
                - <span class='cmd-link' onclick='runCommand("quote")'>quote</span>: Rastgele teknoloji/geliştirici sözü gösterir.<br>
                - <span class='cmd-link' onclick='runCommand("weather")'>weather</span>: Bölgesel hava/konum durumu.<br>
                - <span class='cmd-link' onclick='runCommand("matrix")'>matrix</span>: Matrix yağmur efektini başlatır.<br>
                - <span class='cmd-link' onclick='runCommand("history")'>history</span>: Geçmiş komutları listeler.<br>
                - <span class='cmd-link' onclick='runCommand("clear")'>clear</span>: Terminal ekranını temizler.`;
            } else if (cmd === 'about') {
                respLine.innerHTML = "radwlab :: Interactive, kullanıcı deneyimini ve modern web teknolojilerini birleştiren kişisel bir arayüz projesidir.";
            } else if (cmd === 'status') {
                respLine.innerHTML = "Sistem Durumu: Çevrim içi (Online)<br>Video Akışı: Aktif<br>Güvenlik Duvarı: Devrede";
            } else if (cmd === 'social') {
                respLine.innerHTML = "Sosyal Medya bağlantıları yakında eklenecektir.";
            } else if (cmd === 'sysinfo') {
                respLine.innerHTML = `Tarayıcı: ${navigator.userAgent}<br>Ekran Çözünürlüğü: ${window.innerWidth}x${window.innerHeight}`;
            } else if (cmd === 'ping') {
                const start = performance.now();
                setTimeout(() => {
                    const latency = Math.round(performance.now() - start);
                    respLine.innerHTML = `Anlık Gecikme (Ping): ~${Math.max(5, latency + 12)}ms`;
                }, 50);
            } else if (cmd === 'whoami') {
                respLine.innerHTML = "Kullanıcı: root (Yetkili Ziyaretçi)";
            } else if (cmd === 'quote') {
                let randomQ = quotes[Math.floor(Math.random() * quotes.length)];
                respLine.innerHTML = `"${randomQ.en}"<br><span style="opacity:0.7;">tr: ${randomQ.tr}</span>`;
            } else if (cmd === 'weather') {
                respLine.innerHTML = "Konum: Kırklareli, Türkiye | Durum: Temiz / Sistem Stabil";
            } else if (cmd === 'matrix') {
                respLine.innerHTML = "<span style='color: #27c93f;'>Matrix yağmur modu aktif edildi. (Görsel efekt devrede)</span>";
            } else if (cmd === 'history') {
                respLine.innerHTML = "Geçmiş Komutlar:<br>" + commandHistory.join("<br>");
            } else if (cmd === 'theme') {
                respLine.innerHTML = "Tema otomatik olarak arkadaki videodan renk alacak şekilde ayarlanmıştır.";
            } else if (cmd === 'clear') {
                terminalBody.innerHTML = '';
                terminalInput.value = '';
                return;
            } else {
                respLine.innerHTML = `Bilinmeyen komut: '${escapeHtml(cmdText)}'. Yardım için <span class='cmd-link' onclick='runCommand("help")'>help</span> yazın.`;
            }

            terminalBody.appendChild(respLine);
            terminalInput.value = '';
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        terminalInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                runCommand(terminalInput.value);
            }
        });

        // Ortak Sayaç (localStorage + API Desteği)
        async function updateVisitorCounter() {
            try {
                const namespace = 'radwlab-interactive-site';
                const key = 'visits';
                
                const hasVisited = sessionStorage.getItem('radw_visited');
                
                let response;
                if (!hasVisited) {
                    response = await fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`);
                    sessionStorage.setItem('radw_visited', 'true');
                } else {
                    response = await fetch(`https://api.countapi.xyz/get/${namespace}/${key}`);
                }
                
                const data = await response.json();
                let count = data.value;
                
                if (!count || count < 500) {
                    await fetch(`https://api.countapi.xyz/set/${namespace}/${key}?value=500`);
                    count = 500;
                }
                
                document.getElementById('visit-count').textContent = count;
            } catch (error) {
                let localCount = localStorage.getItem('radw_local_count') || 501;
                if (!sessionStorage.getItem('radw_local_counted')) {
                    localCount = parseInt(localCount) + 1;
                    localStorage.setItem('radw_local_count', localCount);
                    sessionStorage.setItem('radw_local_counted', 'true');
                }
                document.getElementById('visit-count').textContent = localCount;
            }
        }
        updateVisitorCounter();
    </script>
</body>
</html>
