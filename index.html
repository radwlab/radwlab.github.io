<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Solo temo a Dios</title>
    <link rel="icon" type="image/jpeg" href="radw.jpg">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 30%, #12121a 0%, #070709 60%, #000000 100%);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.55);
            
            --glass-bg: rgba(20, 20, 28, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover-bg: rgba(35, 35, 50, 0.8);
            --glass-hover-border: rgba(255, 255, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        html, body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Giriş Ekranı (Sade) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 14px 36px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.15s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .enter-btn:hover {
            border-color: var(--glass-hover-border);
            background: var(--glass-hover-bg);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
        }

        /* Ana İçerik / Profil Alanı */
        .main-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 10;
            pointer-events: auto;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            background: #121218;
        }

        .profile-buttons {
            display: flex;
            gap: 10px;
        }

        .profile-icon-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            cursor: pointer;
            height: 40px;
            width: 40px;
            padding: 0;
            border-radius: 12px;
            transition: all 0.15s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .profile-icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .profile-icon-btn:hover {
            border-color: var(--glass-hover-border);
            background: var(--glass-hover-bg);
            transform: translateY(-2px);
        }

        /* Arka Plan Video */
        .bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            background: #000;
            overflow: hidden;
            transform: translateZ(0);
        }

        .bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        /* Panel */
        .overlay-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
        }

        .overlay-menu.open {
            opacity: 1;
            visibility: visible;
        }

        .menu-card {
            background: rgba(8, 8, 10, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 14px;
            width: 200px;
            max-width: 80vw;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transform: scale(0.85);
            transition: transform 0.2s ease;
        }

        .overlay-menu.open .menu-card {
            transform: scale(1);
        }

        .menu-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2px;
        }

        .menu-header {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .close-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
        }

        .close-icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .close-icon-btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            max-height: 145px; 
            overflow-y: auto;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 0.73rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            padding: 7px 8px;
            border-radius: 6px;
            transition: all 0.15s ease;
            width: 100%;
            white-space: nowrap;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .menu-item.active {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .menu-item svg {
            width: 11px;
            height: 11px;
            fill: currentColor;
            flex-shrink: 0;
            opacity: 0.6;
        }

        .media-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 2px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #ffffff;
            cursor: pointer;
            width: 30px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .control-btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        /* Ses Paneli */
        .audio-dock {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .audio-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            opacity: 0.8;
            transition: opacity 0.15s;
        }

        .audio-icon-btn:hover {
            opacity: 1;
        }

        .audio-icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .audio-slider-container {
            position: relative;
            width: 90px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .audio-fill-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #ffffff, #a2a2b5);
            pointer-events: none;
            border-radius: 3px;
        }

        .audio-slider {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-appearance: none;
            background: transparent;
            outline: none;
            cursor: pointer;
            z-index: 2;
            margin: 0;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 0;
            height: 0;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- Giriş Ekranı (Sade) -->
    <div id="splash-screen">
        <button class="enter-btn" id="enterBtn">giriş</button>
    </div>

    <!-- Ana İçerik -->
    <div class="main-content">
        <img src="IMG_6727.jpeg" alt="Radw" class="profile-avatar">
        <div class="profile-buttons">
