<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>forever</title>
<link rel="icon" href="mertbest.png">
<link rel="apple-touch-icon" href="mertbest.png">
<style>
:root{
  --line:rgba(255,255,255,.08);
  --dim:rgba(255,255,255,.42);
  --glass:rgba(10,10,13,.5);
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
button,input{outline:none;font:inherit;color:inherit}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}

/* video + efektler */
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;
  transition:opacity .7s ease;transform:scale(1.02)}
#bg.on{opacity:.9}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.55) 80%,#000 125%)}

/* avatar */
#av{position:fixed;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;z-index:60;
  border-radius:50%;overflow:hidden;display:grid;place-items:center;pointer-events:none;will-change:transform}
#av img{width:100%;height:100%;border-radius:50%;object-fit:cover}

/* paneller */
.g{background:var(--glass);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 14px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}
.ui{position:fixed;z-index:100;opacity:0;transform:translateY(10px);transition:opacity .8s .3s,transform .8s .3s}
body.in .ui{opacity:1;transform:none}

#tl{top:22px;left:22px;display:flex;align-items:center;gap:12px;padding:9px 15px;font:500 .7rem var(--mono);letter-spacing:.08em}
#tl i{width:1px;height:11px;background:var(--line)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 9px #4ade80;margin-right:7px;
  animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}

#bl{bottom:24px;left:22px}
#pick{width:132px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  font:500 .72rem var(--mono);letter-spacing:.08em;-webkit-user-select:none;user-select:none}
#pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pick b{font-weight:400;opacity:.4;margin-left:8px}
#list{position:absolute;bottom:calc(100% + 10px);left:0;width:190px;padding:6px;border-radius:14px;
  background:rgba(7,7,10,.9);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  opacity:0;visibility:hidden;transform:translateY(8px) scale(.97);transform-origin:bottom left;
  transition:all .25s cubic-bezier(.16,1,.3,1)}
#list.open{opacity:1;visibility:visible;transform:none}
.it{display:flex;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;font:500 .72rem var(--mono);
  color:var(--dim);letter-spacing:.06em;transition:.15s}
.it em{font-style:normal;opacity:.5}
.it.act{color:#fff;background:rgba(255,255,255,.09)}

#cc{bottom:24px;left:50%;transform:translate(-50%,10px);display:flex;flex-direction:column;align-items:center;gap:9px}
body.in #cc{transform:translateX(-50%)}
#badge{padding:6px 14px;border-radius:99px;font:500 .66rem var(--mono);letter-spacing:.14em;display:flex;gap:9px;align-items:center}
#badge s{text-decoration:none;opacity:.4}
#dock{display:flex;padding:5px;gap:2px}
.cb{background:none;border:0;width:38px;height:34px;display:grid;place-items:center;cursor:pointer;color:rgba(255,255,255,.62);-webkit-user-select:none;user-select:none}
.cb svg{width:14px;height:14px;fill:currentColor}

#br{bottom:24px;right:22px;display:flex;align-items:center;gap:8px;padding:8px 14px}
#vol{position:relative;width:78px;height:14px;display:flex;align-items:center}
#vol .tr{position:absolute;left:0;right:0;height:2px;border-radius:2px;background:rgba(255,255,255,.12)}
#vol .fl{position:absolute;left:0;height:2px;border-radius:2px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
#vol input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;margin:0}

#prog{position:fixed;left:0;bottom:0;height:2px;width:0;z-index:101;background:linear-gradient(90deg,transparent,#fff);opacity:.55}

/* giriş */
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;transition:opacity .9s ease,visibility .9s,filter .9s}
#splash.out{opacity:0;visibility:hidden;filter:blur(8px);pointer-events:none}
#typed{font:500 1.05rem var(--mono);letter-spacing:.22em;min-height:1.6rem}
#typed u{display:inline-block;width:8px;height:1.05rem;background:#fff;vertical-align:middle;margin-left:5px;animation:bk .8s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
#enter{padding:12px 38px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  font:500 .76rem var(--mono);letter-spacing:.24em;cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .5s,transform .5s}
#enter.show{opacity:1;transform:none;pointer-events:auto}

@media(max-width:768px){
  #tl{top:14px;left:14px;padding:7px 12px}
  #bl{left:14px;bottom:20px}#pick{width:104px;padding:9px 12px}
  #cc{bottom:20px}#br{right:14px;bottom:20px;padding:7px 11px}#vol{width:44px}
  #list{width:150px;bottom:calc(100% + 54px);max-height:42vh;overflow-y:auto}
}
</style>
</head>
<body>

<div id="splash">
  <div id="typed"><span id="tt"></span><u id="cur"></u></div>
  <button id="enter">giriş</button>
</div>

<video id="bg" loop playsinline webkit-playsinline preload="none"></video>
<div class="vig"></div>

<div id="av"><img src="mert.PNG" alt=""></div>

<div id="tl" class="ui g"><span><i class="dot" style="width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;margin:0 7px 0 0;box-shadow:0 0 9px #4ade80"></i><span id="ping">-- ms</span></span><i></i><span id="clock">00:00:00</span></div>

<div id="bl" class="ui">
  <div id="list"></div>
  <button id="pick" class="g"><span id="pickName">...</span><b>▴</b></button>
</div>

<div id="cc" class="ui">
  <div id="badge" class="g"><s id="num">01/07</s><span id="name">beyaz</span></div>
  <div id="dock" class="g">
    <button class="cb" id="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="cb" id="pp"><svg viewBox="0 0 24 24" id="ppi"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
    <button class="cb" id="next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
  </div>
</div>

<div id="br" class="ui g">
  <button class="cb" id="mute" style="width:24px"><svg viewBox="0 0 24 24" id="mi"></svg></button>
  <div id="vol"><div class="tr"></div><div class="fl" id="fl"></div><input type="range" id="vs" min="0" max="1" step="0.01" value="0.5"></div>
</div>
<div id="prog"></div>

<script>
const vids = [
  {n:"beyaz",f:"beyaz.mp4"},{n:"atreides",f:"atreides.mp4"},{n:"prime",f:"prime.mp4"},
  {n:"southpaw",f:"southpaw.MP4"},{n:"zehir",f:"zehir.MP4"},{n:"scream",f:"scream.mp4"},{n:"shadow",f:"shadow.mp4"}
];
const $ = id => document.getElementById(id);
const v = $('bg'), av = $('av');
let idx = 0, started = false, last = 0.5;
let actx, an, buf;

const ICON_ON  = '<path d="M13.5 4.06c0-1.34-1.62-2-2.56-1.06l-4.5 4.5H4.5C3.36 7.5 2.44 8.43 2.44 9.57v4.86c0 1.14.92 2.07 2.06 2.07h1.94l4.5 4.5c.94.95 2.56.28 2.56-1.06V4.06zM18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/>';
const ICON_OFF = '<path d="M13.5 4.06c0-1.34-1.62-2-2.56-1.06l-4.5 4.5H4.5C3.36 7.5 2.44 8.43 2.44 9.57v4.86c0 1.14.92 2.07 2.06 2.07h1.94l4.5 4.5c.94.95 2.56.28 2.56-1.06V4.06z"/><path d="M16 9.5l5 5m0-5l-5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>';
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

/* yazı efekti */
const hi = "hi stalker";
let ci = 0;
(function type(){
  if (ci < hi.length) { $('tt').textContent += hi[ci++]; setTimeout(type, 90 + Math.random()*70); }
  else { $('cur').style.display = 'none'; $('enter').classList.add('show'); }
})();

/* video */
function load(i){
  idx = (i + vids.length) % vids.length;
  v.classList.remove('on');
  v.src = vids[idx].f;
  v.load();
  v.play().catch(()=>{});
  ui();
}
v.addEventListener('loadeddata', () => v.classList.add('on'));

function ui(){
  const n = vids[idx].n;
  $('name').textContent = n;
  $('pickName').textContent = n;
  $('num').textContent = String(idx+1).padStart(2,'0') + '/' + String(vids.length).padStart(2,'0');
  $('list').innerHTML = vids.map((x,k) =>
    `<div class="it ${k===idx?'act':''}" data-k="${k}"><em>${String(k+1).padStart(2,'0')}</em>${x.n}</div>`).join('');
}
$('list').addEventListener('click', e => {
  const it = e.target.closest('.it'); if (!it) return;
  load(+it.dataset.k); setPP(true); $('list').classList.remove('open');
});
$('pick').onclick = e => { e.stopPropagation(); $('list').classList.toggle('open'); };
document.addEventListener('click', e => { if (!$('bl').contains(e.target)) $('list').classList.remove('open'); });

function setPP(p){ $('ppi').innerHTML = p ? PAUSE : PLAY; }
function toggle(){ if (v.paused) { v.play().catch(()=>{}); setPP(true); } else { v.pause(); setPP(false); } }
$('prev').onclick = () => { load(idx-1); setPP(true); };
$('next').onclick = () => { load(idx+1); setPP(true); };
$('pp').onclick = toggle;

/* ses */
function setVol(x){
  v.volume = x; v.muted = x === 0;
  $('fl').style.width = (x*100) + '%';
  $('mi').innerHTML = x === 0 ? ICON_OFF : ICON_ON;
  if (x > 0) last = x;
}
$('vs').oninput = e => setVol(+e.target.value);
$('mute').onclick = () => {
  const x = (v.muted || v.volume === 0) ? (last || .5) : 0;
  $('vs').value = x; setVol(x);
};
setVol(.5);

function initAudio(){
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    an = actx.createAnalyser();
    an.fftSize = 256; an.smoothingTimeConstant = .4;
    const s = actx.createMediaElementSource(v);
    s.connect(an); an.connect(actx.destination);
    buf = new Uint8Array(an.frequencyBinCount);
  } catch(e){ console.log(e); }
}

function start(){
  if (started) return;
  started = true;
  $('splash').classList.add('out');
  document.body.classList.add('in');
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  load(0);
  v.muted = false; v.volume = +$('vs').value;
  v.play().then(()=>setPP(true)).catch(()=>{ v.muted = true; v.play(); setPP(true); });
}
$('enter').onclick = start;

addEventListener('keydown', e => {
  if (!started) { if (e.key === 'Enter') start(); return; }
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('prev').click();
  else if (e.key.toLowerCase() === 'm') $('mute').click();
});

/* saat, ping */
const pad = n => String(n).padStart(2,'0');
function tick(){ const d = new Date(); $('clock').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
setInterval(tick, 1000); tick();
async function ping(){
  const t = performance.now();
  try { await fetch(location.href, {method:'HEAD', cache:'no-store'}); $('ping').textContent = Math.round(performance.now()-t) + ' ms'; }
  catch { $('ping').textContent = (10 + Math.floor(Math.random()*6)) + ' ms'; }
}
ping(); setInterval(ping, 10000);

/* avatar */
let mx = 0, my = 0, px = 0, py = 0;
addEventListener('pointermove', e => { mx = (e.clientX/innerWidth - .5)*14; my = (e.clientY/innerHeight - .5)*14; });

let sc = 1, lvl = 0, peak = .3;
function frame(t){
  requestAnimationFrame(frame);
  let target = 0;
  const live = !v.paused && buf;
  if (live) {
    an.getByteFrequencyData(buf);
    let b = 0, m = 0;
    for (let i = 0; i < 8; i++) b += buf[i];
    for (let i = 8; i < 22; i++) m += buf[i];
    const raw = (b/8*.7 + m/14*.3) / 255;
    peak = Math.max(raw, peak*.996, .18);
    target = Math.pow(raw/peak, 1.7);
  }
  lvl += (target - lvl) * (target > lvl ? .6 : .13);
  px += (mx - px)*.06; py += (my - py)*.06;

  const idle = live ? 0 : (.5 + .5*Math.sin(t/1200)) * .03;
  sc = 1 + lvl*.26 + idle;
  av.style.transform = `translate(${px}px,${py}px) scale(${sc})`;
  av.style.boxShadow =
    `0 0 ${lvl*30}px rgba(255,255,255,${lvl*.12})`;

  if (started && v.duration) $('prog').style.width = (v.currentTime/v.duration*100) + '%';
}
requestAnimationFrame(frame);
</script>
</body>
</html>
