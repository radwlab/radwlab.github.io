<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>radw :: Experience</title>
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/736x/34/cf/0c/34cf0c84b585182ccb109492e2564058.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent-color: #2997ff;
            --card-bg: rgba(26, 26, 28, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            /* Locomotive Scroll için gerekli */
            overscroll-behavior: none;
        }

        /* Navigasyon Bar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-content {
            width: 100%;
            max-width: 1024px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            color: var(--text-primary);
        }

        /* Genel Bölüm Ayarları (Tam ekran olması için) */
        .section {
            width: 100%;
            height: 100vh; /* Tam ekran yüksekliği */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        
        /* Aktif/Görünür bölüm (Locomotive Scroll ile tetiklenir) */
        .section.is-inview {
            opacity: 1;
            visibility: visible;
        }

        /* Hero Bölümü */
        .hero-section {
            background: radial-gradient(circle at center, #111 0%, #000 70%);
            text-align: center;
        }

        .hero-title {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        .hero-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Vitrin Kartları (Apple Tarzı) */
        .showcase-container {
            width: 100%;
            max-width: 1024px;
            height: 85vh; /* Ekranın büyük kısmını kaplayan kart */
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 60px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.7);
        }

        .showcase-container.reverse {
            direction: rtl;
        }
        .showcase-container.reverse > * {
            direction: ltr;
        }

        .showcase-image-box {
            width: 100%;
            height: 100%;
            border-radius: 30px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .showcase-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .showcase-container:hover .showcase-image-box img {
            transform: scale(1.02);
        }

        .showcase-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .showcase-heading {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 60px 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            height: auto !important;
        }

        /* Mobil Uyum */
        @media (max-width: 768px) {
            .showcase-container, .showcase-container.reverse {
                grid-template-columns: 1fr;
                height: 90vh;
                padding: 30px 20px;
                border-radius: 20px;
            }
            .showcase-image-box {
                height: 250px;
            }
            .hero-title {
                margin-bottom: 25px;
            }
             .hero-avatar {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-content">radw.</div>
    </nav>

    <main data-scroll-container>

        <section class="section hero-section" data-scroll-section>
            <div>
                <h1 class="hero-title" data-scroll data-scroll-speed="1">radw.</h1>
                <img class="hero-avatar" src="https://i.pinimg.com/1200x/c7/f2/7c/c7f27cf80aeb376ff2e0627b8e9167b6.jpg" alt="Radw Avatar" data-scroll data-scroll-speed="0.5">
            </div>
            <div class="scroll-indicator" data-scroll data-scroll-speed="-1">KEŞFETMEK İÇİN KAYDIRIN ↓</div>
        </section>

        <section class="section" data-scroll-section>
            <div class="showcase-container" data-scroll data-scroll-speed="2">
                <div class="showcase-image-box">
                    <img src="IMG_6381.jpeg" alt="Visual 1" data-scroll data-scroll-speed="1">
                </div>
                <div class="showcase-content">
                    <h2 class="showcase-heading">İnsanlar değişmez.</h2>
                </div>
            </div>
        </section>

        <section class="section" data-scroll-section>
            <div class="showcase-container reverse" data-scroll data-scroll-speed="2">
                <div class="showcase-image-box">
                    <img src="IMG_6411.jpeg" alt="Visual 2" data-scroll data-scroll-speed="1">
                </div>
                <div class="showcase-content">
                    <h2 class="showcase-heading">Ne sineği çöpten ne arıyı çiçekten vazgeçiremezsiniz.</h2>
                </div>
            </div>
        </section>

        <section class="section" data-scroll-section>
            <div class="showcase-container" data-scroll data-scroll-speed="2">
                <div class="showcase-image-box">
                    <img src="IMG_6437.jpeg" alt="Visual 3" data-scroll data-scroll-speed="1">
                </div>
                <div class="showcase-content">
                    <h2 class="showcase-heading">Herkes eninde sonunda kendi doğasına döner.</h2>
                </div>
            </div>
        </section>

        <footer data-scroll-section>
            <p>Copyright © 2026 radw. Tüm hakları saklıdır.</p>
        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.js"></script>
    <script>
        const scroll = new LocomotiveScroll({
            el: document.querySelector('[data-scroll-container]'),
            smooth: true,
            // Apple gibi bölüm atlamalı (snap) kaydırma için:
            smartphone: {
                smooth: true
            },
            tablet: {
                smooth: true
            }
        });
        
        // Sayfa yüklendiğinde veya kaydırıldığında animasyonları tetikle
        scroll.on('call', (obj, func) => {
            // Bu kısım görsel tetikleyiciler için kullanılabilir.
        });
    </script>
</body>
</html>
