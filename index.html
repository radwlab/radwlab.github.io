<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radw</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://i.pinimg.com/736x/27/56/78/275678444dbddd8183616ca8f1afa167.jpg') no-repeat center center/cover;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 380px;
            padding: 40px 25px 25px 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 18px;
        }

        .title {
            font-size: 2rem;
            font-style: italic;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .spotify-icon {
            display: inline-block;
            margin-bottom: 25px;
            opacity: 0.85;
            transition: transform 0.3s, opacity 0.3s;
        }
        .spotify-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .spotify-icon svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .audio-player {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .volume-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #mute-btn {
            cursor: pointer;
            font-size: 0.85rem;
        }

        .slider-input {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, #ffffff 70%, rgba(255, 255, 255, 0.2) 70%);
            outline: none;
            cursor: pointer;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .slider-input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <img class="avatar" src="https://i.pinimg.com/1200x/c7/f2/7c/c7f27cf80aeb376ff2e0627b8e9167b6.jpg" alt="Avatar">

        <div class="title">radw</div>

        <a href="https://open.spotify.com/user/31ikp7uox6cpwxr2ikuy6z7gpfym?si=e932a7bd28154bde" target="_blank" class="spotify-icon">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C13.62 9.9 19.08 10.56 22.8 12.84c.36.24.48.84.161 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.72 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        </a>

        <div class="audio-player">
            <div>👁 1</div>
            <div class="volume-bar">
                <span id="mute-btn">🔊</span>
                <input type="range" id="volume-slider" class="slider-input" min="0" max="100" value="70">
            </div>
        </div>
    </div>

    <div id="yt-player" style="display:none;"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        var lastVolume = 70;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: 'F1K7GJFqUQc',
                playerVars: {
                    'start': 94,
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'F1K7GJFqUQc',
                    'enablejsapi': 1
                }
            });
        }

        document.addEventListener('click', function() {
            if (player && player.playVideo) {
                player.seekTo(94);
                player.playVideo();
                player.setVolume(70);
            }
        }, { once: true });

        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');

        function setVolumeUI(val) {
            volumeSlider.value = val;
            volumeSlider.style.background = `linear-gradient(to right, #ffffff ${val}%, rgba(255, 255, 255, 0.2) ${val}%)`;
            
            if (val == 0) {
                muteBtn.textContent = '🔇';
            } else if (val < 50) {
                muteBtn.textContent = '🔉';
            } else {
                muteBtn.textContent = '🔊';
            }
        }

        volumeSlider.addEventListener('input', function() {
            var val = this.value;
            if (player && typeof player.setVolume === 'function') {
                player.setVolume(val);
            }
            setVolumeUI(val);
        });

        muteBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!player) return;

            if (volumeSlider.value > 0) {
                lastVolume = volumeSlider.value;
                if (typeof player.setVolume === 'function') player.setVolume(0);
                setVolumeUI(0);
            } else {
                var targetVol = lastVolume > 0 ? lastVolume : 70;
                if (typeof player.setVolume === 'function') player.setVolume(targetVol);
                setVolumeUI(targetVol);
            }
        });
    </script>

</body>
</html>
