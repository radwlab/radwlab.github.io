<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radw :: Experience</title>
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/736x/34/cf/0c/34cf0c84b585182ccb109492e2564058.jpg">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent-color: #2997ff;
            --card-bg: rgba(22, 22, 24, 0.7);
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-content {
            width: 100%;
            max-width: 1024px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .nav-logo {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            background: radial-gradient(circle at center, #111 0%, #000 75%);
        }

        .hero-title {
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 25px;
            background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .hero-avatar:hover {
            transform: scale(1.06);
            border-color: var(--accent-color);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 35px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        .showcase-section {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            opacity: 0;
            transform: translateY(50px); /* Başlangıçta aşağıda ve görünmez */
            transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1), transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .showcase-section.visible {
            opacity: 1;
            transform: translateY(0); /* Kaydırınca yerine ve görünür hale gel */
        }

        .showcase-container {
            width: 100%;
            max-width: 1060px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 50px;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 50px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .showcase-container.reverse {
            grid-template-columns: 0.9fr 1.1fr;
        }

        .showcase-image-box {
            width: 100%;
            height: 380px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .showcase-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .showcase-container:hover .showcase-image-box img {
            transform: scale(1.04);
        }

        .showcase-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .showcase-heading {
            font-size: clamp(2.2rem, 4vw, 3rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        footer {
            text-align: center;
            padding: 60px 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .showcase-container, .showcase-container.reverse {
                grid-template-columns: 1fr;
                padding: 30px 20px;
            }
            .showcase-image-box {
                height: 280px;
            }
            .showcase-heading {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <div class="nav-logo">radw.</div>
        </div>
    </nav>

    <section class="hero-section">
        <h1 class="hero-title">radw.</h1>
        <img class="hero-avatar" src="https://i.pinimg.com/1200x/c7/f2/7c/c7f27cf80aeb376ff2e0627b8e9167b6.jpg" alt="Radw Avatar">
        <div class="scroll-indicator">DEVAM ETMEK İçİN KAYDIRIN ↓</div>
    </section>

    <section class="showcase-section">
        <div class="showcase-container">
            <div class="showcase-image-box">
                <img src="IMG_6381.jpeg" alt="Visual 1">
            </div>
            <div class="showcase-content">
                <h2 class="showcase-heading">İnsanlar değişmez.</h2>
            </div>
        </div>
    </section>

    <section class="showcase-section">
        <div class="showcase-container reverse">
            <div class="showcase-image-box">
                <img src="IMG_6411.jpeg" alt="Visual 2">
            </div>
            <div class="showcase-content">
                <h2 class="showcase-heading">Ne sineği çöpten ne arıyı çiçekten vazgeçiremezsiniz.</h2>
            </div>
        </div>
    </section>

    <section class="showcase-section">
        <div class="showcase-container">
            <div class="showcase-image-box">
                <img src="IMG_6437.jpeg" alt="Visual 3">
            </div>
            <div class="showcase-content">
                <h2 class="showcase-heading">Herkes eninde sonunda kendi doğasına döner.</h2>
            </div>
        </div>
    </section>

    <footer>
        <p>Copyright © 2026 radw. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        // Aşağı kaydırdıkça Apple tarzı yumuşak fade-in animasyonları
        const observerOptions = {
            threshold: 0.2 // Bölümün %20'si ekrana girdiğinde animasyon başlar
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.showcase-section').forEach(section => {
            observer.observe(section);
        });
    </script>
</body>
</html>
