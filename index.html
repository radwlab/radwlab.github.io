<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/jpeg" sizes="32x32" href="mertbest.png">
    <link rel="icon" type="image/jpeg" sizes="192x192" href="mertbest.png">
    <link rel="apple-touch-icon" sizes="180x180" href="mertbest.png">
    <title>forever</title>
    <link rel="icon" type="image/jpeg" href="mertbest.png">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #08080a 0%, #030304 60%, #000000 100%);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.45);
            
            --glass-bg: rgba(12, 12, 16, 0.55);
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-hover-bg: rgba(25, 25, 35, 0.75);
            --glass-hover-border: rgba(255, 255, 255, 0.2);
            --accent-glow: rgba(255, 255, 255, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        /* Tüm Butonlarda Odak Parlamasını/Halkasını Engelleme */
        button, input, a {
            outline: none !important;
            -webkit-user-select: none;
            user-select: none;
        }

        button:focus, button:focus-visible, button:active {
            outline: none !important;
            box-shadow: none !important;
        }

        html, body {
            background: #000000;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Giriş Ekranı */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            z-index: 9999;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .typewriter-text {
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            color: var(--text-primary);
            min-height: 1.5rem;
            font-family: "SF Mono", Monaco, Consolas, monospace;
            text-transform: lowercase;
        }

        .cursor {
            display: inline-block;
            background-color: var(--text-primary);
            width: 7px;
            height: 1.05rem;
            vertical-align: middle;
            animation: blink 0.8s infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 36px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .enter-btn.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .enter-btn:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        /* Arka Plan Video */
        .bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            background: #000;
            overflow: hidden;
            transform: translateZ(0);
        }

        .bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.88;
            filter: brightness(0.95) contrast(1.05);
            transform: translateZ(0);
        }

        /* Widget Temelleri */
        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
        }

        /* Sol Üst: Ping ve Saat Widget */
        .top-left-widget {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.08em;
        }

        .ping-box {
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ping-dot {
            width: 6px;
            height: 6px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: rgba(255, 255, 255, 0.12);
        }

        .clock-box {
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            font-family: "SF Mono", Monaco, monospace;
            opacity: 0.85;
        }

        /* Tam Merkez: Ultra Reaktif Siyah Top */
        .avatar-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
        }

        .top-center-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            will-change: transform, box-shadow;
            box-shadow: 
                inset 0 0 15px rgba(255, 255, 255, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.08),
                0 15px 35px rgba(0, 0, 0, 0.9);
        }

        .top-center-avatar::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            opacity: 0.5;
            pointer-events: none;
        }

        .top-center-avatar img {
            width: 82%;
            height: 82%;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
            filter: contrast(1.05);
        }

        /* Sol Alt: Tek Kayan Yazı ve Açılır Liste Kutusu */
        .bottom-left-container {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 100;
        }

        .marquee-btn {
            padding: 10px 16px;
            width: 140px;
            overflow: hidden;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .marquee-btn:hover {
            border-color: var(--glass-hover-border);
            background: var(--glass-hover-bg);
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .marquee-text {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--text-primary);
            text-transform: lowercase;
            display: inline-block;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.9;
        }

        /* Sol Altta Açılan Video Listesi Menüsü */
        .popup-menu {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 0;
            background: rgba(8, 8, 12, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px;
            border-radius: 16px;
            width: 180px;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px) scale(0.96);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .popup-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .menu-item {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            transition: all 0.15s ease;
            width: 100%;
            white-space: nowrap;
        }

        .menu-item:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
        }

        .menu-item.active {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.08);
        }

        .menu-item svg {
            width: 10px;
            height: 10px;
            fill: currentColor;
            flex-shrink: 0;
            opacity: 0.5;
        }

        /* Orta Alt: Video Bilgi Rozeti ve Kontrol Grubu */
        .center-controls-wrapper {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Yeni Şık Video İsim Göstergesi */
        .video-status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: lowercase;
            color: rgba(255, 255, 255, 0.85);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .video-status-badge .badge-num {
            font-family: "SF Mono", Monaco, monospace;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.65rem;
        }

        .video-status-badge .badge-dot {
            width: 4px;
            height: 4px;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0.6;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        .video-status-badge .badge-title {
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.08em;
        }

        .center-dock {
            display: flex;
            gap: 6px;
            padding: 6px;
            border-radius: 18px;
        }

        .control-btn {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            width: 36px;
            height: 34px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
            outline: none !important;
            box-shadow: none !important;
        }

        .control-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.14);
            transform: scale(0.96);
        }

        .control-btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
            pointer-events: none;
        }

        /* Sağ Alt: Ses Paneli */
        .audio-dock {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 16px;
        }

        .audio-icon-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            transition: color 0.15s;
            outline: none !important;
        }

        .audio-icon-btn:hover {
            color: #ffffff;
        }

        .audio-icon-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .audio-slider-container {
            position: relative;
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .audio-fill-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: #ffffff;
            pointer-events: none;
            border-radius: 2px;
            opacity: 0.9;
        }

        .audio-slider {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-appearance: none;
            background: transparent;
            outline: none;
            cursor: pointer;
            z-index: 2;
            margin: 0;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 0;
            height: 0;
            background: transparent;
        }

        /* Mobil Cihaz Uyumluluğu */
        @media screen and (max-width: 768px) {
            .top-left-widget {
                top: 15px;
                left: 15px;
                padding: 6px 12px;
            }
            .bottom-left-container {
                left: 15px;
                bottom: 20px;
            }
            .marquee-btn {
                width: 110px;
                padding: 8px 12px;
            }
            .center-controls-wrapper {
                bottom: 20px;
            }
            .audio-dock {
                right: 15px;
                bottom: 20px;
                padding: 6px 10px;
            }
            .audio-slider-container {
                width: 45px;
            }
        }
    </style>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="splash-screen">
        <div class="typewriter-text"><span id="typedText"></span><span class="cursor" id="typeCursor"></span></div>
        <button class="enter-btn" id="enterBtn">giriş</button>
    </div>

    <!-- Sol Üst: Ping ve Saat Widget -->
    <div class="top-left-widget glass-panel">
        <div class="ping-box">
            <span class="ping-dot"></span>
            <span id="pingText">15 ms</span>
        </div>
        <div class="divider"></div>
        <div class="clock-box" id="clockText">00:00:00</div>
    </div>

    <!-- Arka Plan Video -->
    <div class="bg-video-container">
        <video id="bgVideo" loop playsinline webkit-playsinline crossorigin="anonymous" preload="none"></video>
    </div>

    <!-- Tam Merkez: Ultra Reaktif Siyah Top -->
    <div class="avatar-wrapper">
        <div class="top-center-avatar" id="avatarElement">
            <img src="mert.PNG" alt="Avatar" id="userAvatar">
        </div>
    </div>

    <!-- Sol Alt: Video İsmi ve Açılır Liste -->
    <div class="bottom-left-container" id="bottomLeftContainer">
        <div class="popup-menu" id="videoPopupList"></div>
        <button class="marquee-btn glass-panel" id="marqueeBtn" title="Video Listesi">
            <div class="marquee-track">
                <span class="marquee-text" id="marqueeText">yükleniyor...</span>
            </div>
        </button>
    </div>

    <!-- Orta Alt: Şık Video İsmi Göstergesi + Kontroller -->
    <div class="center-controls-wrapper">
        <div class="video-status-badge glass-panel" id="statusBadge">
            <span class="badge-num" id="badgeNum">01/06</span>
            <span class="badge-dot"></span>
            <span class="badge-title" id="badgeTitle">beyaz</span>
        </div>
        <div class="center-dock glass-panel">
            <button class="control-btn" id="prevVideoBtn" title="Önceki Video">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="control-btn" id="playPauseBtn" title="Oynat / Durdur">
                <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="control-btn" id="nextVideoBtn" title="Sonraki Video">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <!-- Sağ Alt: Ses Paneli -->
    <div class="audio-dock glass-panel" id="audioDock">
        <button class="audio-icon-btn" id="muteToggleBtn" title="Sesi Aç/Kapat">
            <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.068.926-2.068 2.068v6.864c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/></svg>
        </button>
        <div class="audio-slider-container">
            <div class="audio-fill-bar" id="audioFillBar"></div>
            <input type="range" class="audio-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <script>
        const videoList = [
            { name: "beyaz", file: "beyaz.mp4" },
            { name: "atreides", file: "atreides.mp4" },
            { name: "prime", file: "prime.mp4" },
            { name: "southpaw", file: "southpaw.MP4" },
            { name: "zehir", file: "zehir.MP4" },
            { name: "scream", file: "scream.mp4" }
        ];

        let currentVideoIndex = 0;
        const bgVideo = document.getElementById('bgVideo');
        const splashScreen = document.getElementById('splash-screen');
        const enterBtn = document.getElementById('enterBtn');
        const typedTextEl = document.getElementById('typedText');
        const typeCursor = document.getElementById('typeCursor');
        const marqueeText = document.getElementById('marqueeText');
        const clockText = document.getElementById('clockText');
        const pingText = document.getElementById('pingText');
        const avatarElement = document.getElementById('avatarElement');
        const badgeNum = document.getElementById('badgeNum');
        const badgeTitle = document.getElementById('badgeTitle');
        let hasInteracted = false;

        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let isAudioInitialized = false;

        let currentScale = 1;
        let currentGlow = 0;

        function initAudioContext() {
            if (isAudioInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(bgVideo);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 128;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioInitialized = true;
            } catch (e) {
                console.log("AudioContext başlatılamadı:", e);
            }
        }

        function updateAvatarReactivity() {
            requestAnimationFrame(updateAvatarReactivity);
            
            let targetScale = 1;
            let targetGlow = 0;

            if (!bgVideo.paused && isAudioInitialized && analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                
                let bassSum = 0;
                let bassCount = 6;
                for (let i = 0; i < bassCount; i++) {
                    bassSum += dataArray[i];
                }
                let bassAvg = bassSum / bassCount;
                let intensity = bassAvg / 255;
                
                targetScale = 1 + (intensity * 0.38);
                targetGlow = intensity;
            }

            currentScale += (targetScale - currentScale) * 0.18;
            currentGlow += (targetGlow - currentGlow) * 0.18;

            let glowSpread = currentGlow * 55;
            let glowAlpha = currentGlow * 0.85;
            let borderAlpha = 0.08 + (currentGlow * 0.35);

            avatarElement.style.transform = `scale(${currentScale})`;
            avatarElement.style.boxShadow = `
                inset 0 0 20px rgba(255, 255, 255, ${0.15 + currentGlow * 0.35}),
                0 0 0 1px rgba(255, 255, 255, ${borderAlpha}),
                0 0 ${glowSpread}px ${glowSpread * 0.2}px rgba(255, 255, 255, ${glowAlpha * 0.25}),
                0 20px 45px rgba(0, 0, 0, 0.95)
            `;
        }
        updateAvatarReactivity();

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockText.textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function measurePing() {
            const start = performance.now();
            try {
                await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
                const duration = Math.round(performance.now() - start);
                pingText.textContent = `${duration} ms`;
            } catch {
                pingText.textContent = `${Math.floor(Math.random() * 6) + 10} ms`;
            }
        }
        measurePing();
        setInterval(measurePing, 10000);

        const greetingText = "hi stalker";
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < greetingText.length) {
                typedTextEl.textContent += greetingText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 110);
            } else {
                typeCursor.style.display = 'none';
                enterBtn.classList.add('show');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateFillBar(0.5);
            loadVideoUI(0);
            setTimeout(typeWriter, 400);
        });

        function loadVideo(index) {
            currentVideoIndex = (index + videoList.length) % videoList.length;
            bgVideo.src = videoList[currentVideoIndex].file;
            bgVideo.load();
            bgVideo.play().catch(() => {});
            
            loadVideoUI(currentVideoIndex);
        }

        function loadVideoUI(index) {
            const name = videoList[index].name;
            marqueeText.textContent = name;
            badgeTitle.textContent = name;
            
            const numFormatted = String(index + 1).padStart(2, '0');
            const totalFormatted = String(videoList.length).padStart(2, '0');
            badgeNum.textContent = `${numFormatted}/${totalFormatted}`;
            
            updateVideoListUI();
        }

        function updateVideoListUI() {
            const container = document.getElementById('videoPopupList');
            container.innerHTML = '';
            videoList.forEach((vid, idx) => {
                const item = document.createElement('div');
                item.className = `menu-item ${idx === currentVideoIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <svg viewBox="0 0 24 24"><path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
                    ${vid.name}
                `;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    loadVideo(idx);
                    updatePlayPauseIcon(true);
                    toggleVideoPopup(false);
                });
                container.appendChild(item);
            });
        }

        const videoPopupList = document.getElementById('videoPopupList');
        const marqueeBtn = document.getElementById('marqueeBtn');

        function toggleVideoPopup(open) {
            if (open) {
                updateVideoListUI();
                videoPopupList.classList.add('open');
            } else {
                videoPopupList.classList.remove('open');
            }
        }

        marqueeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleVideoPopup(!videoPopupList.classList.contains('open'));
            e.currentTarget.blur();
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('bottomLeftContainer').contains(e.target)) {
                toggleVideoPopup(false);
            }
        });

        const prevVideoBtn = document.getElementById('prevVideoBtn');
        const nextVideoBtn = document.getElementById('nextVideoBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');

        function updatePlayPauseIcon(isPlaying) {
            if (isPlaying) {
                playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        prevVideoBtn.addEventListener('click', (e) => {
            loadVideo(currentVideoIndex - 1);
            updatePlayPauseIcon(true);
            toggleVideoPopup(false);
            e.currentTarget.blur();
        });

        nextVideoBtn.addEventListener('click', (e) => {
            loadVideo(currentVideoIndex + 1);
            updatePlayPauseIcon(true);
            toggleVideoPopup(false);
            e.currentTarget.blur();
        });

        playPauseBtn.addEventListener('click', (e) => {
            if (bgVideo.paused) {
                bgVideo.play().catch(() => {});
                updatePlayPauseIcon(true);
            } else {
                bgVideo.pause();
                updatePlayPauseIcon(false);
            }
            e.currentTarget.blur();
        });

        function startSite() {
            if (hasInteracted) return;
            hasInteracted = true;
            
            splashScreen.classList.add('fade-out');
            
            loadVideo(0);
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const currentVol = parseFloat(document.getElementById('volumeSlider').value);
            bgVideo.muted = false;
            bgVideo.volume = currentVol;
            bgVideo.play().then(() => {
                updatePlayPauseIcon(true);
            }).catch(() => {
                bgVideo.muted = true;
                bgVideo.play();
                updatePlayPauseIcon(true);
            });
        }

        enterBtn.addEventListener('click', startSite);
        enterBtn.addEventListener('touchend', startSite);

        const volumeSlider = document.getElementById('volumeSlider');
        const muteToggleBtn = document.getElementById('muteToggleBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const audioFillBar = document.getElementById('audioFillBar');
        let lastVolume = 0.5;

        function updateFillBar(vol) {
            audioFillBar.style.width = `${vol * 100}%`;
        }

        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            bgVideo.volume = vol;
            bgVideo.muted = (vol === 0);
            updateVolumeIcon(vol);
            updateFillBar(vol);
            if (vol > 0) lastVolume = vol;
        });

        muteToggleBtn.addEventListener('click', (e) => {
            if (bgVideo.muted || bgVideo.volume === 0) {
                bgVideo.muted = false;
                bgVideo.volume = lastVolume > 0 ? lastVolume : 0.5;
                volumeSlider.value = bgVideo.volume;
                updateVolumeIcon(bgVideo.volume);
                updateFillBar(bgVideo.volume);
            } else {
                lastVolume = bgVideo.volume;
                bgVideo.muted = true;
                bgVideo.volume = 0;
                volumeSlider.value = 0;
                updateVolumeIcon(0);
                updateFillBar(0);
            }
            e.currentTarget.blur();
        });

        function updateVolumeIcon(vol) {
            if (vol === 0) {
                volumeIcon.innerHTML = '<path d="M3.63 3.63a.996.996 0 000 1.41L7.29 8.7 4.5 11.49c-1.141 0-2.068.926-2.068 2.068v6.864c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5c.944.945 2.56.276 2.56-1.06v-3.37l4.36 4.36a.996.996 0 101.41-1.41L5.04 3.63a.996.996 0 00-1.41 0zM11.94 17.5L8.44 14H4.5V9.5h3.94l3.5-3.5v11.5zM19 12c0 .82-.28 1.58-.75 2.19l1.42 1.42C20.3 14.67 21 13.4 21 12c0-2.54-1.46-4.73-3.58-5.78l-1.06 1.06C17.78 8.1 19 9.9 19 12 z"/>';
            } else {
                volumeIcon.innerHTML = '<path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.068.926-2.068 2.068v6.864c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/>';
            }
        }
    </script>
</body>
</html>
