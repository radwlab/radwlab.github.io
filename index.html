<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>forever</title>
<meta name="description" content="forever">
<meta property="og:type" content="website">
<meta property="og:title" content="forever">
<meta property="og:description" content="forever">
<meta property="og:image" content="https://mert.best/kapak.jpg">
<meta property="og:url" content="https://mert.best/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<link rel="icon" href="mertbest.png">
<link rel="apple-touch-icon" href="mertbest.png">
<style>
:root{--dim:rgba(255,255,255,.58);--line:rgba(255,255,255,.18);--ease:cubic-bezier(.16,1,.3,1);
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,a{font:inherit;color:inherit;background:none;border:0;outline:0;text-decoration:none;cursor:pointer}
:focus-visible{outline:1.5px solid #fff;outline-offset:3px}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased}

#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
body.in #bg{opacity:1}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.62),transparent 30%),linear-gradient(to bottom,rgba(0,0,0,.5),transparent 22%)}

.ui{opacity:0;transform:translateY(10px);transition:opacity 1s .6s var(--ease),transform 1s .6s var(--ease)}
body.in .ui{opacity:1;transform:none}

/* discord */
#pres{position:fixed;z-index:10;top:calc(18px + var(--st));left:50%;margin-left:-110px;width:220px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;border-radius:99px;background:rgba(10,10,10,.55);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font:500 .68rem var(--mono);letter-spacing:.1em;transition:border-color .3s,opacity 1s .6s var(--ease),transform 1s .6s var(--ease)}
#pres:hover{border-color:rgba(255,255,255,.4)}
#pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#444;flex:none}
.dot[data-s=online]{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.16)}
.dot[data-s=idle]{background:#aaa}.dot[data-s=dnd]{background:#777}
#card{position:fixed;z-index:20;top:calc(68px + var(--st));left:50%;width:min(340px,calc(100vw - 32px));margin-left:calc(min(340px,calc(100vw - 32px))/-2);padding:16px;border-radius:20px;background:rgba(10,10,10,.86);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;flex-direction:column;gap:14px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:50% 0;transition:opacity .3s,transform .5s var(--ease),visibility 0s .5s}
body.pr #card{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .5s var(--ease)}
.ch{display:flex;align-items:center;gap:12px}
#cimg{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
#cname{font:600 .95rem var(--sans);letter-spacing:.03em}
#cuser{font:500 .64rem var(--mono);letter-spacing:.08em;color:var(--dim);margin-top:3px}
.cr{display:flex;gap:12px;align-items:center;padding-top:13px;border-top:1px solid var(--line);min-width:0}
.cr img{width:48px;height:48px;border-radius:9px;object-fit:cover;flex:none}
.cr div{display:flex;flex-direction:column;gap:3px;min-width:0}
.cr small{font:500 .54rem var(--mono);letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.cr b{font:600 .8rem var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr span{font:500 .66rem var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* oynat + ses */
#dock{position:fixed;z-index:10;left:50%;bottom:calc(26px + var(--sb));transform:translate(-50%,10px);display:flex;align-items:center;gap:12px;padding:8px;border-radius:99px;background:rgba(10,10,10,.55);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
body.in #dock{transform:translateX(-50%)}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:background .25s var(--ease),color .25s,transform .25s var(--ease)}
.ib svg{width:18px;height:18px;fill:#fff;transition:fill .25s}
#pp{background:#fff}#pp svg{fill:#000}
#pp:hover{background:rgba(255,255,255,.85)}
#mute:hover{background:rgba(255,255,255,.12)}
.ib:active{transform:scale(.92)}
#vol{position:relative;width:96px;height:22px;margin-right:12px;display:flex;align-items:center}
#vol .tr,#vol .fl{position:absolute;left:0;height:2px;border-radius:2px}
#vol .tr{right:0;background:rgba(255,255,255,.2)}
#vol .fl{background:#fff}
#vol input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0}

/* giriş */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.1s var(--ease),visibility 1.1s,transform 1.2s var(--ease),filter 1.1s}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.08);filter:blur(12px);pointer-events:none}
.eb{font:500 .72rem var(--mono);letter-spacing:.5em;color:var(--dim);padding-left:.5em;margin-bottom:26px;opacity:0;transform:translateY(8px);animation:up 1s .2s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
#typed{display:flex;font:200 clamp(2.6rem,11vw,5.4rem) var(--sans);letter-spacing:.16em;padding-left:.16em;line-height:1.1}
#typed span{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(24px);animation:ch 1.1s var(--ease) forwards;animation-delay:calc(var(--i)*.09s + .45s)}
@keyframes ch{to{opacity:1;filter:none;transform:none}}
#typed.done span{opacity:1;filter:none;transform:none;animation:wave 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*.14s)}
@keyframes wave{0%,100%{color:rgba(255,255,255,.6)}50%{color:#fff}}
#rule{position:relative;width:min(260px,56vw);height:1px;margin:30px 0 34px;background:rgba(255,255,255,.12);overflow:hidden}
#rule::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translateX(-100%)}
#rule.go::after{animation:sweep 1.6s var(--ease) forwards}
@keyframes sweep{to{transform:translateX(100%)}}
#enter{position:relative;display:flex;align-items:center;gap:14px;padding:14px 36px;border:1px solid rgba(255,255,255,.3);border-radius:99px;overflow:hidden;color:rgba(255,255,255,.9);font:500 .72rem var(--mono);letter-spacing:.34em;text-transform:lowercase;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .8s var(--ease),transform .8s var(--ease),color .3s,border-color .3s}
#enter::before{content:"";position:absolute;inset:0;background:#fff;transform:translateY(102%);transition:transform .42s var(--ease)}
#enter span,#enter svg{position:relative}
#enter svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;transition:transform .32s var(--ease)}
#enter.show{opacity:1;transform:none;pointer-events:auto}
#enter:hover{color:#000;border-color:#fff}#enter:hover::before{transform:none}#enter:hover svg{transform:translateX(4px)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div id="splash" role="dialog" aria-modal="true" aria-label="giriş">
  <div class="eb">hi stalker</div>
  <div id="typed" aria-label="forever"></div>
  <div id="rule"></div>
  <button id="enter"><span>giriş</span><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<video id="bg" loop playsinline webkit-playsinline preload="auto" muted></video>
<div class="shade"></div>

<button id="pres" class="ui" aria-label="discord"><i class="dot" id="dot" data-s="offline"></i><span id="pt">discord</span></button>

<aside id="card">
  <a class="ch" id="clink" href="https://discord.com/users/1089970384889192558" target="_blank" rel="noopener">
    <img id="cimg" alt=""><div><div id="cname"></div><div id="cuser"></div></div>
  </a>
  <div id="crows"></div>
</aside>

<nav id="dock" class="ui">
  <button class="ib" id="pp" aria-label="oynat / durdur"><svg id="ppi" viewBox="0 0 24 24"></svg></button>
  <button class="ib" id="mute" aria-label="sesi aç / kapat"><svg id="mi" viewBox="0 0 24 24"></svg></button>
  <div id="vol"><div class="tr"></div><div class="fl" id="fl"></div><input type="range" id="vs" min="0" max="1" step="0.01" value="0.5" aria-label="ses"></div>
</nav>

<script>
const FILE="megatron .mp4",DISCORD_ID="1089970384889192558";
const $=id=>document.getElementById(id),v=$('bg'),B=document.body;
const PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
const SON='<path d="M3 9.5v5h4l5 4.5V5L7 9.5H3z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>';
const SOFF='<path d="M3 9.5v5h4l5 4.5V5L7 9.5H3z"/><path d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>';
let started=false,last=.5;

/* giriş */
$('typed').innerHTML=[...'forever'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');
setTimeout(()=>$('rule').classList.add('go'),1200);
setTimeout(()=>$('enter').classList.add('show'),1700);
setTimeout(()=>$('typed').classList.add('done'),2600);
v.src=FILE;v.load();

/* video, oynat, ses */
const setPP=p=>{$('ppi').innerHTML=p?PAUSE:PLAY};
const toggle=()=>{if(v.paused){v.play().catch(()=>{});setPP(true)}else{v.pause();setPP(false)}};
function setVol(x){v.volume=x;v.muted=x===0;$('fl').style.width=x*100+'%';$('mi').innerHTML=x===0?SOFF:SON;if(x>0)last=x}
$('pp').onclick=toggle;
$('vs').oninput=e=>setVol(+e.target.value);
$('mute').onclick=()=>{const x=(v.muted||v.volume===0)?(last||.5):0;$('vs').value=x;setVol(x)};
setVol(.5);setPP(false);
function start(){
  if(started)return;started=true;
  $('splash').classList.add('out');B.classList.add('in');
  v.currentTime=0;v.muted=+$('vs').value===0;v.volume=+$('vs').value;
  v.play().then(()=>setPP(true)).catch(()=>{v.muted=true;v.play().catch(()=>{});setPP(true)});
}
$('enter').onclick=start;
addEventListener('keydown',e=>{
  if(!started){if(e.key==='Enter')start();return}
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key.toLowerCase()==='m')$('mute').click();
  else if(e.key==='Escape')B.classList.remove('pr');
});

/* discord (Lanyard) */
const STR={online:'çevrimiçi',idle:'boşta',dnd:'rahatsız etme',offline:'çevrimdışı'},ACT={0:'oynuyor',2:'dinliyor',3:'izliyor',5:'yarışıyor'};
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function actImg(a){const li=a.assets&&a.assets.large_image;if(!li)return null;
  if(li.startsWith('mp:'))return'https://media.discordapp.net/'+li.slice(3);
  if(li.startsWith('spotify:'))return'https://i.scdn.co/image/'+li.slice(8);
  return a.application_id?`https://cdn.discordapp.com/app-assets/${a.application_id}/${li}.png`:null}
function row(img,lbl,t1,t2){const r=mk('div','cr');if(img){const m=mk('img');m.src=img;m.alt='';r.append(m)}
  const d=mk('div');if(lbl)d.append(mk('small',null,lbl));d.append(mk('b',null,t1));if(t2)d.append(mk('span',null,t2));r.append(d);return r}
function render(d){
  const u=d.discord_user,st=d.discord_status||'offline',sp=d.listening_to_spotify&&d.spotify,acts=d.activities||[];
  const cs=acts.find(x=>x.type===4),ga=acts.find(x=>[0,3,5].includes(x.type));
  $('dot').dataset.s=st;
  $('pt').textContent=sp?'♪ '+sp.song:(ga?ga.name:((cs&&cs.state)||STR[st]));
  $('cimg').src=u.avatar?`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`:`https://cdn.discordapp.com/embed/avatars/${Number((BigInt(u.id)>>22n)%6n)}.png`;
  $('cname').textContent=u.global_name||u.username;$('cuser').textContent='@'+u.username;
  const rs=$('crows');rs.replaceChildren();
  rs.append(row(null,STR[st],(cs&&cs.state)||STR[st]));
  if(sp)rs.append(row(sp.album_art_url,'spotify dinliyor',sp.song,String(sp.artist).replace(/;\s*/g,', ')));
  else if(ga)rs.append(row(actImg(ga),ACT[ga.type]||'',ga.name,ga.details||ga.state||''));
}
async function discord(){try{const r=await fetch('https://api.lanyard.rest/v1/users/'+DISCORD_ID,{cache:'no-store'});const j=await r.json();if(j.success)render(j.data)}catch(e){}}
discord();setInterval(discord,12000);
$('pres').onclick=e=>{e.stopPropagation();B.classList.toggle('pr')};
$('card').onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>B.classList.remove('pr'));
</script>
</body>
</html>
