<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>radw</title>
    <link rel="icon" type="image/jpeg" href="radw.jpg">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow-y: scroll;
            height: 100dvh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Sinematik Giriş Ekranı */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-text {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: #ffffff;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.3s, transform 0.2s;
            opacity: 0;
            animation: fadeInBtn 0.8s forwards 1.2s;
        }

        .enter-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeInBtn {
            to { opacity: 1; }
        }

        /* Navigasyon Bar ve Üst Menü Seçenekleri */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            padding: 0 30px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .ping-dot {
            width: 6px;
            height: 6px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 8px #30d158;
        }

        /* Üst Menü Seçenekleri */
        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 400;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
        }

        .nav-logo {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        /* Ana Akış */
        .main-container {
            width: 100%;
            height: 100dvh;
            position: relative;
        }

        section {
            width: 100%;
            height: 100dvh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        /* Hero Bölümü */
        .hero-section {
            background: radial-gradient(circle at center, #111 0%, #000 70%);
            text-align: center;
            flex-direction: column;
        }

        .hero-title {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        .hero-profile-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .hero-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
        }

        .hero-subtitle {
            font-size: clamp(0.95rem, 1.8vw, 1.15rem);
            font-style: italic;
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            transform: rotate(-1.5deg);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* Video Bölümleri */
        .video-section {
            background: #000;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            bottom: max(40px, env(safe-area-inset-bottom, 20px) + 20px);
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 100;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            padding: 20px;
            border-radius: 20px;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-name {
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .audio-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .audio-slider {
            width: 80px;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .hero-title { margin-bottom: 20px; }
            .hero-avatar { width: 120px; height: 120px; }
            .nav-links { display: none; /* Mobilde üst menü kalabalık yapmasın diye gizlenebilir veya sadeleşebilir */ }
            .video-overlay {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                left: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Sinematik Giriş Ekranı -->
    <div id="splash-screen">
        <div class="splash-text"><span id="typewriter"></span><span class="cursor-blink"></span></div>
        <button class="enter-btn" id="enterBtn">giriş</button>
    </div>

    <!-- Üst Menü ve Seçenekler -->
    <nav>
        <div class="nav-left">
            <div class="ping-dot"></div>
            <span id="ping-text">14 ms</span>
            <span>|</span>
            <span id="clock-text">00:00:00</span>
        </div>
        
        <!-- Üst Kısım Seçenekleri -->
        <ul class="nav-links">
            <li><a onclick="scrollToSection(0)">Ana Sayfa</a></li>
            <li><a onclick="scrollToSection(1)">rs6</a></li>
            <li><a onclick="scrollToSection(2)">wav</a></li>
            <li><a onclick="scrollToSection(3)">how deep</a></li>
        </ul>

        <div class="nav-right">
            <a href="#" class="nav-logo">radw.</a>
        </div>
    </nav>

    <!-- Ana Akış -->
    <div class="main-container" id="mainContainer">
        
        <!-- 1. Bölüm: Hero -->
        <section class="hero-section">
            <h1 class="hero-title">radw.</h1>
            <div class="hero-profile-box">
                <img class="hero-avatar" src="https://i.pinimg.com/1200x/c7/f2/7c/c7f27cf80aeb376ff2e0627b8e9167b6.jpg" alt="Radw Avatar">
                <p class="hero-subtitle">"Solo temo a Dios"</p>
            </div>
            <div class="scroll-indicator">KEŞFETMEK İÇİN KAYDIRIN ↓</div>
        </section>

        <!-- 2. Bölüm: rs6 -->
        <section class="video-section">
            <div class="video-wrapper">
                <video class="section-vid" loop muted playsinline preload="metadata">
                    <source src="rs6.mp4" type="video/mp4">
                </video>
            </div>
            <div class="video-overlay">
                <div class="video-info"><span class="video-name">rs6</span></div>
                <div class="audio-control">
                    <span>Ses</span>
                    <input type="range" class="audio-slider" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>
        </section>

        <!-- 3. Bölüm: wav -->
        <section class="video-section">
            <div class="video-wrapper">
                <video class="section-vid" loop muted playsinline preload="metadata">
                    <source src="wav.mp4" type="video/mp4">
                </video>
            </div>
            <div class="video-overlay">
                <div class="video-info"><span class="video-name">wav</span></div>
                <div class="audio-control">
                    <span>Ses</span>
                    <input type="range" class="audio-slider" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>
        </section>

        <!-- 4. Bölüm: how deep is your love -->
        <section class="video-section">
            <div class="video-wrapper">
                <video class="section-vid" loop muted playsinline preload="metadata">
                    <source src="how%20deep%20is%20your%20love.mp4" type="video/mp4">
                </video>
            </div>
            <div class="video-overlay">
                <div class="video-info"><span class="video-name">how deep is your love</span></div>
                <div class="audio-control">
                    <span>Ses</span>
                    <input type="range" class="audio-slider" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>
        </section>

    </div>

    <script>
        const textToType = "radw.";
        const typewriterElement = document.getElementById('typewriter');
        const splashScreen = document.getElementById('splash-screen');
        const enterBtn = document.getElementById('enterBtn');
        let charIndex = 0;
        let hasInteracted = false;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typewriterElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 180);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeWriter, 300);
        });

        function startSite() {
            if (hasInteracted) return;
            hasInteracted = true;
            splashScreen.classList.add('fade-out');
            checkVisibleVideo();
        }

        enterBtn.addEventListener('click', startSite);
        enterBtn.addEventListener('touchend', startSite);

        // Üst Menü Seçenekleri ile Bölümlere Gitme
        const sections = document.querySelectorAll('#mainContainer > section');
        function scrollToSection(index) {
            if (sections[index]) {
                sections[index].scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Canlı Saat
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-text').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Rastgele Ping
        setInterval(() => {
            document.getElementById('ping-text').innerText = (Math.floor(Math.random() * 8) + 12) + ' ms';
        }, 3000);

        // Video Görünürlük Yöneticisi (Donma Önleyici Intersection Observer)
        const observerOptions = {
            root: null,
            threshold: 0.6
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                
                if (entry.isIntersecting) {
                    if (video && hasInteracted) {
                        video.muted = false;
                        const slider = entry.target.querySelector('.audio-slider');
                        if (slider) video.volume = parseFloat(slider.value);
                        video.play().catch(() => {});
                    }
                } else {
                    if (video) {
                        video.pause();
                        video.currentTime = 0;
                        video.muted = true;
                    }
                }
            });
        }, observerOptions);

        sections.forEach(section => {
            observer.observe(section);
        });

        function checkVisibleVideo() {
            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                const video = section.querySelector('video');
                if (rect.top >= 0 && rect.top < window.innerHeight / 2 && video && hasInteracted) {
                    video.muted = false;
                    const slider = section.querySelector('.audio-slider');
                    if (slider) video.volume = parseFloat(slider.value);
                    video.play().catch(() => {});
                }
            });
        }

        document.querySelectorAll('.audio-slider').forEach(slider => {
            slider.addEventListener('input', (e) => {
                const section = e.target.closest('section');
                const videoElement = section.querySelector('video');
                const volume = parseFloat(e.target.value);
                
                if (videoElement) {
                    videoElement.volume = volume;
                    videoElement.muted = (volume === 0);
                }
            });
        });
    </script>
</body>
</html>
