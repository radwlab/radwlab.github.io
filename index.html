<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>forever</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    user-select: none;
}

/* =========================
   VIDEO
========================= */

.video-layer {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 0;
}

#bgVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(.72) contrast(1.08);
}

.video-layer::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(0,0,0,.02),
            rgba(0,0,0,.48)
        ),
        linear-gradient(
            to bottom,
            rgba(0,0,0,.22),
            rgba(0,0,0,.10) 45%,
            rgba(0,0,0,.52)
        );

    pointer-events: none;
}

/* =========================
   SPLASH
========================= */

#splash-screen {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #000;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#splash-screen.hide {
    opacity: 0;
    visibility: hidden;
}

.intro {
    display: flex;
    align-items: center;
    min-height: 35px;
}

.typewriter-text {
    font-size: 20px;
    letter-spacing: 2.5px;
    color: rgba(255,255,255,.92);
}

.cursor {
    width: 1px;
    height: 21px;
    margin-left: 5px;

    background: #fff;

    animation: blink .7s infinite;
}

@keyframes blink {
    0%, 45% {
        opacity: 1;
    }

    46%, 100% {
        opacity: 0;
    }
}

.enter-btn {
    margin-top: 28px;

    padding: 10px 28px;

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 30px;

    background: rgba(255,255,255,.04);

    color: #fff;

    font-size: 13px;
    letter-spacing: 1px;

    cursor: pointer;

    transition: .25s ease;
}

.enter-btn:hover {
    background: rgba(255,255,255,.12);
    border-color: rgba(255,255,255,.4);
    transform: scale(1.03);
}

/* =========================
   TOP LEFT
========================= */

.top-left {
    position: fixed;

    top: 22px;
    left: 25px;

    z-index: 20;

    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 10px;
    letter-spacing: 1px;

    color: rgba(255,255,255,.68);

    text-shadow:
        0 2px 10px rgba(0,0,0,.9);
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
}

.status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 10px rgba(255,255,255,.8);
}

.ping {
    color: rgba(255,255,255,.55);
}

.top-separator {
    color: rgba(255,255,255,.25);
}

/* =========================
   CLOCK
========================= */

.clock {
    position: fixed;

    right: 25px;
    top: 22px;

    z-index: 20;

    font-size: 10px;
    letter-spacing: 1px;

    color: rgba(255,255,255,.6);

    text-shadow:
        0 2px 10px rgba(0,0,0,.9);
}

/* =========================
   CENTER
========================= */

.center-stage {
    position: fixed;

    top: 50%;
    left: 50%;

    width: 120px;
    height: 120px;

    transform:
        translate(-50%, -50%);

    z-index: 10;
}

/* =========================
   AVATAR
========================= */

.avatar-wrap {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 94px;
    height: 94px;

    transform:
        translate(-50%, -50%)
        scale(1);

    border-radius: 50%;

    padding: 2px;

    background: rgba(255,255,255,.13);

    box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 0 25px rgba(0,0,0,.95);

    z-index: 10;

    will-change:
        transform,
        box-shadow;
}

.avatar {
    display: block;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    object-fit: cover;

    pointer-events: none;
}

/* =========================
   TRACK INFO
========================= */

.track-info {
    position: fixed;

    left: 50%;
    bottom: 105px;

    transform: translateX(-50%);

    z-index: 20;

    width: min(85vw, 420px);

    text-align: center;

    text-shadow:
        0 2px 15px rgba(0,0,0,.95);
}

.track-title {
    font-size: 13px;
    letter-spacing: 1.5px;
    font-weight: 500;
}

.track-number {
    margin-top: 6px;

    font-size: 10px;
    letter-spacing: 2px;

    color: rgba(255,255,255,.52);
}

/* =========================
   VIDEO SELECTOR
========================= */

.video-selector {
    position: fixed;

    right: 24px;
    top: 50%;

    transform: translateY(-50%);

    z-index: 20;

    display: flex;
    flex-direction: column;
    gap: 7px;
}

.video-btn {
    width: 8px;
    height: 8px;

    padding: 0;

    border: 1px solid rgba(255,255,255,.45);
    border-radius: 50%;

    background: rgba(255,255,255,.08);

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.video-btn:hover {
    transform: scale(1.35);
}

.video-btn.active {
    background: #fff;

    box-shadow:
        0 0 10px rgba(255,255,255,.75);

    transform: scale(1.25);
}

/* =========================
   CONTROLS
========================= */

.controls {
    position: fixed;

    left: 50%;
    bottom: 35px;

    transform: translateX(-50%);

    z-index: 20;

    display: flex;
    align-items: center;
    gap: 12px;
}

/* GENEL BUTON */

.control-btn {
    width: 38px;
    height: 38px;

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 50%;

    background:
        rgba(0,0,0,.28);

    color: rgba(255,255,255,.82);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    opacity: .85;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.35),
        inset 0 0 0 1px rgba(255,255,255,.025);

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}

/* İLERİ GERİ */

.nav-btn {
    font-family: Arial, Helvetica, sans-serif;

    font-size: 25px;
    font-weight: 200;

    line-height: 1;

    padding-bottom: 2px;
}

.nav-btn:hover {
    opacity: 1;

    color: #fff;

    background:
        rgba(255,255,255,.10);

    border-color:
        rgba(255,255,255,.42);

    box-shadow:
        0 0 18px rgba(255,255,255,.10),
        0 5px 20px rgba(0,0,0,.45);

    transform: scale(1.08);
}

.nav-btn:active {
    transform: scale(.94);
}

/* SOL */

#prevBtn {
    padding-right: 2px;
}

/* SAĞ */

#nextBtn {
    padding-left: 2px;
}

/* PLAY */

.play-btn {
    width: 44px;
    height: 44px;

    border-color:
        rgba(255,255,255,.30);

    background:
        rgba(255,255,255,.055);

    color: #fff;

    font-size: 13px;

    opacity: 1;

    box-shadow:
        0 0 22px rgba(255,255,255,.06),
        0 6px 25px rgba(0,0,0,.45);
}

.play-btn:hover {
    background:
        rgba(255,255,255,.12);

    border-color:
        rgba(255,255,255,.55);

    box-shadow:
        0 0 25px rgba(255,255,255,.12),
        0 6px 25px rgba(0,0,0,.5);

    transform: scale(1.06);
}

.play-btn:active {
    transform: scale(.95);
}

/* =========================
   VOLUME
========================= */

.volume-area {
    position: fixed;

    right: 25px;
    bottom: 34px;

    z-index: 20;

    display: flex;
    align-items: center;
    gap: 8px;
}

/* HOPARLÖR */

.speaker {
    position: relative;

    width: 15px;
    height: 14px;

    opacity: .68;

    flex-shrink: 0;
}

.speaker-body {
    position: absolute;

    left: 0;
    top: 4px;

    width: 5px;
    height: 6px;

    background: #fff;

    border-radius: 1px;
}

.speaker-cone {
    position: absolute;

    left: 4px;
    top: 2px;

    width: 0;
    height: 0;

    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 7px solid #fff;
}

.speaker-wave-1 {
    position: absolute;

    left: 10px;
    top: 4px;

    width: 4px;
    height: 6px;

    border-right: 1px solid rgba(255,255,255,.9);

    border-radius: 0 8px 8px 0;
}

.speaker-wave-2 {
    position: absolute;

    left: 11px;
    top: 2px;

    width: 5px;
    height: 10px;

    border-right: 1px solid rgba(255,255,255,.45);

    border-radius: 0 10px 10px 0;
}

.volume-slider {
    width: 65px;
    height: 2px;

    appearance: none;

    background: rgba(255,255,255,.25);

    outline: none;
}

.volume-slider::-webkit-slider-thumb {
    appearance: none;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}

.volume-slider::-moz-range-thumb {
    width: 7px;
    height: 7px;

    border: 0;
    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .top-left {
        top: 17px;
        left: 17px;
        gap: 7px;
    }

    .clock {
        top: 17px;
        right: 17px;
    }

    .center-stage {
        width: 110px;
        height: 110px;
    }

    .avatar-wrap {
        width: 82px;
        height: 82px;
    }

    .track-info {
        bottom: 95px;
    }

    .video-selector {
        right: 14px;
    }

    .volume-area {
        right: 15px;
        bottom: 17px;
    }

    .controls {
        bottom: 24px;
        gap: 10px;
    }

    .control-btn {
        width: 36px;
        height: 36px;
    }

    .play-btn {
        width: 42px;
        height: 42px;
    }

    .typewriter-text {
        font-size: 18px;
    }

    .cursor {
        height: 19px;
    }
}

@media (max-width: 400px) {

    .avatar-wrap {
        width: 76px;
        height: 76px;
    }

    .track-info {
        bottom: 87px;
    }
}
</style>
</head>

<body>

<!-- =========================
     SPLASH
========================= -->

<div id="splash-screen">

    <div class="intro">

        <span
            class="typewriter-text"
            id="typedText"
        ></span>

        <span
            class="cursor"
            id="typeCursor"
        ></span>

    </div>

    <button
        class="enter-btn"
        id="enterBtn"
    >
        giriş
    </button>

</div>


<!-- =========================
     VIDEO
========================= -->

<div class="video-layer">

    <video
        id="bgVideo"
        loop
        playsinline
        webkit-playsinline
        preload="metadata"
    ></video>

</div>


<!-- =========================
     TOP LEFT
========================= -->

<div class="top-left">

    <div class="status">

        <span class="status-dot"></span>

        <span id="statusText">
            online
        </span>

    </div>

    <span class="top-separator">
        |
    </span>

    <span class="ping">
        <span id="pingValue">--</span>ms
    </span>

</div>


<!-- =========================
     CLOCK
========================= -->

<div
    class="clock"
    id="clock"
>
    00:00:00
</div>


<!-- =========================
     CENTER
========================= -->

<div class="center-stage">

    <div
        class="avatar-wrap"
        id="avatarElement"
    >

        <img
            src="mert.PNG"
            class="avatar"
            alt="forever"
        >

    </div>

</div>


<!-- =========================
     TRACK INFO
========================= -->

<div class="track-info">

    <div
        class="track-title"
        id="trackTitle"
    >
        forever
    </div>

    <div
        class="track-number"
        id="trackNumber"
    >
        01 / 06
    </div>

</div>


<!-- =========================
     VIDEO SELECTOR
========================= -->

<div
    class="video-selector"
    id="videoSelector"
></div>


<!-- =========================
     CONTROLS
========================= -->

<div class="controls">

    <button
        class="control-btn nav-btn"
        id="prevBtn"
        aria-label="Önceki video"
    >
        ‹
    </button>

    <button
        class="control-btn play-btn"
        id="playBtn"
        aria-label="Oynat"
    >
        ▶
    </button>

    <button
        class="control-btn nav-btn"
        id="nextBtn"
        aria-label="Sonraki video"
    >
        ›
    </button>

</div>


<!-- =========================
     VOLUME
========================= -->

<div class="volume-area">

    <div class="speaker">

        <span class="speaker-body"></span>

        <span class="speaker-cone"></span>

        <span class="speaker-wave-1"></span>

        <span class="speaker-wave-2"></span>

    </div>

    <input
        class="volume-slider"
        id="volumeSlider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value=".7"
    >

</div>


<script>

/* =========================================================
   VIDEOS
========================================================= */

const videos = [

    {
        file: "beyaz.mp4",
        name: "beyaz"
    },

    {
        file: "atreides.mp4",
        name: "atreides"
    },

    {
        file: "scream.mp4",
        name: "scream"
    },

    {
        file: "zehir.MP4",
        name: "zehir"
    },

    {
        file: "prime.mp4",
        name: "prime"
    },

    {
        file: "southpaw.MP4",
        name: "southpaw"
    }

];


/* =========================================================
   ELEMENTS
========================================================= */

const splashScreen =
    document.getElementById(
        "splash-screen"
    );

const enterBtn =
    document.getElementById(
        "enterBtn"
    );

const bgVideo =
    document.getElementById(
        "bgVideo"
    );

const playBtn =
    document.getElementById(
        "playBtn"
    );

const prevBtn =
    document.getElementById(
        "prevBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const volumeSlider =
    document.getElementById(
        "volumeSlider"
    );

const trackTitle =
    document.getElementById(
        "trackTitle"
    );

const trackNumber =
    document.getElementById(
        "trackNumber"
    );

const videoSelector =
    document.getElementById(
        "videoSelector"
    );

const avatarElement =
    document.getElementById(
        "avatarElement"
    );

const typedText =
    document.getElementById(
        "typedText"
    );

const pingValue =
    document.getElementById(
        "pingValue"
    );


/* =========================================================
   STATE
========================================================= */

let currentVideo = 0;

let audioContext = null;

let analyser = null;

let sourceNode = null;

let dataArray = null;

let audioStarted = false;

let smoothBass = 0;

let smoothEnergy = 0;


/* =========================================================
   TYPEWRITER
========================================================= */

const introText =
    "hi stalker";

let typeIndex = 0;

function typeWriter() {

    if (
        typeIndex <
        introText.length
    ) {

        typedText.textContent +=
            introText[typeIndex];

        typeIndex++;

        setTimeout(
            typeWriter,
            85
        );

    }

}

typeWriter();


/* =========================================================
   PING
========================================================= */

async function updatePing() {

    const start =
        performance.now();

    try {

        const pingUrl =
            window.location.origin +
            window.location.pathname +
            "?ping=" +
            Date.now();

        await fetch(
            pingUrl,
            {
                method: "HEAD",
                cache: "no-store",
                credentials: "omit"
            }
        );

        const elapsed =
            Math.round(
                performance.now() - start
            );

        const ping =
            Math.max(
                1,
                elapsed
            );

        pingValue.textContent =
            ping;

    } catch (error) {

        pingValue.textContent =
            "--";

    }

}

updatePing();

setInterval(
    updatePing,
    5000
);


/* =========================================================
   VIDEO SELECTOR
========================================================= */

videos.forEach(
    (video, index) => {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "video-btn";

        button.dataset.index =
            index;

        button.title =
            video.name;

        button.addEventListener(
            "click",
            () => {

                loadVideo(index);

                playVideo();

            }
        );

        videoSelector.appendChild(
            button
        );

    }
);


/* =========================================================
   SELECTOR UPDATE
========================================================= */

function updateSelector() {

    const buttons =
        document.querySelectorAll(
            ".video-btn"
        );

    buttons.forEach(
        (button, index) => {

            button.classList.toggle(
                "active",
                index === currentVideo
            );

        }
    );

}


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(index) {

    if (index < 0) {

        index =
            videos.length - 1;

    }

    if (
        index >=
        videos.length
    ) {

        index = 0;

    }

    currentVideo = index;

    bgVideo.src =
        videos[currentVideo].file;

    bgVideo.load();

    trackTitle.textContent =
        videos[currentVideo].name;

    trackNumber.textContent =
        String(
            currentVideo + 1
        ).padStart(2, "0")
        +
        " / "
        +
        String(
            videos.length
        ).padStart(2, "0");

    updateSelector();

}


/* =========================================================
   AUDIO SETUP
========================================================= */

function setupAudio() {

    if (audioStarted) {
        return;
    }

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize =
            512;

        analyser.smoothingTimeConstant =
            0.08;

        analyser.minDecibels =
            -90;

        analyser.maxDecibels =
            -3;

        sourceNode =
            audioContext.createMediaElementSource(
                bgVideo
            );

        sourceNode.connect(
            analyser
        );

        analyser.connect(
            audioContext.destination
        );

        dataArray =
            new Uint8Array(
                analyser.frequencyBinCount
            );

        audioStarted = true;

    } catch (error) {

        console.error(
            "Audio setup error:",
            error
        );

    }

}


/* =========================================================
   PLAY
========================================================= */

async function playVideo() {

    setupAudio();

    try {

        if (
            audioContext &&
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }

        await bgVideo.play();

        playBtn.textContent =
            "Ⅱ";

    } catch (error) {

        console.error(
            "Play error:",
            error
        );

    }

}


/* =========================================================
   PAUSE
========================================================= */

function pauseVideo() {

    bgVideo.pause();

    playBtn.textContent =
        "▶";

}


/* =========================================================
   ENTER
========================================================= */

enterBtn.addEventListener(
    "click",
    async () => {

        splashScreen.classList.add(
            "hide"
        );

        await playVideo();

    }
);


/* =========================================================
   PLAY BUTTON
========================================================= */

playBtn.addEventListener(
    "click",
    async () => {

        if (bgVideo.paused) {

            await playVideo();

        } else {

            pauseVideo();

        }

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

prevBtn.addEventListener(
    "click",
    async () => {

        loadVideo(
            currentVideo - 1
        );

        await playVideo();

    }
);


/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener(
    "click",
    async () => {

        loadVideo(
            currentVideo + 1
        );

        await playVideo();

    }
);


/* =========================================================
   VIDEO ENDED
========================================================= */

bgVideo.addEventListener(
    "ended",
    () => {

        loadVideo(
            currentVideo + 1
        );

        playVideo();

    }
);


/* =========================================================
   VOLUME
========================================================= */

bgVideo.volume =
    0.7;

volumeSlider.value =
    0.7;

volumeSlider.addEventListener(
    "input",
    () => {

        bgVideo.volume =
            Number(
                volumeSlider.value
            );

    }
);


/* =========================================================
   AVATAR AUDIO REACTIVE
========================================================= */

function animateAudio() {

    requestAnimationFrame(
        animateAudio
    );

    if (
        !analyser ||
        !dataArray
    ) {

        return;

    }

    analyser.getByteFrequencyData(
        dataArray
    );


    /* BASS */

    let bass = 0;

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        bass +=
            dataArray[i];

    }

    bass /= 12;


    const bassTarget =
        Math.min(
            1,
            Math.pow(
                bass / 105,
                .72
            )
        );


    if (
        bassTarget >
        smoothBass
    ) {

        smoothBass +=
            (
                bassTarget -
                smoothBass
            ) * .72;

    } else {

        smoothBass +=
            (
                bassTarget -
                smoothBass
            ) * .16;

    }


    /* ENERGY */

    let energy = 0;

    for (
        let i = 0;
        i < 80;
        i++
    ) {

        energy +=
            dataArray[i];

    }

    energy /= 80;


    const energyTarget =
        Math.min(
            1,
            energy / 145
        );


    smoothEnergy +=
        (
            energyTarget -
            smoothEnergy
        ) * .22;


    /* AVATAR SCALE */

    const avatarScale =
        1 +
        smoothBass * .105 +
        smoothEnergy * .018;


    avatarElement.style.transform =
        `
        translate(-50%, -50%)
        scale(${avatarScale})
        `;


    /* GLOW */

    const innerGlow =
        15 +
        smoothBass * 45;


    avatarElement.style.boxShadow =
        `
        0 0 0 1px
        rgba(255,255,255,.14),

        0 0 ${innerGlow}px
        rgba(
            255,
            255,
            255,
            ${.10 + smoothBass * .25}
        ),

        0 0 80px
        rgba(0,0,0,.95)
        `;

}

animateAudio();


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();

    const hours =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );

    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );

    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );

    document.getElementById(
        "clock"
    ).textContent =
        `${hours}:${minutes}:${seconds}`;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   INITIAL VIDEO
========================================================= */

loadVideo(0);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    async (event) => {

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            if (bgVideo.paused) {

                await playVideo();

            } else {

                pauseVideo();

            }

        }


        if (
            event.code ===
            "ArrowRight"
        ) {

            loadVideo(
                currentVideo + 1
            );

            await playVideo();

        }


        if (
            event.code ===
            "ArrowLeft"
        ) {

            loadVideo(
                currentVideo - 1
            );

            await playVideo();

        }

    }
);

</script>
