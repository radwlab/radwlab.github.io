<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>radw</title>
    <link rel="icon" type="image/jpeg" href="radw.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            
            /* Glassmorphism değişkenleri */
            --glass-bg: rgba(20, 20, 25, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 10px 30px rgba(0,0,0,0.3);
            --hover-scale: scale(1.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100dvh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- Splash Screen --- */
        #splash-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100dvh;
            background: #000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 25px; z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }

        #splash-screen.fade-out {
            opacity: 0; visibility: hidden; pointer-events: none;
        }

        .splash-text {
            font-size: clamp(3.5rem, 9vw, 7rem); font-weight: 700; letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #717175 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            min-height: 1.1em; display: flex; align-items: center;
        }

        .cursor-blink {
            display: inline-block; width: 3px; height: 0.8em;
            background-color: #ffffff; margin-left: 6px;
            vertical-align: middle; animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; } 50% { opacity: 0; }
        }

        /* --- Giriş Butonu (Tüm butonlara uygulanan animasyonlar burada) --- */
        .enter-btn {
            /* Şeffaf ve Siyah, hafif beyaz görünümlü */
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 28px; border-radius: 16px;
            font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em;
            cursor: pointer;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--glass-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); /* Yumuşak geçiş */
            opacity: 0; animation: fadeInBtn 0.8s forwards 1.2s;
        }

        .enter-btn:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(35, 35, 45, 0.6); /* Hoverda daha belirgin beyazımsı */
            transform: var(--hover-scale); /* Büyüme animasyonu */
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .enter-btn:active { transform: scale(0.98); }

        @keyframes fadeInBtn { to { opacity: 1; } }

        /* --- Ana Navigasyon Menüsü --- */
        nav {
            position: fixed; top: 0; left: 0; width: 100%;
            /* Üst kısım şeffaf */
            background: rgba(3, 3, 5, 0.3);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
            padding: 0 16px; padding-top: env(safe-area-inset-top);
            height: calc(52px + env(safe-area-inset-top));
        }

        .nav-group { display: flex; align-items: center; gap: 8px; }
        .nav-group.right { justify-content: flex-end; }

        /* --- Navigasyon Butonları (Şeffaf ve Animasyonlu) --- */
        .nav-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 6px 12px; border-radius: 10px;
            font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em;
            cursor: pointer;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.15); /* Hafif beyazımsı vurgu */
            border-color: rgba(255, 255, 255, 0.3);
            transform: var(--hover-scale); /* Büyüme animasyonu */
        }

        .nav-logo {
            color: var(--text-primary); font-weight: 700; font-size: 0.9rem;
            letter-spacing: 0.1em; text-decoration: none;
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        .system-info { display: none; }

        @media (min-width: 480px) {
            .system-info {
                display: flex; align-items: center; gap: 6px;
                font-size: 0.7rem; font-weight: 500; color: var(--text-secondary);
            }
            .system-info .clock-val { color: var(--text-primary); font-variant-numeric: tabular-nums; }
            .ping-val { color: #32d74b; font-variant-numeric: tabular-nums; }
        }

        /* --- Arka Plan Videosu --- */
        .bg-video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100dvh; z-index: 1;
            background: #000;
        }

        .bg-video-container video {
            width: 100%; height: 100%;
            object-fit: cover; transform: translateZ(0);
            filter: brightness(1.05) contrast(1.02);
        }

        .video-vignette {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }

        .content-layer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100dvh; z-index: 5;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            pointer-events: none; gap: 16px; text-align: center;
        }

        .main-avatar {
            width: 120px; height: 120px; border-radius: 50%;
            object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7), 0 0 25px rgba(0,0,0,0.5);
        }

        .main-subtitle {
            font-size: 1rem; font-weight: 400; font-style: italic;
            color: rgba(255, 255, 255, 0.9); letter-spacing: 0.08em;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
        }

        /* --- Paneller (Şeffaf, Siyah, Hafif Beyaz, Bulanık Cam) --- */
        .overlay-menu {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100dvh;
            /* Arka plan daha koyu şeffaf */
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
            opacity: 0; visibility: hidden;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
        }

        .overlay-menu.open { opacity: 1; visibility: visible; }

        .menu-card {
            /* Panel şeffaf ve siyah, hafif beyaz görünümlü */
            background: rgba(15, 15, 20, 0.6);
            border: 1px solid var(--glass-border);
            padding: 24px; border-radius: 22px;
            width: 85%; max-width: 320px;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            transform: translateY(20px) scale(0.97);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .overlay-menu.open .menu-card { transform: translateY(0) scale(1); }

        .menu-header {
            font-size: 0.75rem; font-weight: 600;
            color: var(--text-secondary); letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .menu-list {
            display: flex; flex-direction: column;
            gap: 8px; max-height: 240px; overflow-y: auto;
        }

        /* --- Panel İçi Butonlar (Video Linkleri ve Sosyal Butonlar) --- */
        .menu-item {
            /* Şeffaf ve siyah, hafif beyaz görünümlü */
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px; border-radius: 12px;
            color: var(--text-primary);
            text-align: left; font-size: 0.9rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center;
            gap: 12px; text-decoration: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.15); /* Hoverda daha belirgin beyazımsı */
            border-color: rgba(255, 255, 255, 0.3);
            transform: var(--hover-scale); /* Büyüme animasyonu */
        }

        .menu-item svg {
            width: 18px; height: 18px; fill: currentColor; flex-shrink: 0;
        }

        /* --- Kapat Butonları --- */
        .close-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            font-size: 0.8rem; font-weight: 600;
            padding: 10px; border-radius: 12px;
            cursor: pointer; margin-top: 5px; text-align: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
            transform: var(--hover-scale); /* Büyüme animasyonu */
        }

        /* --- Audio Dock (Ses Ayarı) --- */
        .audio-dock {
            position: fixed; bottom: 20px; right: 20px;
            z-index: 100;
            /* Şeffaf ve siyah, hafif beyaz görünümlü */
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 10px 14px; border-radius: 20px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: var(--glass-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Ses ayarı üzerine gelince büyüsün
