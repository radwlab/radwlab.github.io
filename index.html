<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="mertbest.png">
<link rel="apple-touch-icon" href="mertbest.png">
<title>forever</title>
<style>
:root {
    --black: #000;
    --white: #fff;
    --muted: rgba(255,255,255,.48);
    --glass: rgba(8,8,10,.58);
    --border: rgba(255,255,255,.09);
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scrollbar-width: none;
    -webkit-tap-highlight-color: transparent;
}
*::-webkit-scrollbar {
    display: none;
}
html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    -webkit-font-smoothing: antialiased;
}
/* =========================
   SPLASH
========================= */
#splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 25px;
    background: #000;
    transition:
        opacity .65s ease,
        visibility .65s ease;
}
#splash-screen.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
.intro {
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 25px;
}
.typewriter-text {
    font-family: monospace;
    font-size: 14px;
    letter-spacing: .16em;
    color: rgba(255,255,255,.9);
}
.cursor {
    width: 7px;
    height: 15px;
    background: #fff;
    animation: blink .75s infinite;
}
@keyframes blink {
    0%,45% {
        opacity: 1;
    }
    50%,100% {
        opacity: 0;
    }
}
.enter-btn {
    appearance: none;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.035);
    color: #fff;
    border-radius: 12px;
    padding: 11px 26px;
    font-size: 12px;
    letter-spacing: .13em;
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition:
        opacity .5s ease,
        transform .5s ease,
        background .2s ease,
        border-color .2s ease;
}
.enter-btn.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}
.enter-btn:hover {
    background: rgba(255,255,255,.08);
    border-color: rgba(255,255,255,.25);
}
/* =========================
   VIDEO
========================= */
.video-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: #000;
}
.video-layer::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.32) 0%,
            transparent 30%,
            transparent 65%,
            rgba(0,0,0,.5) 100%
        );
    pointer-events: none;
}
#bgVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.01);
}
/* =========================
   STATUS
========================= */
.status {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 8px 12px;
    border:
        1px solid
        var(--border);
    border-radius: 11px;
    background:
        var(--glass);
    backdrop-filter:
        blur(18px);
    -webkit-backdrop-filter:
        blur(18px);
    box-shadow:
        0 15px 45px
        rgba(0,0,0,.3);
    font-size: 10px;
    letter-spacing: .08em;
}
.online {
    display: flex;
    align-items: center;
    gap: 6px;
    color:
        rgba(255,255,255,.72);
}
.online-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff;
    box-shadow:
        0 0 10px
        rgba(255,255,255,.9);
}
.separator {
    width: 1px;
    height: 11px;
    background:
        rgba(255,255,255,.13);
}
#clockText {
    color:
        rgba(255,255,255,.7);
    font-variant-numeric:
        tabular-nums;
}
/* =========================
   CENTER
========================= */
.center-stage {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 20;
    width: 260px;
    height: 260px;
    transform:
        translate(-50%, -50%);
    pointer-events: none;
}
/* =========================
   AUDIO SPECTRUM
========================= */
.audio-spectrum {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 210px;
    height: 210px;
    transform:
        translate(-50%, -50%);
    border-radius: 50%;
    overflow: visible;
    filter:
        drop-shadow(
            0 0 5px
            rgba(255,255,255,.35)
        );
    will-change:
        transform;
}
/*
    Her bar farklı bir frekansı temsil ediyor.
*/
.audio-bar {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 10px;
    border-radius: 10px;
    background:
        rgba(255,255,255,.9);
    transform-origin:
        50% 100%;
    opacity: .75;
    will-change:
        transform,
        opacity;
}
/* =========================
   AVATAR
========================= */
.avatar-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 94px;
    height: 94px;
    transform:
        translate(-50%, -50%);
    border-radius: 50%;
    padding: 2px;
    background:
        rgba(255,255,255,.13);
    box-shadow:
        0 0 0 1px
        rgba(255,255,255,.08),
        0 0 25px
        rgba(0,0,0,.95);
    z-index: 10;
}
.avatar {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
}
/* =========================
   AUDIO GLOW
========================= */
.audio-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80px;
    height: 80px;
    transform:
        translate(-50%, -50%);
    border-radius: 50%;
    background: #fff;
    filter:
        blur(32px);
    opacity: .04;
    z-index: 1;
    will-change:
        transform,
        opacity;
}
/* =========================
   TRACK
========================= */
.track-info {
    position: fixed;
    left: 50%;
    bottom: 105px;
    z-index: 100;
    transform:
        translateX(-50%);
    width: max-content;
    max-width: 70vw;
    text-align: center;
    pointer-events: none;
}
.track-small {
    font-size: 8px;
    letter-spacing: .22em;
    color:
        rgba(255,255,255,.35);
    text-transform:
        uppercase;
    margin-bottom: 7px;
}
#marqueeText {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .13em;
    text-transform:
        lowercase;
    color:
        rgba(255,255,255,.85);
}
/* =========================
   BOTTOM BAR
========================= */
.bottom-bar {
    position: fixed;
    left: 50%;
    bottom: 25px;
    z-index: 100;
    transform:
        translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px;
    border:
        1px solid
        var(--border);
    border-radius: 14px;
    background:
        var(--glass);
    backdrop-filter:
        blur(20px);
    -webkit-backdrop-filter:
        blur(20px);
    box-shadow:
        0 15px 50px
        rgba(0,0,0,.45);
}
.control {
    width: 34px;
    height: 32px;
    border:
        1px solid
        rgba(255,255,255,.045);
    border-radius: 9px;
    background:
        rgba(255,255,255,.025);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
}
.control:hover {
    background:
        rgba(255,255,255,.08);
    border-color:
        rgba(255,255,255,.14);
}
.control:active {
    transform:
        scale(.92);
}
.control svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
}
/* =========================
   SELECTOR
========================= */
.selector {
    position: fixed;
    left: 24px;
    bottom: 25px;
    z-index: 100;
}
.selector-button {
    height: 46px;
    min-width: 120px;
    padding: 0 13px;
    display: flex;
    align-items: center;
    gap: 9px;
    border:
        1px solid
        var(--border);
    border-radius: 12px;
    background:
        var(--glass);
    color: #fff;
    backdrop-filter:
        blur(20px);
    -webkit-backdrop-filter:
        blur(20px);
    cursor: pointer;
    transition: .2s ease;
}
.selector-button:hover {
    background:
        rgba(20,20,22,.75);
    border-color:
        rgba(255,255,255,.18);
}
.selector-icon {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
    box-shadow:
        0 0 10px
        rgba(255,255,255,.6);
    flex-shrink: 0;
}
.selector-name {
    font-size: 10px;
    letter-spacing: .08em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.selector-arrow {
    margin-left: auto;
    width: 9px;
    height: 9px;
    border-right:
        1px solid
        rgba(255,255,255,.6);
    border-bottom:
        1px solid
        rgba(255,255,255,.6);
    transform:
        rotate(45deg)
        translateY(-2px);
}
.video-menu {
    position: absolute;
    left: 0;
    bottom: 55px;
    width: 190px;
    padding: 7px;
    border:
        1px solid
        var(--border);
    border-radius: 13px;
    background:
        rgba(5,5,7,.9);
    backdrop-filter:
        blur(25px);
    -webkit-backdrop-filter:
        blur(25px);
    box-shadow:
        0 20px 60px
        rgba(0,0,0,.65);
    opacity: 0;
    visibility: hidden;
    transform:
        translateY(8px)
        scale(.97);
    transform-origin:
        bottom left;
    transition: .2s ease;
}
.video-menu.open {
    opacity: 1;
    visibility: visible;
    transform:
        translateY(0)
        scale(1);
}
.video-item {
    width: 100%;
    padding: 9px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color:
        rgba(255,255,255,.62);
    font-size: 10px;
    text-align: left;
    cursor: pointer;
    transition: .15s ease;
}
.video-item:hover {
    color: #fff;
    background:
        rgba(255,255,255,.055);
}
.video-item.active {
    color: #fff;
    background:
        rgba(255,255,255,.085);
}
.item-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background:
        currentColor;
    opacity: .5;
}
/* =========================
   VOLUME
========================= */
.volume {
    position: fixed;
    right: 24px;
    bottom: 25px;
    z-index: 100;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
    border:
        1px solid
        var(--border);
    border-radius: 12px;
    background:
        var(--glass);
    backdrop-filter:
        blur(20px);
    -webkit-backdrop-filter:
        blur(20px);
}
.volume-button {
    width: 17px;
    height: 17px;
    border: 0;
    background: transparent;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .7;
}
.volume-button:hover {
    opacity: 1;
}
.volume-button svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
}
.slider {
    width: 65px;
    height: 3px;
    appearance: none;
    -webkit-appearance: none;
    background:
        rgba(255,255,255,.12);
    border-radius: 10px;
    outline: none;
}
.slider::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
}
.slider::-moz-range-thumb {
    width: 9px;
    height: 9px;
    border: 0;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
}
/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {
    .status {
        top: 14px;
        left: 14px;
    }
    .center-stage {
        width: 230px;
        height: 230px;
    }
    .audio-spectrum {
        width: 185px;
        height: 185px;
    }
    .avatar-wrap {
        width: 82px;
        height: 82px;
    }
    .track-info {
        bottom: 105px;
    }
    .selector {
        left: 14px;
        bottom: 18px;
    }
    .volume {
        right: 14px;
        bottom: 18px;
    }
    .bottom-bar {
        bottom: 18px;
    }
    .selector-button {
        min-width: 95px;
        height: 42px;
    }
    .volume {
        height: 42px;
    }
    .slider {
        width: 42px;
    }
    .control {
        width: 32px;
        height: 30px;
    }
}
@media (max-width: 470px) {
    .track-info {
        bottom: 88px;
    }
    .center-stage {
        width: 210px;
        height: 210px;
    }
    .audio-spectrum {
        width: 170px;
        height: 170px;
    }
    .avatar-wrap {
        width: 76px;
        height: 76px;
    }
    .selector-button {
        min-width: 42px;
        width: 42px;
        padding: 0;
        justify-content: center;
    }
    .selector-name,
    .selector-arrow {
        display: none;
    }
    .volume {
        padding: 0 9px;
    }
    .slider {
        display: none;
    }
}
</style>
</head>
<body>
<!-- =========================
     SPLASH
========================= -->
<div id="splash-screen">
    <div class="intro">
        <span
            class="typewriter-text"
            id="typedText">
        </span>
        <span
            class="cursor"
            id="typeCursor">
        </span>
    </div>
    <button
        class="enter-btn"
        id="enterBtn">
        giriş
    </button>
</div>
<!-- =========================
     VIDEO
========================= -->
<div class="video-layer">
    <video
        id="bgVideo"
        loop
        playsinline
        webkit-playsinline
        preload="metadata">
    </video>
</div>
<!-- =========================
     STATUS
========================= -->
<div class="status">
    <div class="online">
        <span class="online-dot"></span>
        <span id="pingText">
            -- ms
        </span>
    </div>
    <div class="separator"></div>
    <div id="clockText">
        00:00:00
    </div>
</div>
<!-- =========================
     CENTER
========================= -->
<div class="center-stage">
    <div
        class="audio-glow"
        id="audioGlow">
    </div>
    <!--
        NCS STYLE AUDIO RING
        JS burada barları oluşturacak.
    -->
    <div
        class="audio-spectrum"
        id="audioSpectrum">
    </div>
    <div
        class="avatar-wrap"
        id="avatarElement">
        <img
            src="mert.PNG"
            class="avatar"
            alt="forever">
    </div>
</div>
<!-- =========================
     TRACK
========================= -->
<div class="track-info">
    <div class="track-small">
        now playing
    </div>
    <div id="marqueeText">
        beyaz
    </div>
</div>
<!-- =========================
     SELECTOR
========================= -->
<div
    class="selector"
    id="selector">
    <div
        class="video-menu"
        id="videoPopupList">
    </div>
    <button
        class="selector-button"
        id="marqueeBtn">
        <span class="selector-icon"></span>
        <span
            class="selector-name"
            id="selectorName">
            beyaz
        </span>
        <span class="selector-arrow"></span>
    </button>
</div>
<!-- =========================
     CONTROLS
========================= -->
<div class="bottom-bar">
    <button
        class="control"
        id="prevVideoBtn">
        <svg viewBox="0 0 24 24">
            <path d="
                M6 6h2v12H6zm3.5 6l8.5 6V6z
            "/>
        </svg>
    </button>
    <button
        class="control"
        id="playPauseBtn">
        <svg
            id="playPauseIcon"
            viewBox="0 0 24 24">
            <path d="
                M6 19h4V5H6v14zm8-14v14h4V5h-4z
            "/>
        </svg>
    </button>
    <button
        class="control"
        id="nextVideoBtn">
        <svg viewBox="0 0 24 24">
            <path d="
                M6 18l8.5-6L6 6v12z
                M16 6v12h2V6h-2z
            "/>
        </svg>
    </button>
</div>
<!-- =========================
     VOLUME
========================= -->
<div class="volume">
    <button
        class="volume-button"
        id="muteToggleBtn">
        <svg
            id="volumeIcon"
            viewBox="0 0 24 24">
            <path d="
                M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508
                c-1.141 0-2.068.926-2.068 2.068v6.864
                c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5
                c.944.945 2.56.276 2.56-1.06V4.06z
                M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05
                c1.48-.74 2.5-2.26 2.5-4.02z
            "/>
        </svg>
    </button>
    <input
        type="range"
        class="slider"
        id="volumeSlider"
        min="0"
        max="1"
        step="0.01"
        value="0.5">
</div>
<script>
/* =====================================================
   VİDEOLAR
===================================================== */
const videoList = [
    {
        name: "beyaz",
        file: "beyaz.mp4"
    },
    {
        name: "atreides",
        file: "atreides.mp4"
    },
    {
        name: "scream",
        file: "scream.mp4"
    },
    {
        name: "zehir",
        file: "zehir.MP4"
    },
    {
        name: "prime",
        file: "prime.mp4"
    },
    {
        name: "southpaw",
        file: "southpaw.MP4"
    }
];
/* =====================================================
   ELEMENTLER
===================================================== */
const bgVideo =
    document.getElementById("bgVideo");
const splashScreen =
    document.getElementById("splash-screen");
const enterBtn =
    document.getElementById("enterBtn");
const typedText =
    document.getElementById("typedText");
const typeCursor =
    document.getElementById("typeCursor");
const marqueeText =
    document.getElementById("marqueeText");
const selectorName =
    document.getElementById("selectorName");
const clockText =
    document.getElementById("clockText");
const pingText =
    document.getElementById("pingText");
const avatarElement =
    document.getElementById("avatarElement");
const audioGlow =
    document.getElementById("audioGlow");
const audioSpectrum =
    document.getElementById("audioSpectrum");
const videoPopupList =
    document.getElementById("videoPopupList");
const marqueeBtn =
    document.getElementById("marqueeBtn");
const prevVideoBtn =
    document.getElementById("prevVideoBtn");
const nextVideoBtn =
    document.getElementById("nextVideoBtn");
const playPauseBtn =
    document.getElementById("playPauseBtn");
const playPauseIcon =
    document.getElementById("playPauseIcon");
const volumeSlider =
    document.getElementById("volumeSlider");
const muteToggleBtn =
    document.getElementById("muteToggleBtn");
const volumeIcon =
    document.getElementById("volumeIcon");
/* =====================================================
   DEĞİŞKENLER
===================================================== */
let currentVideoIndex = 0;
let hasInteracted = false;
let audioCtx = null;
let analyser = null;
let audioSource = null;
let dataArray = null;
let audioInitialized = false;
let lastVolume = .5;
/* =====================================================
   AUDIO BARLARINI OLUŞTUR
===================================================== */
const BAR_COUNT = 64;
const bars = [];
for (
    let i = 0;
    i < BAR_COUNT;
    i++
) {
    const bar =
        document.createElement("div");
    bar.className =
        "audio-bar";
    /*
        Halkanın çevresine eşit dağıt.
    */
    const angle =
        (
            i /
            BAR_COUNT
        ) *
        360;
    bar.dataset.angle =
        angle;
    audioSpectrum.appendChild(
        bar
    );
    bars.push(
        bar
    );
}
/* =====================================================
   AUDIO INIT
===================================================== */
function initAudio() {
    if (audioInitialized) {
        return;
    }
    try {
        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;
        if (!AudioContext) {
            return;
        }
        audioCtx =
            new AudioContext();
        analyser =
            audioCtx.createAnalyser();
        /*
            256 FFT:
            hem bass hem mid daha belirgin.
        */
        analyser.fftSize =
            256;
        /*
            Çok düşük smoothing.
            Bass vurduğunda barlar
            gecikmeden tepki verir.
        */
        analyser.smoothingTimeConstant =
            .12;
        analyser.minDecibels =
            -90;
        analyser.maxDecibels =
            -5;
        audioSource =
            audioCtx.createMediaElementSource(
                bgVideo
            );
        audioSource.connect(
            analyser
        );
        analyser.connect(
            audioCtx.destination
        );
        dataArray =
            new Uint8Array(
                analyser.frequencyBinCount
            );
        audioInitialized =
            true;
    } catch (error) {
        console.log(
            "Audio error:",
            error
        );
    }
}
/* =====================================================
   AUDIO VISUALIZER
===================================================== */
function animateAudio() {
    requestAnimationFrame(
        animateAudio
    );
    if (
        !audioInitialized ||
        !analyser ||
        !dataArray
    ) {
        return;
    }
    analyser.getByteFrequencyData(
        dataArray
    );
    /*
        Her bar için farklı frekans.
    */
    const binCount =
        dataArray.length;
    let totalBass = 0;
    /*
        Bass ölçümü.
    */
    for (
        let i = 0;
        i < 10;
        i++
    ) {
        totalBass +=
            dataArray[i];
    }
    totalBass /=
        10;
    /*
        Bass'ı daha agresif hale getir.
    */
    const bassPower =
        Math.min(
            1,
            Math.pow(
                totalBass / 105,
                .82
            )
        );
    /*
        Bass geldiğinde halkanın
        genel çapı da büyüsün.
    */
    const baseRadius =
        58 +
        bassPower * 16;
    audioSpectrum.style.transform =
        `
        translate(-50%, -50%)
        scale(${1 + bassPower * .12})
        `;
    /*
        Glow.
    */
    audioGlow.style.transform =
        `
        translate(-50%, -50%)
        scale(${1 + bassPower * 3})
        `;
    audioGlow.style.opacity =
        .025 +
        bassPower * .35;
    /*
        Her bar.
    */
    for (
        let i = 0;
        i < BAR_COUNT;
        i++
    ) {
        /*
            0 -> 1 arası.
        */
        const normalized =
            i / BAR_COUNT;
        /*
            Frequency mapping.
            Düşük frekansları daha fazla
            merkeze yaklaştır.
        */
        const frequencyPosition =
            Math.floor(
                Math.pow(
                    normalized,
                    1.65
                ) *
                (
                    binCount - 1
                )
            );
        let value =
            dataArray[
                frequencyPosition
            ] / 255;
        /*
            Bass tarafındaki barlar
            daha güçlü.
        */
        const bassBoost =
            normalized < .25
                ? bassPower * .85
                : bassPower * .25;
        value =
            Math.min(
                1,
                value * 1.25 +
                bassBoost
            );
        /*
            Minimum hareket.
            Sessizken bile ince bir halka.
        */
        const height =
            5 +
            value * 36;
        const angle =
            parseFloat(
                bars[i].dataset.angle
            );
        const x =
            50 +
            Math.cos(
                angle *
                Math.PI /
                180
            ) * 50;
        const y =
            50 +
            Math.sin(
                angle *
                Math.PI /
                180
            ) * 50;
        /*
            Barın başlangıç noktası
            halkanın üzerinde.
        */
        bars[i].style.left =
            `${x}%`;
        bars[i].style.top =
            `${y}%`;
        bars[i].style.height =
            `${height}px`;
        /*
            Açısına göre dışarı bak.
        */
        bars[i].style.transform =
            `
            translate(-50%, -100%)
            rotate(${angle + 90}deg)
            `;
        /*
            Ses yükseldikçe parlaklık.
        */
        bars[i].style.opacity =
            .32 +
            value * .68;
        /*
            Bass vurduğunda
            hafif glow.
        */
        bars[i].style.boxShadow =
            `
            0 0 ${
                2 +
                value * 9
            }px
            rgba(
                255,
                255,
                255,
                ${
                    .08 +
                    value * .35
                }
            )
            `;
    }
}

/* =====================================================
   CLOCK
===================================================== */
function updateClock() {
    const now =
        new Date();
    const h =
        String(
            now.getHours()
        ).padStart(2, "0");
    const m =
        String(
            now.getMinutes()
        ).padStart(2, "0");
    const s =
        String(
            now.getSeconds()
        ).padStart(2, "0");
    clockText.textContent =
        `${h}:${m}:${s}`;
}
updateClock();
setInterval(
    updateClock,
    1000
);
/* =====================================================
   PING
===================================================== */
async function measurePing() {
    const start =
        performance.now();
    try {
        await fetch(
            window.location.href,
            {
                method: "HEAD",
                cache: "no-store"
            }
        );
        const ms =
            Math.round(
                performance.now() -
                start
            );
        pingText.textContent =
            `${ms} ms`;
    } catch {
        pingText.textContent =
            "-- ms";
    }
}
measurePing();
setInterval(
    measurePing,
    10000
);
/* =====================================================
   TYPEWRITER
===================================================== */
const greeting =
    "hi stalker";
let charIndex = 0;
function typeWriter() {
    if (
        charIndex <
        greeting.length
    ) {
        typedText.textContent +=
            greeting.charAt(
                charIndex
            );
        charIndex++;
        setTimeout(
            typeWriter,
            90
        );
    } else {
        typeCursor.style.display =
            "none";
        enterBtn.classList.add(
            "show"
        );
    }
}
/* =====================================================
   DOM READY
===================================================== */
window.addEventListener(
    "DOMContentLoaded",
    () => {
        updateVideoListUI();
        setTimeout(
            typeWriter,
            300
        );
    }
);
/* =====================================================
   VIDEO LOAD
===================================================== */
function loadVideo(index) {
    currentVideoIndex =
        (
            index +
            videoList.length
        ) %
        videoList.length;
    const video =
        videoList[
            currentVideoIndex
        ];
    bgVideo.src =
        video.file;
    bgVideo.load();
    bgVideo.play()
        .then(() => {
            updatePlayPauseIcon(
                true
            );
        })
        .catch(() => {});
    marqueeText.textContent =
        video.name;
    selectorName.textContent =
        video.name;
    updateVideoListUI();
}
/* =====================================================
   VIDEO LIST
===================================================== */
function updateVideoListUI() {
    videoPopupList.innerHTML =
        "";
    videoList.forEach(
        (video, index) => {
            const item =
                document.createElement(
                    "button"
                );
            item.className =
                "video-item" +
                (
                    index ===
                    currentVideoIndex
                        ? " active"
                        : ""
                );
            item.innerHTML =
                `
                <span class="item-dot"></span>
                <span>${video.name}</span>
                `;
            item.addEventListener(
                "click",
                event => {
                    event.stopPropagation();
                    loadVideo(
                        index
                    );
                    closeMenu();
                }
            );
            videoPopupList.appendChild(
                item
            );
        }
    );
}
function closeMenu() {
    videoPopupList.classList.remove(
        "open"
    );
}
marqueeBtn.addEventListener(
    "click",
    event => {
        event.stopPropagation();
        videoPopupList.classList.toggle(
            "open"
        );
    }
);
document.addEventListener(
    "click",
    event => {
        if (
            !document
                .getElementById("selector")
                .contains(
                    event.target
                )
        ) {
            closeMenu();
        }
    }
);
/* =====================================================
   PLAY / PAUSE
===================================================== */
function updatePlayPauseIcon(
    playing
) {
    if (playing) {
        playPauseIcon.innerHTML =
            `
            <path d="
            M6 19h4V5H6v14zm8-14v14h4V5h-4z
            "/>
            `;
    } else {
        playPauseIcon.innerHTML =
            `
            <path d="
            M8 5v14l11-7z
            "/>
            `;
    }
}
playPauseBtn.addEventListener(
    "click",
    () => {
        if (
            bgVideo.paused
        ) {
            bgVideo.play()
                .then(() => {
                    updatePlayPauseIcon(
                        true
                    );
                })
                .catch(() => {});
        } else {
            bgVideo.pause();
            updatePlayPauseIcon(
                false
            );
        }
    }
);
/* =====================================================
   PREVIOUS
===================================================== */
prevVideoBtn.addEventListener(
    "click",
    () => {
        loadVideo(
            currentVideoIndex - 1
        );
        closeMenu();
    }
);
/* =====================================================
   NEXT
===================================================== */
nextVideoBtn.addEventListener(
    "click",
    () => {
        loadVideo(
            currentVideoIndex + 1
        );
        closeMenu();
    }
);
/* =====================================================
   SITE START
===================================================== */
function startSite() {
    if (hasInteracted) {
        return;
    }
    hasInteracted = true;
    splashScreen.classList.add(
        "fade-out"
    );
    initAudio();
    if (
        audioCtx &&
        audioCtx.state === "suspended"
    ) {
        audioCtx.resume();
    }
    const volume =
        parseFloat(
            volumeSlider.value
        );
    bgVideo.volume =
        volume;
    bgVideo.muted =
        false;
    loadVideo(0);
    bgVideo.play()
        .then(() => {
            updatePlayPauseIcon(
                true
            );
        })
        .catch(() => {
            bgVideo.muted =
                true;
            bgVideo.play();
            updatePlayPauseIcon(
                true
            );
        });
}
enterBtn.addEventListener(
    "click",
    startSite
);
/* =====================================================
   VOLUME
===================================================== */
volumeSlider.addEventListener(
    "input",
    event => {
        const value =
            parseFloat(
                event.target.value
            );
        bgVideo.volume =
            value;
        bgVideo.muted =
            value === 0;
        if (value > 0) {
            lastVolume =
                value;
        }
        updateVolumeIcon(
            value
        );
    }
);
/* =====================================================
   MUTE
===================================================== */
muteToggleBtn.addEventListener(
    "click",
    () => {
        if (
            bgVideo.muted ||
            bgVideo.volume === 0
        ) {
            const value =
                lastVolume > 0
                    ? lastVolume
                    : .5;
            bgVideo.muted =
                false;
            bgVideo.volume =
                value;
            volumeSlider.value =
                value;
            updateVolumeIcon(
                value
            );
        } else {
            lastVolume =
                bgVideo.volume;
            bgVideo.muted =
                true;
            bgVideo.volume =
                0;
            volumeSlider.value =
                0;
            updateVolumeIcon(
                0
            );
        }
    }
);
/* =====================================================
   VOLUME ICON
===================================================== */
