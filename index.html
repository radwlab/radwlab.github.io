<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radwlab :: Interactive</title>
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/736x/34/cf/0c/34cf0c84b585182ccb109492e2564058.jpg">
    <style>
        :root {
            --term-color: #ffffff;
            --card-border: 1px solid rgba(255, 255, 255, 0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
            overflow: hidden;
            background: #000000;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .entry-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .entry-text {
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .top-center-title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #ffffff;
            animation: smallSlide 4s ease-in-out infinite alternate;
            pointer-events: none;
            font-family: 'Courier New', Courier, monospace;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        @keyframes smallSlide {
            0% { transform: translateX(-50%) translateX(-40px); }
            100% { transform: translateX(-50%) translateX(40px); }
        }

        .top-left-group {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .system-status, .visitor-counter, .live-clock, .terminal-btn, .mini-playlist-panel, .volume-panel {
            background: rgba(12, 12, 12, 0.85);
            border: var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .system-status {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .visitor-counter {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .visitor-counter span {
            color: #fff;
            font-weight: 600;
        }

        .live-clock {
            position: fixed;
            bottom: 20px;
            right: 30px;
            z-index: 20;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.9);
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            width: 280px;
            background: rgba(12, 12, 12, 0.95);
            border: var(--card-border);
            backdrop-filter: blur(12px);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 90%;
            max-width: 380px;
        }

        .card {
            width: 100%;
            padding: 40px 30px;
            background: rgba(10, 10, 10, 0.5);
            border: var(--card-border);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: 0;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .terminal-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 20;
            border-radius: 20px;
            padding: 15px 25px;
            font-size: 14px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .terminal-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            color: #fff;
        }

        .volume-panel {
            position: fixed;
            bottom: 73px;
            right: 30px;
            z-index: 20;
            width: 280px;
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(12, 12, 12, 0.95);
            border: var(--card-border);
            backdrop-filter: blur(12px);
        }

        .volume-icon {
            font-size: 15px;
            cursor: pointer;
            user-select: none;
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        .volume-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.85);
            width: 30px;
            text-align: right;
        }

        .mini-playlist-panel {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 25;
            width: 280px;
            border-radius: 14px;
            background: rgba(12, 12, 12, 0.98);
            border: var(--card-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
        }

        .playlist-toggle-header {
            padding: 12px 16px;
            font-size: 12px;
            letter-spacing: 2px;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 20, 0.98);
            user-select: none;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 14px;
            position: relative;
            z-index: 2;
        }

        /* Çizgiyi kaldıran ve köşeleri koruyan güncel kısım */
        .mini-playlist-panel.expanded .playlist-toggle-header {
            border-radius: 14px;
            border-bottom: none;
        }

        .playlist-toggle-header:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .playlist-items-container {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            max-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background: rgba(12, 12, 12, 0.98);
            border: var(--card-border);
            border-top: none;
            border-radius: 0 0 14px 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s;
            z-index: 1;
        }

        .mini-playlist-panel.expanded .playlist-items-container {
            max-height: calc(100vh - 120px);
            padding: 8px;
            margin-top: 2px;
        }

        .playlist-items-container::-webkit-scrollbar {
            width: 4px;
        }
        .playlist-items-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .playlist-items-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
        }

        .playlist-item {
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 11px;
            color: #ffffff;
            background: rgba(25, 25, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
        }

        .playlist-item.active {
            background: rgba(96, 165, 250, 0.35);
            color: #93c5fd;
            border-color: rgba(96, 165, 250, 0.5);
            font-weight: 700;
        }

        #playlist-arrow {
            transition: transform 0.3s ease;
        }

        .mini-playlist-panel.expanded #playlist-arrow {
            transform: rotate(180deg);
        }

        .terminal-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .terminal-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .terminal-box {
            width: 90%;
            max-width: 540px;
            height: 380px;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        .terminal-header {
            background: rgba(25, 25, 25, 0.8);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 1px;
        }

        .terminal-close {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            font-weight: bold;
            transition: color 0.2s;
        }

        .terminal-close:hover {
            color: #ff5555;
        }

        .terminal-body {
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--term-color, #ffffff);
            display: flex;
            flex-direction: column;
            gap: 10px;
            line-height: 1.5;
            position: relative;
            text-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 1;
        }

        .terminal-body > * {
            position: relative;
            z-index: 2;
        }

        .cmd-link {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
            margin: 2px;
            font-weight: 700;
        }

        .cmd-link:hover {
            background: rgba(96, 165, 250, 0.3);
        }

        .terminal-input-line {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .terminal-input-line span {
            color: #ffffff;
            font-weight: bold;
        }

        .terminal-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: 700;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="entry-screen" class="entry-screen">
        <div class="entry-text">[ Giriş İçin Tıklayın ]</div>
    </div>

    <div class="top-center-title">Mert Keskin</div>

    <div class="top-left-group">
        <div class="system-status">
            <div class="status-row">
                <div class="status-dot"></div>
                <span>SYS: ONLINE</span>
            </div>
            <div>PING: <span id="ping-val">12</span>ms</div>
        </div>
        <div class="visitor-counter">
            👁️ Görüntülenme: <span id="visit-count">Yükleniyor...</span>
        </div>
    </div>

    <div id="mini-playlist-panel" class="mini-playlist-panel">
        <div id="playlist-toggle-header" class="playlist-toggle-header">
            <span>Playlist</span>
            <span id="playlist-arrow">▼</span>
        </div>
        <div id="playlist-items-container" class="playlist-items-container"></div>
    </div>

    <div class="volume-panel">
        <div id="volume-icon" class="volume-icon">🔊</div>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="70">
        <div id="volume-text" class="volume-text">70%</div>
    </div>

    <div class="live-clock">
        <div id="live-date">--.--.----</div>
        <div id="live-time" style="color: #fff; font-weight: 600;">--:--:--</div>
    </div>

    <video id="bg-video" class="bg-video" autoplay loop muted playsinline crossorigin="anonymous">
        <source src="video.mp4" type="video/mp4">
    </video>

    <canvas id="particle-canvas"></canvas>

    <button id="open-terminal" class="terminal-btn">
        <span style="font-family:'Courier New', monospace; font-weight:bold;">&gt;_</span>
        <span>Terminal</span>
    </button>

    <div class="main-wrapper">
        <div class="card">
            <img class="avatar" src="https://i.pinimg.com/1200x/c7/f2/7c/c7f27cf80aeb376ff2e0627b8e9167b6.jpg" alt="Avatar">
            <div class="title">radw</div>
        </div>
    </div>

    <div id="terminal-modal" class="terminal-modal">
        <div class="terminal-box">
            <div class="terminal-header">
                <span>radwlab@root: ~</span>
                <span id="close-terminal" class="terminal-close">[X]</span>
            </div>
            <div id="terminal-body" class="terminal-body">
                <canvas id="matrix-canvas"></canvas>
                <div>RADWLAB Interactive Terminal v2.9</div>
                <div>Yardım için 'help' yazabilirsin.</div>
            </div>
            <div class="terminal-input-line">
                <span>></span>
                <input type="text" id="terminal-input" class="terminal-input" autofocus>
            </div>
        </div>
    </div>

    <script>
        const videoPlaylist = [
            { key: "loosescrew", url: "video.mp4", title: "LooseScrew", startTime: 0 },
            { key: "aventador", url: "Aventador.mp4", title: "Aventador", startTime: 0 },
            { key: "why", url: "why.mp4", title: "Why", startTime: 0 },
            { key: "badboy", url: "BADBOY FETİSH.mp4", title: "Badboy Fetish", startTime: 0 },
            { key: "deha777", url: "777.mp4", title: "Deha 777", startTime: 0 },
            { key: "conan", url: "Conan x Xenia.mp4", title: "Conan x Xenia", startTime: 0 },
            { key: "gone", url: "Gone 4 a min.mp4", title: "Gone 4 a min", startTime: 0 },
            { key: "porsche", url: "Porsche 911.mp4", title: "Porsche 911", startTime: 0 },
            { key: "veneno", url: "Veneno.mp4", title: "Veneno", startTime: 0 },
            { key: "argentsale", url: "argent sale.mp4", title: "Argent Sale", startTime: 0 },
            { key: "askkirintilari", url: "ask kirintilari.mp4", title: "Ask Kirintilari", startTime: 0 },
            { key: "dehaaskim", url: "deha askim.mp4", title: "Deha Askim", startTime: 0 },
            { key: "prensesim", url: "prensesim.mp4", title: "Prensesim", startTime: 0 },
            { key: "prime", url: "prime.mp4", title: "Prime", startTime: 0 },
            { key: "senonaasiksin", url: "sen ona asiksin.mp4", title: "Sen Ona Asiksin", startTime: 0 },
            { key: "senordayoksun", url: "sen orda yoksun.mp4", title: "Sen Orda Yoksun", startTime: 0 }
        ];
        
        let currentVideoIndex = 0;
        const video = document.getElementById('bg-video');

        const entryScreen = document.getElementById('entry-screen');
        const miniPlaylistPanel = document.getElementById('mini-playlist-panel');
        const playlistToggleHeader = document.getElementById('playlist-toggle-header');
        const playlistItemsContainer = document.getElementById('playlist-items-container');

        const volumeSlider = document.getElementById('volume-slider');
        const volumeText = document.getElementById('volume-text');
        const volumeIcon = document.getElementById('volume-icon');
        let lastVolume = 0.7;

        volumeSlider.addEventListener('input', (e) => {
            let val = e.target.value;
            video.volume = val / 100;
            volumeText.textContent = `${val}%`;
            if (val == 0) {
                volumeIcon.textContent = "🔇";
            } else if (val < 40) {
                volumeIcon.textContent = "🔈";
            } else {
                volumeIcon.textContent = "🔊";
            }
        });

        volumeIcon.addEventListener('click', () => {
            if (video.volume > 0) {
                lastVolume = video.volume;
                video.volume = 0;
                volumeSlider.value = 0;
                volumeText.textContent = "0%";
                volumeIcon.textContent = "🔇";
            } else {
                video.volume = lastVolume;
                let percent = Math.round(lastVolume * 100);
                volumeSlider.value = percent;
                volumeText.textContent = `${percent}%`;
                volumeIcon.textContent = percent < 40 ? "🔈" : "🔊";
            }
        });

        function buildPlaylistUI() {
            playlistItemsContainer.innerHTML = '';
            videoPlaylist.forEach((v, index) => {
                let item = document.createElement('div');
                item.className = `playlist-item ${index === currentVideoIndex ? 'active' : ''}`;
                item.textContent = `${index + 1}. ${v.title}`;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    loadAndPlayVideo(index);
                });
                playlistItemsContainer.appendChild(item);
            });
        }
        buildPlaylistUI();

        playlistToggleHeader.addEventListener('click', () => {
            miniPlaylistPanel.classList.toggle('expanded');
        });

        function loadAndPlayVideo(index) {
            currentVideoIndex = index;
            const selectedVideo = videoPlaylist[currentVideoIndex];
            video.src = selectedVideo.url;
            video.currentTime = selectedVideo.startTime || 0;
            
            const items = playlistItemsContainer.querySelectorAll('.playlist-item');
            items.forEach((item, idx) => {
                if (idx === currentVideoIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            video.load();
            video.play().catch(() => {});
        }

        video.addEventListener('ended', function() {
            let nextIndex = (currentVideoIndex + 1) % videoPlaylist.length;
            loadAndPlayVideo(nextIndex);
        });

        entryScreen.addEventListener('click', function() {
            entryScreen.classList.add('hidden');
            video.muted = false;
            video.volume = 0.7;
            loadAndPlayVideo(currentVideoIndex);
        });

        function updateVisitorCounter() {
            fetch('https://api.countapi.xyz/hit/radwlab-interactive/visits')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('visit-count').textContent = data.value;
                })
                .catch(error => {
                    document.getElementById('visit-count').textContent = "1425";
                });
        }
        updateVisitorCounter();

        function updateClock() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('live-date').textContent = `${day}.${month}.${year}`;
            document.getElementById('live-time').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        setInterval(() => {
            let randomPing = Math.floor(Math.random() * 6) + 11;
            document.getElementById('ping-val').textContent = randomPing;
        }, 3000);

        const terminalModal = document.getElementById('terminal-modal');
        const openTerminalBtn = document.getElementById('open-terminal');
        const closeTerminalBtn = document.getElementById('close-terminal');
        const terminalInput = document.getElementById('terminal-input');
        const terminalBody = document.getElementById('terminal-body');

        let commandHistory = [];
        let matrixActive = false;
        let matrixInterval = null;

        openTerminalBtn.addEventListener('click', () => {
            terminalModal.classList.add('active');
            terminalInput.focus();
        });

        closeTerminalBtn.addEventListener('click', () => {
            terminalModal.classList.remove('active');
            stopMatrix();
        });

        const matrixCanvas = document.getElementById('matrix-canvas');
        const mCtx = matrixCanvas.getContext('2d');

        function startMatrix() {
            matrixActive = true;
            matrixCanvas.style.display = 'block';
            matrixCanvas.width = terminalBody.clientWidth;
            matrixCanvas.height = terminalBody.clientHeight;

            const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz@#$%^&*';
            const fontSize = 12;
            const columns = Math.floor(matrixCanvas.width / fontSize);
            const drops = [];
            for (let i = 0; i < columns; i++) drops[i] = 1;

            matrixInterval = setInterval(() => {
                mCtx.fillStyle = 'rgba(10, 10, 10, 0.15)';
                mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                mCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--term-color') || '#ffffff';
                mCtx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    mCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }, 50);
        }

        function stopMatrix() {
            if (matrixActive) {
                matrixActive = false;
                clearInterval(matrixInterval);
                matrixCanvas.style.display = 'none';
            }
        }

        async function runCommand(cmdText) {
            let cmd = cmdText.trim().toLowerCase();
            if (cmd !== '') commandHistory.push(cmdText);

            if (matrixActive && cmd !== 'clear') {
                stopMatrix();
            }
            
            let userLine = document.createElement('div');
            userLine.innerHTML = `<span style="color:rgba(255,255,255,0.85);">> ${cmdText}</span>`;
            terminalBody.appendChild(userLine);

            let respLine = document.createElement('div');

            if (cmd === 'help') {
                respLine.innerHTML = "Komut Listesi:<br>" +
                    "- <span class='cmd-link' onclick='runCommand(\"status\")'>status</span>: Sistem durumunu gösterir.<br>" +
                    "- <span class='cmd-link' onclick='runCommand(\"ping\")'>ping</span>: Ağ gecikmesini ölçer.<br>" +
                    "- <span class='cmd-link' onclick='runCommand(\"weather\")'>weather</span>: IP ve konuma göre hava durumunu gösterir.<br>" +
                    "- <span class='cmd-link' onclick='runCommand(\"matrix\")'>matrix</span>: Matrix efekti başlatır.<br>" +
                    "- <span class='cmd-link' onclick='runCommand(\"theme\")'>theme</span>: Terminal temasını değiştirir.<br>" +
                    "- <span class='cmd-link' onclick='runCommand(\"clear\")'>clear</span>: Ekranı temizler.";
            } else if (cmd === 'status') {
                respLine.innerHTML = "Durum: [OK] <br>- Video Akışı: Aktif <br>- Ses Modülü: Aktif";
            } else if (cmd === 'ping') {
                let currentPing = document.getElementById('ping-val').textContent;
                respLine.innerHTML = `Gecikme: ${currentPing}ms`;
            } else if (cmd === 'weather') {
                respLine.innerHTML = "IP adresi ve konum bilgileri alınıyor...";
                terminalBody.appendChild(respLine);
                terminalBody.scrollTop = terminalBody.scrollHeight;

                try {
                    let ipRes = await fetch('https://ipapi.co/json/');
                    let ipData = await ipRes.json();
                    
                    let ip = ipData.ip || "Bilinmiyor";
                    let city = ipData.city || "Bilinmiyor";
                    let region = ipData.region || "Bilinmiyor";
                    let lat = ipData.latitude;
                    let lon = ipData.longitude;

                    if (!lat || !lon) {
                        respLine.innerHTML = `IP Adresi: ${ip}<br>Konum bilgisi alınamadı.`;
                        terminalBody.scrollTop = terminalBody.scrollHeight;
                        return;
                    }

                    let weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    let weatherData = await weatherRes.json();
                    let temp = weatherData.current_weather.temperature;
                    let wind = weatherData.current_weather.windspeed;
                    let code = weatherData.current_weather.weathercode;
                    
                    let condition = "Normal";
                    if (code === 0) condition = "Açık / Güneşli";
                    else if (code >= 1 && code <= 3) condition = "Parçalı / Çok Bulutlu";
                    else if (code >= 51 && code <= 67) condition = "Yağmurlu";
                    else if (code >= 71 && code <= 77) condition = "Karlı";
                    else if (code >= 95) condition = "Fırtınalı";

                    respLine.innerHTML = `IP Adresi: ${ip}<br>` +
                                         `Konum: ${city} / ${region}<br>` +
                                         `- Sıcaklık: ${temp}°C<br>` +
                                         `- Durum: ${condition}<br>` +
                                         `- Rüzgar Hızı: ${wind} km/s`;
                } catch (err) {
                    respLine.innerHTML = "Veriler alınırken bir hata oluştu.";
                }
                terminalBody.scrollTop = terminalBody.scrollHeight;
                terminalInput.value = '';
                return;
            } else if (cmd === 'matrix') {
                respLine.innerHTML = "Matrix simülasyonu başlatıldı.";
                startMatrix();
            } else if (cmd === 'theme') {
                respLine.innerHTML = `Tema seçin:<br>` +
                    `<span class='cmd-link' onclick='runCommand(\"theme white\")' style='color:#ffffff;'>■ Beyaz</span> ` +
                    `<span class='cmd-link' onclick='runCommand(\"theme blue\")' style='color:#60a5fa;'>■ Mavi</span> ` +
                    `<span class='cmd-link' onclick='runCommand(\"theme purple\")' style='color:#c084fc;'>■ Mor</span>`;
            } else if (cmd.startsWith('theme ')) {
                let colorName = cmd.split(' ')[1];
                let colorHex = '#ffffff';
                if (colorName === 'blue') colorHex = '#60a5fa';
                else if (colorName === 'purple') colorHex = '#c084fc';
                document.documentElement.style.setProperty('--term-color', colorHex);
                respLine.innerHTML = `Tema güncellendi: ${colorName}`;
            } else if (cmd === 'clear') {
                terminalBody.innerHTML = '<canvas id="matrix-canvas"></canvas>';
                terminalInput.value = '';
                return;
            } else if (cmd === '') {
                respLine.innerHTML = "";
            } else {
                respLine.innerHTML = `Bilinmeyen komut: '${cmd}'. 'help' yazabilirsin.`;
            }
            
            terminalBody.appendChild(respLine);
            terminalInput.value = '';
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        terminalInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                runCommand(this.value);
            }
        });

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('mousemove', function(event) {
            for (let i = 0; i < 2; i++) {
                particles.push({
                    x: event.x,
                    y: event.y,
                    size: Math.random() * 2 + 0.5,
                    speedX: (Math.random() - 0.5) * 1.5,
                    speedY: (Math.random() - 0.5) * 1.5,
                    life: 80
                });
            }
        });

        function handleParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= 1.5;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life / 150})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            requestAnimationFrame(handleParticles);
        }
        handleParticles();
    </script>
</body>
</html>
