<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>forever</title>
<link rel="icon" type="image/png" sizes="512x512" href="mertbest.png">
<link rel="shortcut icon" href="mertbest.png">
<link rel="apple-touch-icon" sizes="512x512" href="mertbest.png">
<style>
:root{
  --line:rgba(255,255,255,.13);
  --line-strong:rgba(255,255,255,.26);
  --glass:rgba(10,10,12,.42);
  --glass-heavy:rgba(8,8,10,.78);
  --dim:rgba(255,255,255,.48);
  --ease:cubic-bezier(.16,1,.3,1);
  --lock-ease:cubic-bezier(.22,1,.36,1);
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
button,input{outline:none;font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
:focus-visible{outline:1.5px solid rgba(255,255,255,.8);outline-offset:3px}
html,body{height:100%;overflow:hidden;background:#050506;color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* video */
#bg{
  position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
  opacity:.42;filter:saturate(.85) contrast(1.04) brightness(.72);
  transition:opacity .85s var(--ease),filter .85s var(--ease);
  transform:scale(1.03);will-change:transform
}
body.in #bg{opacity:0;filter:saturate(1) contrast(1) brightness(1)}
body.in #bg.on{opacity:1}

.vig{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(to top,rgba(0,0,0,.68),transparent 36%),
    linear-gradient(to bottom,rgba(0,0,0,.48),transparent 22%),
    radial-gradient(ellipse at center,rgba(0,0,0,.12) 45%,rgba(0,0,0,.52) 100%)
}
#flash{position:fixed;inset:0;z-index:4;background:rgba(255,255,255,.22);opacity:0;pointer-events:none}

/* hızlı kenar geçiş bölgeleri (masaüstü & mobil) */
.edge-zone{
  position:fixed;top:16%;bottom:22%;width:min(11vw,96px);z-index:25;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)
}
body.in .edge-zone{pointer-events:auto}
body.in .edge-zone:hover{opacity:1}
#edgePrev{left:14px}
#edgeNext{right:14px}
.edge-pill{
  width:42px;height:42px;border-radius:50%;
  background:rgba(12,12,15,.48);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:grid;place-items:center;color:rgba(255,255,255,.85);
  transition:transform .25s var(--ease),background .25s var(--ease),color .25s var(--ease)
}
.edge-pill:hover{background:#fff;color:#000;transform:scale(1.06)}
.edge-pill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* avatar */
#av-wrapper{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:60;pointer-events:none}
#avw{position:relative;width:110px;height:110px;will-change:transform}
#av{
  width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04);
  box-shadow:0 12px 34px rgba(0,0,0,.45)
}
#av img{width:100%;height:100%;border-radius:50%;object-fit:cover;pointer-events:none}

/* ortak giriş animasyonu */
.ui{
  position:fixed;z-index:100;opacity:0;transform:translateY(12px);
  transition:opacity .85s .35s var(--ease),transform .85s .35s var(--ease)
}
body.in .ui{opacity:1;transform:none}

/* sol üst: şeffaf cam bilgi kapsülü */
#tl{
  top:22px;left:24px;display:flex;align-items:center;gap:12px;
  padding:8px 14px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font:500 .68rem var(--mono);letter-spacing:.13em;color:rgba(255,255,255,.86)
}
#tl i.sep{width:1px;height:12px;background:var(--line)}
#rootname{display:inline-block;white-space:pre}
#rootname .root-char{display:inline-block;color:rgba(255,255,255,.94);animation:rootMono 3s linear infinite}
#rootname .root-char:nth-child(2){animation-delay:.12s}
#rootname .root-char:nth-child(3){animation-delay:.24s}
#rootname .root-char:nth-child(4){animation-delay:.36s}
@keyframes rootMono{0%,100%{color:rgba(255,255,255,.94)}50%{color:rgba(255,255,255,.4)}}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin-right:7px;vertical-align:middle;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}

/* alt orta: slayt kontrolü & hızlı geçiş şeridi */
#cc{
  bottom:28px;left:50%;transform:translate(-50%,12px);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  width:min(480px,90vw)
}
body.in #cc{transform:translateX(-50%)}

#ttl{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  width:100%;padding:12px 18px;border-radius:18px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
#num{font:500 .62rem var(--mono);letter-spacing:.28em;color:var(--dim);display:flex;gap:8px;align-items:center}
#num b{font-weight:600;color:#fff}

#strip{
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;width:100%;gap:14px;min-height:28px
}
.sn{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:500 .7rem var(--mono);letter-spacing:.14em;text-transform:lowercase;
  transition:opacity .25s var(--ease),color .25s var(--ease),transform .25s var(--ease)
}
.sp,.sx{
  color:rgba(255,255,255,.52);opacity:.78;
  padding:4px 6px;border-radius:8px;max-width:100%
}
.sp{justify-self:start;text-align:left}
.sx{justify-self:end;text-align:right}
.sp::before{content:"‹ ";opacity:.7}
.sx::after{content:" ›";opacity:.7}
.sp:hover,.sx:hover{color:#fff;opacity:1;background:rgba(255,255,255,.07)}
.sc{
  font:600 .98rem var(--sans);letter-spacing:.16em;text-transform:lowercase;
  color:#fff;text-align:center;padding:0 6px;white-space:nowrap
}

#bar{position:relative;width:100%;height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;cursor:pointer}
#barfill{position:absolute;left:0;top:0;height:100%;width:0;background:#fff;border-radius:99px}

#ctl{display:flex;align-items:center;gap:14px}
.cb{
  display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  background:var(--glass);border:1px solid var(--line);color:rgba(255,255,255,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease)
}
.cb svg{width:15px;height:15px;fill:currentColor}
.cb:hover{background:#fff;color:#000;border-color:#fff}
.cb:active{transform:scale(.92)}
#pp{width:56px;height:56px;background:#fff;color:#000;border-color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#pp svg{width:18px;height:18px}
#pp:hover{background:rgba(255,255,255,.88)}

/* sol alt: video listesi */
#bl{bottom:30px;left:24px}
#pick{
  display:flex;align-items:center;gap:12px;
  padding:10px 15px;border-radius:999px;min-width:156px;justify-content:space-between;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font:500 .7rem var(--mono);letter-spacing:.13em;color:rgba(255,255,255,.88);
  -webkit-user-select:none;user-select:none;transition:border-color .25s,background .25s
}
#pick:hover{border-color:var(--line-strong);background:rgba(18,18,22,.62)}
#pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pick b{font-weight:400;opacity:.6;transition:transform .3s var(--ease)}
#bl.open #pick b{transform:rotate(180deg)}

#list{
  position:absolute;bottom:calc(100% + 10px);left:0;width:220px;max-height:260px;overflow-y:auto;
  padding:6px;border-radius:14px;
  background:var(--glass-heavy);border:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;visibility:hidden;transform:translateY(8px) scale(.98);
  transition:all .28s var(--ease)
}
#bl.open #list{opacity:1;visibility:visible;transform:none}
.it{
  display:flex;gap:12px;padding:9px 11px;border-radius:9px;cursor:pointer;
  font:500 .7rem var(--mono);color:var(--dim);letter-spacing:.08em;transition:.18s
}
.it:hover{color:#fff;background:rgba(255,255,255,.07)}
.it em{font-style:normal;opacity:.48}
.it.act{color:#000;background:#fff;font-weight:600}

/* sağ alt: ses */
#br{
  bottom:30px;right:24px;display:flex;align-items:center;gap:12px;
  padding:6px 14px 6px 6px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
#mute{width:36px;height:36px;background:rgba(255,255,255,.04)}
#mute svg{width:14px;height:14px}
#vol{position:relative;width:82px;height:18px;display:flex;align-items:center}
#vol .tr{position:absolute;left:0;right:0;height:2px;border-radius:99px;background:rgba(255,255,255,.16)}
#vol .fl{position:absolute;left:0;height:2px;border-radius:99px;background:#fff;transition:width .05s linear}
#vol input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}

/* discord kartı */
#dc{
  top:calc(40% + 96px);left:50%;display:none;flex-direction:column;gap:12px;
  width:min(332px,90vw);padding:14px;border-radius:18px;
  border:1px solid var(--line);background:var(--glass-heavy);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;
  transform-origin:50% -96px;transform:translate(-50%,-24px) scale(.86);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .28s var(--ease),transform .4s var(--ease),visibility 0s .4s
}
body.in #dc{transform:translate(-50%,-24px) scale(.86);opacity:0}
#dc.ready{display:flex;z-index:120}
#dc.open,body.in #dc.open{
  transform:translate(-50%,0) scale(1);opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .4s var(--ease),transform .65s var(--ease),visibility 0s
}
#dc > *{opacity:0;transform:translateY(10px);transition:opacity .22s,transform .22s}
#dc.open > *{opacity:1;transform:none;transition:opacity .45s var(--ease),transform .55s var(--ease)}
#dc.open > :nth-child(1){transition-delay:.08s}
#dc.open > :nth-child(2){transition-delay:.14s}
#dc.open > :nth-child(3){transition-delay:.2s}
#dc.open > :nth-child(4){transition-delay:.26s}
#avw{pointer-events:auto;cursor:pointer}
#av{transition:border-color .35s}
#avw.act #av{border-color:rgba(255,255,255,.65)}
#dch{display:flex;align-items:center;gap:12px}
#dcav{position:relative;width:48px;height:48px;flex:none}
#dcimg{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
#dcdeco{position:absolute;left:-12%;top:-12%;width:124%;height:124%;pointer-events:none;display:none}
#dcst{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:2.5px solid #0b0b0d;background:#6b6b6b}
#dcst.online{background:#f0f0f0}
#dcst.idle{background:#a8a8a8}
#dcst.dnd{background:#7a7a7a}
#dcst.offline{background:#3a3a3a}
#dcid{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
#dcrow{display:flex;align-items:center;gap:8px;min-width:0}
#dcname{font:600 .92rem var(--sans);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dctag{font:600 .56rem var(--mono);letter-spacing:.12em;padding:2px 6px;border:1px solid var(--line);border-radius:5px;color:rgba(255,255,255,.8);flex:none}
#dcuser{font:500 .66rem var(--mono);letter-spacing:.08em;color:var(--dim)}
#dcplat{display:flex;gap:8px;color:var(--dim);flex:none}
.plat svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
#dcbadges{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .56rem var(--mono);letter-spacing:.12em;padding:3px 8px;border:1px solid var(--line);border-radius:99px;color:rgba(255,255,255,.7)}
#dccs{display:flex;align-items:center;gap:8px;font:500 .74rem var(--sans);letter-spacing:.03em;color:rgba(255,255,255,.88);padding-top:12px;border-top:1px solid var(--line);min-width:0}
#dccs span:not(.emo){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dccs .dim{color:var(--dim);font-family:var(--mono);font-size:.66rem;letter-spacing:.12em}
.emo{width:18px;height:18px;flex:none;font-size:1rem;line-height:18px;text-align:center}
#dcbody:empty{display:none}
.albl{font:500 .58rem var(--mono);letter-spacing:.22em;color:var(--dim);margin-bottom:9px;text-transform:uppercase}
.act{display:flex;gap:12px;align-items:center}
.aimg{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
.atx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.at{font:600 .8rem var(--sans);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as,.as2{font:500 .66rem var(--mono);letter-spacing:.06em;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as2{color:var(--dim)}
.pb{height:2px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#fff}
.pt{display:flex;justify-content:space-between;font:500 .56rem var(--mono);color:var(--dim);letter-spacing:.08em}

/* ============ ŞEFFAF KİLİT / GİRİŞ EKRANI ============ */
#splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
  background:radial-gradient(circle at 50% 42%,rgba(16,16,20,.38),rgba(4,4,6,.68));
  backdrop-filter:blur(7px) saturate(110%);
  -webkit-backdrop-filter:blur(7px) saturate(110%);
  transition:
    opacity .95s var(--lock-ease),
    visibility .95s,
    backdrop-filter 1.05s var(--lock-ease),
    -webkit-backdrop-filter 1.05s var(--lock-ease),
    transform 1.05s var(--lock-ease)
}
#splash.out{
  opacity:0;
  visibility:hidden;
  backdrop-filter:blur(0px) saturate(100%);
  -webkit-backdrop-filter:blur(0px) saturate(100%);
  transform:scale(1.06);
  pointer-events:none
}

/* kilit açılırken merkez halka ve başlık şeffafça ayrılır */
.lock-ring{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:42px 48px;border-radius:36px;
  background:rgba(12,12,15,.34);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 70px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .95s var(--lock-ease),opacity .75s var(--lock-ease),border-color .75s var(--lock-ease)
}
#splash.out .lock-ring{
  transform:scale(1.14);
  opacity:0;
  border-color:rgba(255,255,255,0)
}

.grid{
  position:absolute;inset:0;opacity:.28;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 12%,transparent 68%);mask-image:radial-gradient(ellipse at center,#000 12%,transparent 68%)
}
#sc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.65}

.eyebrow{
  position:relative;font:500 .76rem var(--mono);letter-spacing:.45em;
  color:rgba(255,255,255,.62);opacity:0;transform:translateY(8px);
  margin-bottom:22px;padding-left:.45em;
  animation:rise .95s .15s var(--ease) forwards
}
@keyframes rise{to{opacity:1;transform:none}}

#typed{
  position:relative;display:flex;font:200 clamp(2.3rem,8.5vw,4.7rem) var(--sans);
  letter-spacing:.16em;line-height:1.1;min-height:1.2em;padding-left:.16em;white-space:pre
}
.ch{
  display:inline-block;opacity:0;filter:blur(10px);transform:translateY(20px) scale(1.1);
  animation:chIn 1s var(--ease) forwards;animation-delay:calc(var(--i)*.08s + .35s)
}
@keyframes chIn{to{opacity:1;filter:blur(0);transform:none}}
#typed.done .ch{opacity:1;filter:none;transform:none;animation:wave 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*.14s)}
@keyframes wave{0%,100%{color:rgba(255,255,255,.65);text-shadow:none}50%{color:#fff;text-shadow:0 0 26px rgba(255,255,255,.35)}}
#typed.gl{animation:tg .3s steps(2) 1}
@keyframes tg{
  0%{text-shadow:3px 0 rgba(255,255,255,.45),-3px 0 rgba(130,130,130,.45);transform:translateX(-3px)}
  50%{text-shadow:-4px 0 rgba(255,255,255,.45),4px 0 rgba(130,130,130,.45);transform:translateX(4px)}
  100%{text-shadow:none;transform:none}
}

#rule{position:relative;width:min(260px,54vw);height:1px;margin:26px 0 28px;background:rgba(255,255,255,.14);overflow:hidden}
#rule::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translateX(-100%)}
#rule.go::after{animation:sweep 1.5s var(--ease) forwards}
@keyframes sweep{to{transform:translateX(100%)}}

#enter{
  position:relative;display:flex;align-items:center;gap:14px;padding:13px 32px;
  border:1px solid rgba(255,255,255,.26);border-radius:999px;overflow:hidden;
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.88);
  font:500 .72rem var(--mono);letter-spacing:.32em;text-transform:lowercase;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .75s var(--ease),transform .75s var(--ease),color .3s,border-color .3s,background .3s
}
#enter::before{content:"";position:absolute;inset:0;background:#fff;transform:translateY(102%);transition:transform .42s var(--ease);z-index:0}
#enter span,#enter svg{position:relative;z-index:1}
#enter svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;transition:transform .32s var(--ease)}
#enter.show{opacity:1;transform:none;pointer-events:auto}
#enter:hover{color:#000;border-color:#fff}
#enter:hover::before{transform:none}
#enter:hover svg{transform:translateX(4px)}

.hint{
  margin-top:18px;font:400 .58rem var(--mono);letter-spacing:.28em;
  color:rgba(255,255,255,.36);opacity:0;transition:opacity .9s .35s
}
.hint.show{opacity:1}

@media(prefers-reduced-motion:reduce){.dot,.grid{animation:none}}

@media(max-width:768px){
  .edge-zone{display:none}
  .lock-ring{padding:32px 26px;border-radius:28px}
  #tl{top:14px;left:14px;padding:7px 12px;font-size:.6rem;gap:8px}
  #avw{width:84px;height:84px}
  #dc{top:calc(40% + 70px);padding:12px;gap:10px;transform-origin:50% -70px}
  .aimg{width:48px;height:48px}
  #cc{bottom:20px;gap:14px;width:min(440px,92vw)}
  #ttl{padding:10px 14px;gap:8px;border-radius:16px}
  #pp{width:52px;height:52px}
  .cb{width:42px;height:42px}
  .sc{font-size:.9rem;letter-spacing:.12em}
  .sn{font-size:.64rem;letter-spacing:.1em}
  #bl{left:14px;top:58px;bottom:auto}
  #pick{min-width:124px;padding:8px 12px;font-size:.64rem}
  #list{top:calc(100% + 8px);bottom:auto;width:196px;max-height:min(240px,46vh)}
  #br{right:14px;top:56px;bottom:auto;gap:8px;padding:4px 10px 4px 4px}
  #mute{width:34px;height:34px}
  #vol{width:64px}
}
@media(max-height:540px){
  #cc{bottom:10px;gap:10px}
  #num{display:none}
  #ttl{gap:6px;padding:8px 12px}
  #avw{width:58px;height:58px}
  #dc{top:calc(40% + 52px);transform-origin:50% -52px}
  #pp{width:44px;height:44px}
  .cb{width:36px;height:36px}
  #bl{bottom:auto;top:56px}
  #br{bottom:auto;top:54px}
}
</style>
</head>
<body>

<div id="splash" role="dialog" aria-modal="true" aria-label="kilit ekranı">
  <div class="grid"></div>
  <canvas id="sc"></canvas>
  <div class="lock-ring">
    <div class="eyebrow">hi stalker</div>

<script>
const vids = [
  {n:"megatron",f:"megatron .mp4"},
  {n:"amazing",f:"amazing.MP4"},
  {n:"corvette",f:"corvette.MP4"},
  {n:"extraction",f:"extraction.MP4"},
  {n:"eternal",f:"eternal.MP4"},
  {n:"john wick",f:"wick.mp4"},
  {n:"james bond",f:"bond.mp4"},
  {n:"deep end",f:"deepend.mp4"},
  {n:"loosescrew",f:"loosescrew.mp4"},
  {n:"harley quin",f:"harleyquin.mp4"},
  {n:"batman",f:"batman.mp4"},
  {n:"cod",f:"cod.mp4"},
  {n:"bumblebee",f:"bee.mp4"},
  {n:"ghost",f:"ghost.mp4"},
  {n:"heathnes",f:"heathnes.MP4"},
  {n:"spiderman",f:"spiderman.mp4"},
  {n:"ironman",f:"ironman.mp4"},
  {n:"morty",f:"c137.mp4"},
  {n:"john wick",f:"john wick.MP4"},
  {n:"mother of dragon",f:"mother of dragon.MP4"},
  {n:"jurrasic",f:"jurrasic.MP4"},
  {n:"batman",f:"batman.MP4"},
  {n:"shadow",f:"shadow.mp4"},
  {n:"atreides",f:"atreides.mp4"},
  {n:"prime",f:"prime.mp4"},
  {n:"bumblebee",f:"bumblebee.mp4"},
  {n:"southpaw",f:"southpaw.MP4"},
  {n:"scream",f:"scream.mp4"}
];
const $ = id => document.getElementById(id);
const v = $('bg'), avw = $('avw'), av = $('av'), flash = $('flash');
const N = vids.length;
let idx = 0, started = false, last = 0.5;
let actx, an, buf;

const ICON_ON  = '<path d="M13.5 4.06c0-1.34-1.62-2-2.56-1.06l-4.5 4.5H4.5C3.36 7.5 2.44 8.43 2.44 9.57v4.86c0 1.14.92 2.07 2.06 2.07h1.94l4.5 4.5c.94.95 2.56.28 2.56-1.06V4.06zM18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/>';
const ICON_OFF = '<path d="M13.5 4.06c0-1.34-1.62-2-2.56-1.06l-4.5 4.5H4.5C3.36 7.5 2.44 8.43 2.44 9.57v4.86c0 1.14.92 2.07 2.06 2.07h1.94l4.5 4.5c.94.95 2.56.28 2.56-1.06V4.06z"/><path d="M16 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>';
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

/* ============ GİRİŞTE İLK VİDEONUN DURUK KARESİNİ HAZIRLA ============ */
v.src = vids[0].f;
v.load();
v.addEventListener('loadeddata', function freezePreview(){
  if (!started) {
    v.pause();
    if (v.currentTime === 0) v.currentTime = 0.05;
  }
}, {once:true});

/* ============ GİRİŞ EKRANI ============ */
const hi = "forever";
const typed = $('typed');
typed.innerHTML = [...hi].map((c,i) =>
  c === ' ' ? `<span class="ch" style="--i:${i};width:.38em"> </span>` : `<span class="ch" style="--i:${i}">${c}</span>`).join('');

setTimeout(() => $('rule').classList.add('go'), 1150);
setTimeout(() => { typed.classList.add('done'); }, 2250);
setTimeout(() => { $('enter').classList.add('show'); $('hint').classList.add('show'); }, 1650);
(function glitch(){
  setTimeout(() => {
    if (!started){ typed.classList.remove('gl'); void typed.offsetWidth; typed.classList.add('gl'); glitch(); }
  }, 2800 + Math.random()*2600);
})();

(function(){
  const c = $('sc'), x = c.getContext('2d');
  let w, h, d;
  const fit = () => { d = Math.min(devicePixelRatio||1, 2); w = c.width = innerWidth*d; h = c.height = innerHeight*d; };
  fit(); addEventListener('resize', fit);
  const n = innerWidth < 768 ? 36 : 70;
  const p = Array.from({length:n}, () => ({x:Math.random(), y:Math.random(), z:Math.random()*.8+.2, s:Math.random()*.00035+.00008, ph:Math.random()*6.28}));
  (function f(t){
    if (started) return;
    requestAnimationFrame(f);
    x.clearRect(0,0,w,h);
    p.forEach(o => {
      o.y -= o.s * o.z; if (o.y < -.02) { o.y = 1.02; o.x = Math.random(); }
      const a = (.2 + .3*Math.sin(t/1200 + o.ph)) * o.z;
      x.fillStyle = `rgba(255,255,255,${Math.max(a,0)})`;
      x.beginPath(); x.arc(o.x*w, o.y*h, o.z*1.5*d, 0, 6.283); x.fill();
    });
  })(0);
})();

/* ============ VİDEO + SLAYT İSİMLERİ ============ */
function nameAt(k){ return vids[(k + N) % N].n; }

function paintNames(dir){
  const a = $('sPrev'), b = $('sCur'), c = $('sNext');
  a.textContent = nameAt(idx-1);
  b.textContent = nameAt(idx);
  c.textContent = nameAt(idx+1);
  $('pickName').textContent = nameAt(idx);
  $('n1').textContent = String(idx+1).padStart(2,'0');
  $('n2').textContent = String(N).padStart(2,'0');
  if (dir && !matchMedia('(prefers-reduced-motion:reduce)').matches){
    [a,b,c].forEach((el,i) => el.animate(
      [{transform:`translateX(${dir*24}px)`, opacity:0, filter:'blur(4px)'}],
      {duration:480, easing:'cubic-bezier(.16,1,.3,1)', delay:i*35}));
  }
  $('list').innerHTML = vids.map((x,k) =>
    `<div class="it ${k===idx?'act':''}" data-k="${k}"><em>${String(k+1).padStart(2,'0')}</em>${x.n}</div>`).join('');
}
paintNames(0);

function load(i, dir = 1){
  idx = (i + N) % N;
  v.classList.remove('on');
  v.src = vids[idx].f;
  v.load();
  v.play().catch(()=>{});
  paintNames(dir);
}
v.addEventListener('loadeddata', () => {
  if (started) v.classList.add('on');
});

function setPP(p){ $('ppi').innerHTML = p ? PAUSE : PLAY; }
function toggle(){ if (v.paused) { v.play().catch(()=>{}); setPP(true); } else { v.pause(); setPP(false); } }
const go = d => { load(idx + d, d); setPP(true); };

$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('edgePrevBtn').onclick = e => { e.stopPropagation(); go(-1); };
$('edgeNextBtn').onclick = e => { e.stopPropagation(); go(1); };
$('sPrev').onclick = () => go(-1);
$('sNext').onclick = () => go(1);
$('pp').onclick = toggle;
v.addEventListener('ended', () => go(1));

/* ilerleme çubuğuna tıklayarak sarma */
$('bar').addEventListener('click', e => {
  if (!v.duration) return;
  const r = $('bar').getBoundingClientRect();
  const pct = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  v.currentTime = pct * v.duration;
});

/* isim alanında ve sayfada tekerlek / dokunmatik kaydırma ile geçiş */
let wheelLock = 0;
addEventListener('wheel', e => {
  if (!started) return;
  const now = performance.now();
  if (now - wheelLock < 420) return;
  const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (Math.abs(delta) > 18) {
    wheelLock = now;
    go(delta > 0 ? 1 : -1);
  }
}, {passive:true});

let touchX = 0, touchY = 0;
addEventListener('touchstart', e => {
  if (!started || e.touches.length !== 1) return;
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, {passive:true});
addEventListener('touchend', e => {
  if (!started || !e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    go(dx < 0 ? 1 : -1);
  }
}, {passive:true});

/* sol alttaki liste */
$('list').addEventListener('click', e => {
  const it = e.target.closest('.it'); if (!it) return;
  const k = +it.dataset.k;
  load(k, k >= idx ? 1 : -1); setPP(true); $('bl').classList.remove('open');
});
$('pick').onclick = e => { e.stopPropagation(); $('bl').classList.toggle('open'); };
document.addEventListener('click', e => { if (!$('bl').contains(e.target)) $('bl').classList.remove('open'); });

/* ============ SONRAKİ / ÖNCEKİ VİDEOYU ÖNCEDEN YÜKLE ============ */
const preNext = document.createElement('video'), prePrev = document.createElement('video');
[preNext, prePrev].forEach(p => { p.preload = 'auto'; p.muted = true; p.playsInline = true; });
function preloadAround(){
  const n = vids[(idx+1)%N].f, b = vids[(idx-1+N)%N].f;
  if (!preNext.src.endsWith(encodeURI(n))) preNext.src = n;
  if (!prePrev.src.endsWith(encodeURI(b))) prePrev.src = b;
}
v.addEventListener('canplay', () => { if (started) setTimeout(preloadAround, 500); });

/* ============ DISCORD KARTI (Lanyard) ============ */
const DISCORD_ID = "1089970384889192558";
const STATUS_TR = {online:'çevrimiçi', idle:'boşta', dnd:'rahatsız etmeyin', offline:'çevrimdışı'};
const ACT_TR = {0:'oynuyor', 1:'yayında', 2:'dinliyor', 3:'izliyor', 5:'yarışıyor'};
const BADGES = [[1,'discord staff'],[2,'partner'],[4,'hypesquad events'],[8,'bug hunter'],[64,'bravery'],[128,'brilliance'],[256,'balance'],[512,'early supporter'],[16384,'bug hunter'],[131072,'bot dev'],[4194304,'active developer']];
const PLAT = {
  active_on_discord_desktop:['masaüstü','<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>'],
  active_on_discord_mobile:['mobil','<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>'],
  active_on_discord_web:['web','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>']
};
let actState = null;
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const p2 = n => String(n).padStart(2,'0');
const fmt = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), x = sec%60; return (h ? h + ':' + p2(m) : m) + ':' + p2(x); };
function actImg(a){
  const li = a.assets && a.assets.large_image; if (!li) return null;
  if (li.startsWith('mp:')) return 'https://media.discordapp.net/' + li.slice(3);
  if (li.startsWith('spotify:')) return 'https://i.scdn.co/image/' + li.slice(8);
  return a.application_id ? `https://cdn.discordapp.com/app-assets/${a.application_id}/${li}.png` : null;
}
function render(d){
  const u = d.discord_user, st = d.discord_status || 'offline';
  $('dcimg').src = u.avatar
    ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`
    : `https://cdn.discordapp.com/embed/avatars/${Number((BigInt(u.id) >> 22n) % 6n)}.png`;
  const deco = u.avatar_decoration_data && u.avatar_decoration_data.asset, dd = $('dcdeco');
  if (deco){ dd.src = 'https://cdn.discordapp.com/avatar-decoration-presets/' + deco + '.png?size=160'; dd.style.display = 'block'; } else dd.style.display = 'none';
  $('dcst').className = st;
  $('dcname').textContent = u.global_name || u.username;
  const tag = u.primary_guild && u.primary_guild.tag;
  $('dctag').textContent = tag || ''; $('dctag').style.display = tag ? '' : 'none';
  $('dcuser').textContent = '@' + u.username;

  const bx = $('dcbadges'); bx.replaceChildren();
  const seen = new Set();
  BADGES.forEach(([bit, name]) => { if ((u.public_flags & bit) && !seen.has(name)){ seen.add(name); bx.appendChild(mk('span','chip',name)); } });
  bx.style.display = bx.children.length ? '' : 'none';

  const pl = $('dcplat'); pl.replaceChildren();
  Object.keys(PLAT).forEach(k => { if (d[k]){ const el = mk('span','plat'); el.title = PLAT[k][0]; el.innerHTML = PLAT[k][1]; pl.appendChild(el); } });

  const cs = (d.activities || []).find(x => x.type === 4), cc = $('dccs'); cc.replaceChildren();
  if (cs && (cs.state || cs.emoji)){
    if (cs.emoji){
      if (cs.emoji.id){ const im = mk('img','emo'); im.src = `https://cdn.discordapp.com/emojis/${cs.emoji.id}.${cs.emoji.animated ? 'gif' : 'png'}?size=32`; cc.appendChild(im); }
      else if (cs.emoji.name) cc.appendChild(mk('span','emo',cs.emoji.name));
    }
    if (cs.state) cc.appendChild(mk('span', null, cs.state));
  } else cc.appendChild(mk('span','dim',STATUS_TR[st] || ''));

  const body = $('dcbody'); body.replaceChildren(); actState = null;
  if (d.listening_to_spotify && d.spotify){
    const sp = d.spotify;
    body.appendChild(mk('div','albl','♪ spotify dinliyor'));
    const row = mk('div','act');
    if (sp.album_art_url){ const im = mk('img','aimg'); im.src = sp.album_art_url; row.appendChild(im); }
    const tx = mk('div','atx');
    tx.appendChild(mk('b','at',sp.song));
    tx.appendChild(mk('span','as',String(sp.artist).replace(/;\s*/g, ', ')));
    if (sp.album) tx.appendChild(mk('span','as2',sp.album));
    const pb = mk('div','pb'), f = mk('i'); f.id = 'pbf'; pb.appendChild(f); tx.appendChild(pb);
    const pt = mk('div','pt'), t1 = mk('span', null, '0:00'); t1.id = 'pt1';
    pt.appendChild(t1); pt.appendChild(mk('span', null, fmt((sp.timestamps.end - sp.timestamps.start)/1000)));
    tx.appendChild(pt); row.appendChild(tx); body.appendChild(row);
    actState = {kind:'spotify', start:sp.timestamps.start, end:sp.timestamps.end};
  } else {
    const a = (d.activities || []).find(x => [0,1,2,3,5].includes(x.type));
    if (a){
      body.appendChild(mk('div','albl',ACT_TR[a.type] || ''));
      const row = mk('div','act'), img = actImg(a);
      if (img){ const im = mk('img','aimg'); im.src = img; row.appendChild(im); }
      const tx = mk('div','atx');
      tx.appendChild(mk('b','at',a.name));
      if (a.details) tx.appendChild(mk('span','as',a.details));
      if (a.state) tx.appendChild(mk('span','as2',a.state));
      if (a.timestamps && a.timestamps.start){
        const t1 = mk('span','as2','0:00'); t1.id = 'pt1'; tx.appendChild(t1);
        actState = {kind:'game', start:a.timestamps.start};
      }
      row.appendChild(tx); body.appendChild(row);
    }
  }
  tickAct();
  $('dc').classList.add('ready');
}
function tickAct(){
  if (!actState) return;
  const now = Date.now(), t = $('pt1');
  if (actState.kind === 'spotify'){
    const dur = actState.end - actState.start, el = Math.min(Math.max(now - actState.start, 0), dur), f = $('pbf');
    if (f) f.style.width = (el/dur*100) + '%';
    if (t) t.textContent = fmt(el/1000);
  } else if (t) t.textContent = fmt((now - actState.start)/1000) + ' geçti';
}
setInterval(tickAct, 1000);
async function discord(){
  if (!/^\d{15,25}$/.test(DISCORD_ID)) return;
  try {
    const r = await fetch('https://api.lanyard.rest/v1/users/' + DISCORD_ID, {cache:'no-store'});
    const j = await r.json(); if (!j.success) return;
    render(j.data);
  } catch(e){}
}
discord(); setInterval(discord, 12000);

/* ============ KARTI AÇ / KAPA ============ */
(function(){
  const dc = $('dc');
  let t = 0, locked = false;
  const canHover = matchMedia('(hover:hover) and (pointer:fine)').matches;
  const isOpen = () => dc.classList.contains('open');
  const set = o => { dc.classList.toggle('open', o); avw.classList.toggle('act', o); };
  const open = () => { clearTimeout(t); if (dc.classList.contains('ready')) set(true); };
  const closeLater = () => { clearTimeout(t); t = setTimeout(() => set(false), 220); };
  if (canHover){
    [avw, dc].forEach(el => {
      el.addEventListener('mouseenter', () => { if (!locked) open(); else clearTimeout(t); });
      el.addEventListener('mouseleave', () => { locked = false; closeLater(); });
    });
  }
  avw.addEventListener('click', e => {
    e.stopPropagation(); clearTimeout(t);
    if (isOpen()){ set(false); locked = true; } else { locked = false; open(); }
  });
  dc.addEventListener('click', e => { e.stopPropagation(); clearTimeout(t); set(false); locked = true; });
  document.addEventListener('click', () => { if (isOpen()) set(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
})();

/* ============ SES ============ */
function setVol(x){
  v.volume = x; v.muted = x === 0;
  $('fl').style.width = (x*100) + '%';
  $('mi').innerHTML = x === 0 ? ICON_OFF : ICON_ON;
  if (x > 0) last = x;
}
$('vs').oninput = e => setVol(+e.target.value);
$('mute').onclick = () => {
  const x = (v.muted || v.volume === 0) ? (last || .5) : 0;
  $('vs').value = x; setVol(x);
};
setVol(.5);

function initAudio(){
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    an = actx.createAnalyser();
    an.fftSize = 256;
    an.smoothingTimeConstant = .55;
    const s = actx.createMediaElementSource(v);
    s.connect(an); an.connect(actx.destination);
    buf = new Uint8Array(an.frequencyBinCount);
  } catch(e){ console.log(e); }
}

function start(){
  if (started) return;
  started = true;
  $('splash').classList.add('out');
  document.body.classList.add('in');
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  v.currentTime = 0;
  v.muted = (+$('vs').value === 0);
  v.volume = +$('vs').value;
  v.classList.add('on');
  v.play().then(()=>setPP(true)).catch(()=>{ v.muted = true; v.play(); setPP(true); });
  flash.animate([{opacity:.65},{opacity:0}],{duration:750,easing:'ease-out'});
}
$('enter').onclick = start;

addEventListener('keydown', e => {
  if (!started) { if (e.key === 'Enter') start(); return; }
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'Escape') $('bl').classList.remove('open');
  else if (e.key.toLowerCase() === 'm') $('mute').click();
});

/* ============ SAAT + PING ============ */
const pad = n => String(n).padStart(2,'0');
function tick(){ const d = new Date(); $('clock').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
setInterval(tick, 1000); tick();
const PING_URL = 'https://www.cloudflare.com/cdn-cgi/trace';
async function once(){
  const t = performance.now();
  await fetch(PING_URL + '?t=' + Date.now(), {mode:'no-cors', cache:'no-store'});
  return performance.now() - t;
}
let pingAvg = 0;
async function ping(){
  try {
    await once();
    const ms = Math.min(await once(), await once());
    pingAvg = pingAvg ? pingAvg*.6 + ms*.4 : ms;
    $('ping').textContent = Math.round(pingAvg) + ' ms';
  } catch { $('ping').textContent = navigator.onLine ? '-- ms' : 'offline'; }
}
ping(); setInterval(ping, 5000);

/* ============ AVATAR (ses ile) + PARALAKS + İLERLEME ============ */
let W = innerWidth, H = innerHeight, tx = 0, ty = 0, lvl = 0;
addEventListener('resize', () => { W = innerWidth; H = innerHeight; });
addEventListener('mousemove', e => { tx = e.clientX/W - .5; ty = e.clientY/H - .5; });

function frame(t){
  requestAnimationFrame(frame);
  let target = 0;
  const live = started && !v.paused && buf && !v.muted;
  if (live) {
    an.getByteFrequencyData(buf);
    let bass = 0;
    for (let i = 0; i < 4; i++) bass += buf[i];
    bass = bass / 4 / 255;
    target = Math.pow(bass, 1.8) * 1.4;
  }
  lvl += (target - lvl) * (target > lvl ? .7 : .18);
  const idle = live ? 0 : (.5 + .5*Math.sin(t/1000)) * .015;
  const sc = .95 + lvl * (W < 768 ? .18 : .42) + idle;
  avw.style.transform = `scale(${sc})`;
  av.style.boxShadow = `0 0 ${lvl * 26}px rgba(255,255,255,${Math.min(lvl * 0.22, .35)})`;
  if (started) {
    v.style.transform = `scale(${1.03 + lvl*.01}) translate(${-tx*8}px,${-ty*8}px)`;
    if (v.duration) $('barfill').style.width = (v.currentTime/v.duration*100) + '%';
  }
}
requestAnimationFrame(frame);
</script>
