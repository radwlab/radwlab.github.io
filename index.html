<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Solo temo a Dios</title>
    <link rel="icon" type="image/jpeg" href="radw.jpg">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 30%, #12121a 0%, #070709 60%, #000000 100%);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.55);
            
            --glass-bg: rgba(20, 20, 28, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover-bg: rgba(35, 35, 50, 0.8);
            --glass-hover-border: rgba(255, 255, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        html, body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Giriş Ekranı */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .typewriter-text {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            color: var(--text-primary);
            min-height: 1.5rem;
            font-family: monospace;
        }

        .cursor {
            display: inline-block;
            background-color: var(--text-primary);
            width: 8px;
            height: 1.1rem;
            vertical-align: middle;
            animation: blink 0.8s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .enter-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 32px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.15s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.15s, background 0.15s;
        }

        .enter-btn.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .enter-btn:hover {
            border-color: var(--glass-hover-border);
            background: var(--glass-hover-bg);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
        }

        /* Arka Plan Video */
        .bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            background: #000;
            overflow: hidden;
            transform: translateZ(0);
        }

        .bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        /* Tam Merkez: Avatar Alanı */
        .top-center-avatar {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, transform 0.15s;
        }

        .top-center-avatar:hover {
            border-color: var(--glass-hover-border);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .top-center-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Sol Alt: Kayan Yazı ve Açılır Liste Kutusu */
        .bottom-left-container {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 100;
        }

        .marquee-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 130px;
            overflow: hidden;
            white-space: nowrap;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: border-color 0.15s, background 0.15s;
        }

        .marquee-btn:hover {
            border-color: var(--glass-hover-border);
            background: var(--glass-hover-bg);
        }

        /* Kesintisiz Sonsuz Kayan Yazı Efekti */
        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            animation: scrollMarquee 8s linear infinite;
        }

        .marquee-text {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            text-transform: uppercase;
            display: inline-block;
            padding-right: 30px;
        }

        @keyframes scrollMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Sol Altta Açılan Video Listesi Menüsü */
        .popup-menu {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 0;
            background: rgba(8, 8, 10, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 14px;
            width: 190px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px) scale(0.95);
            transition: all 0.2s ease;
        }

        .popup-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 0.73rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            padding: 7px 8px;
            border-radius: 6px;
            transition: all 0.15s ease;
            width: 100%;
            white-space: nowrap;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .menu-item.active {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .menu-item svg {
            width: 11px;
            height: 11px;
            fill: currentColor;
            flex-shrink: 0;
            opacity: 0.6;
        }

        /* Orta Alt Kontrol Paneli (İleri, Geri, Durdur) */
        .center-dock {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 6px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 6px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #ffffff;
            cursor: pointer;
            width: 34px;
            height: 32px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .control-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* Sağ Alt: Ses Paneli */
        .audio-dock {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .audio-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            opacity: 0.8;
            transition: opacity 0.15s;
        }

        .audio-icon-btn:hover {
            opacity: 1;
        }

        .audio-icon-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .audio-slider-container {
            position: relative;
            width: 65px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .audio-fill-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #ffffff, #a2a2b5);
            pointer-events: none;
            border-radius: 3px;
        }

        .audio-slider {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-appearance: none;
            background: transparent;
            outline: none;
            cursor: pointer;
            z-index: 2;
            margin: 0;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 0;
            height: 0;
            background: transparent;
        }

        /* Mobil Cihazlar İçin Uyumluluk Ayarları (Çakışmaları Önlemek İçin) */
        @media screen and (max-width: 768px) {
            .bottom-left-container {
                left: 15px;
                bottom: 20px;
            }
            .marquee-btn {
                width: 100px;
                padding: 8px 10px;
            }
            .center-dock {
                bottom: 20px;
            }
            .audio-dock {
                right: 15px;
                bottom: 20px;
                padding: 6px 10px;
            }
            .audio-slider-container {
                width: 45px;
            }
        }
    </style>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="splash-screen">
        <div class="typewriter-text"><span id="typedText"></span><span class="cursor" id="typeCursor"></span></div>
        <button class="enter-btn" id="enterBtn">giriş</button>
    </div>

    <!-- Arka Plan Video -->
    <div class="bg-video-container">
        <video id="bgVideo" loop playsinline webkit-playsinline crossorigin="anonymous" preload="metadata"></video>
    </div>

    <!-- Tam Merkez: Avatar (mert.PNG) -->
    <div class="top-center-avatar">
        <img src="mert.PNG" alt="Avatar" id="userAvatar">
    </div>

    <!-- Sol Alt: Kayan Video İsmi ve Açılır Liste -->
    <div class="bottom-left-container" id="bottomLeftContainer">
        <div class="popup-menu" id="videoPopupList"></div>
        <button class="marquee-btn" id="marqueeBtn" title="Video Listesi">
            <div class="marquee-track">
                <span class="marquee-text" id="marqueeText1">yükleniyor...</span>
                <span class="marquee-text" id="marqueeText2">yükleniyor...</span>
            </div>
        </button>
    </div>

    <!-- Orta Alt: İleri, Geri, Durdur Butonları -->
    <div class="center-dock">
        <button class="control-btn" id="prevVideoBtn" title="Önceki Video">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn" id="playPauseBtn" title="Oynat / Durdur">
            <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="control-btn" id="nextVideoBtn" title="Sonraki Video">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>

    <!-- Sağ Alt: Ses Paneli -->
    <div class="audio-dock" id="audioDock">
        <button class="audio-icon-btn" id="muteToggleBtn" title="Sesi Aç/Kapat">
            <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.068.926-2.068 2.068v6.864c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/></svg>
        </button>
        <div class="audio-slider-container">
            <div class="audio-fill-bar" id="audioFillBar"></div>
            <input type="range" class="audio-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <script>
        const videoList = [
            { name: "beyaz", file: "beyaz.mp4" },
            { name: "godfather", file: "mw.mp4" },
            { name: "jurrasic", file: "jurrasic.mp4" },
            { name: "this is love", file: "this is love.mp4" },
            { name: "raptor", file: "raptor.mp4" },
            { name: "atreides", file: "atreides.mp4" },
            { name: "prime", file: "prime.mp4" },
            { name: "esref tek", file: "ben.mp4" },
            { name: "car", file: "car.MP4" },
            { name: "deep end", file: "deep end.mp4" },
            { name: "dexter", file: "dexter.mp4" },
            { name: "hikaye", file: "hikaye.MP4" },
            { name: "karga", file: "karga.MP4" },
            { name: "killer", file: "killer.MP4" },
            { name: "serbet", file: "serbet.MP4" },
            { name: "southpaw", file: "southpaw.MP4" },
            { name: "zehir", file: "zehir.MP4" },
            { name: "panther", file: "panther.mp4" },
            { name: "ironman", file: "ironman.mp4" },
            { name: "blackfire", file: "blackfire.mp4" },
            { name: "dragon", file: "dragon.mp4" },
            { name: "evil morty", file: "evil morty.mp4" }
        ];

        let currentVideoIndex = 0;
        const bgVideo = document.getElementById('bgVideo');
        const splashScreen = document.getElementById('splash-screen');
        const enterBtn = document.getElementById('enterBtn');
        const typedTextEl = document.getElementById('typedText');
        const typeCursor = document.getElementById('typeCursor');
        const marqueeText1 = document.getElementById('marqueeText1');
        const marqueeText2 = document.getElementById('marqueeText2');
        let hasInteracted = false;

        const greetingText = "hi stalker";
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < greetingText.length) {
                typedTextEl.textContent += greetingText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 100);
            } else {
                typeCursor.style.display = 'none';
                enterBtn.classList.add('show');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateFillBar(0.5);
            bgVideo.muted = true;
            loadVideo(0);
            setTimeout(typeWriter, 300);
        });

        function loadVideo(index) {
            currentVideoIndex = (index + videoList.length) % videoList.length;
            bgVideo.src = videoList[currentVideoIndex].file;
            bgVideo.load();
            bgVideo.play().catch(() => {});
            
            const name = videoList[currentVideoIndex].name;
            marqueeText1.textContent = name;
            marqueeText2.textContent = name;
            
            updateVideoListUI();
        }

        function updateVideoListUI() {
            const container = document.getElementById('videoPopupList');
            container.innerHTML = '';
            videoList.forEach((vid, idx) => {
                const item = document.createElement('div');
                item.className = `menu-item ${idx === currentVideoIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <svg viewBox="0 0 24 24"><path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
                    ${vid.name}
                `;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    loadVideo(idx);
                    updatePlayPauseIcon(true);
                    toggleVideoPopup(false);
                });
                container.appendChild(item);
            });
        }

        const videoPopupList = document.getElementById('videoPopupList');
        const marqueeBtn = document.getElementById('marqueeBtn');

        function toggleVideoPopup(open) {
            if (open) {
                updateVideoListUI();
                videoPopupList.classList.add('open');
            } else {
                videoPopupList.classList.remove('open');
            }
        }

        marqueeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleVideoPopup(!videoPopupList.classList.contains('open'));
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('bottomLeftContainer').contains(e.target)) {
                toggleVideoPopup(false);
            }
        });

        const prevVideoBtn = document.getElementById('prevVideoBtn');
        const nextVideoBtn = document.getElementById('nextVideoBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');

        function updatePlayPauseIcon(isPlaying) {
            if (isPlaying) {
                playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        prevVideoBtn.addEventListener('click', () => {
            loadVideo(currentVideoIndex - 1);
            updatePlayPauseIcon(true);
            toggleVideoPopup(false);
        });

        nextVideoBtn.addEventListener('click', () => {
            loadVideo(currentVideoIndex + 1);
            updatePlayPauseIcon(true);
            toggleVideoPopup(false);
        });

        playPauseBtn.addEventListener('click', () => {
            if (bgVideo.paused) {
                bgVideo.play().catch(() => {});
                updatePlayPauseIcon(true);
            } else {
                bgVideo.pause();
                updatePlayPauseIcon(false);
            }
        });

        function startSite() {
            if (hasInteracted) return;
            hasInteracted = true;
            
            splashScreen.classList.add('fade-out');
            
            const currentVol = parseFloat(document.getElementById('volumeSlider').value);
            bgVideo.muted = false;
            bgVideo.volume = currentVol;
            bgVideo.play().then(() => {
                updatePlayPauseIcon(true);
            }).catch(() => {
                bgVideo.muted = true;
                bgVideo.play();
                updatePlayPauseIcon(true);
            });
        }

        enterBtn.addEventListener('click', startSite);
        enterBtn.addEventListener('touchend', startSite);

        const volumeSlider = document.getElementById('volumeSlider');
        const muteToggleBtn = document.getElementById('muteToggleBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const audioFillBar = document.getElementById('audioFillBar');
        let lastVolume = 0.5;

        function updateFillBar(vol) {
            audioFillBar.style.width = `${vol * 100}%`;
        }

        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            bgVideo.volume = vol;
            bgVideo.muted = (vol === 0);
            updateVolumeIcon(vol);
            updateFillBar(vol);
            if (vol > 0) lastVolume = vol;
        });

        muteToggleBtn.addEventListener('click', () => {
            if (bgVideo.muted || bgVideo.volume === 0) {
                bgVideo.muted = false;
                bgVideo.volume = lastVolume > 0 ? lastVolume : 0.5;
                volumeSlider.value = bgVideo.volume;
                updateVolumeIcon(bgVideo.volume);
                updateFillBar(bgVideo.volume);
            } else {
                lastVolume = bgVideo.volume;
                bgVideo.muted = true;
                bgVideo.volume = 0;
                volumeSlider.value = 0;
                updateVolumeIcon(0);
                updateFillBar(0);
            }
        });

        function updateVolumeIcon(vol) {
            if (vol === 0) {
                volumeIcon.innerHTML = '<path d="M3.63 3.63a.996.996 0 000 1.41L7.29 8.7 4.5 11.49c-1.141 0-2.068.926-2.068 2.068v6.864c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5c.944.945 2.56.276 2.56-1.06v-3.37l4.36 4.36a.996.996 0 101.41-1.41L5.04 3.63a.996.996 0 00-1.41 0zM11.94 17.5L8.44 14H4.5V9.5h3.94l3.5-3.5v11.5zM19 12c0 .82-.28 1.58-.75 2.19l1.42 1.42C20.3 14.67 21 13.4 21 12c0-2.54-1.46-4.73-3.58-5.78l-1.06 1.06C17.78 8.1 19 9.9 19 12 z"/>';
            } else {
                volumeIcon.innerHTML = '<path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.068.926-2.068 2.068v6.864c0 1.142.927 2.068 2.068 2.068H6.44l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/>';
            }
        }
    </script>
</body>
</html>
