<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>radw</title>
    <link rel="icon" type="image/jpeg" href="radw.jpg">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow-y: scroll;
            height: 100dvh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Sinematik Giriş Ekranı */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-text {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 1.1em;
            display: flex;
            align-items: center;
        }

        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 0.8em;
            background-color: #ffffff;
            margin-left: 6px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.3s, transform 0.2s;
            opacity: 0;
            animation: fadeInBtn 0.8s forwards 1.2s;
        }

        .enter-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeInBtn {
            to { opacity: 1; }
        }

        /* Navigasyon Bar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            padding: 0 15px 0 20px;
            padding-top: env(safe-area-inset-top);
            height: calc(48px + env(safe-area-inset-top));
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-family: monospace;
            white-space: nowrap;
        }

        .ping-box {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ping-dot {
            width: 5px;
            height: 5px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 6px #30d158;
        }

        .clock-display {
            color: var(--text-primary);
            font-weight: 500;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .me-trigger-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s, transform 0.2s;
        }

        .me-trigger-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-logo {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        /* Sosyal Medya Açılır Menüsü (Modal) */
        .social-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .social-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .social-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .social-modal.open .social-card {
            transform: translateY(0);
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .social-links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .social-link-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 14px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
        }

        .social-link-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .social-link-item:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.15);
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 5px;
            letter-spacing: 0.05em;
        }

        /* Ana Akış */
        .main-container {
            width: 100%;
            height: 100dvh;
            position: relative;
        }

        section {
            width: 100%;
            height: 100dvh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            opacity: 0.3;
            transition: opacity 0.5s ease-in-out;
        }

        section.in-view {
            opacity: 1;
        }

        /* Hero Bölümü */
        .hero-section {
            background: radial-gradient(circle at center, #111 0%, #000 70%);
            text-align: center;
            flex-direction: column;
        }

        .hero-title {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        .hero-profile-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .hero-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
        }

        .hero-subtitle {
            font-size: clamp(0.95rem, 1.8vw, 1.15rem);
            font-style: normal;
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
        }

        .scroll-indicator {
            position: absolute;
            bottom: max(30px, env(safe-area-inset-bottom) + 10px);
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* Video Bölümleri */
        .video-section {
            background: #000;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
        }

        .video-overlay {
            position: absolute;
            bottom: max(40px, env(safe-area-inset-bottom, 20px) + 20px);
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 100;
            background: transparent; /* Siyah panel arka planı kaldırıldı */
            padding: 0;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-name {
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .audio-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sound-wave {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 14px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .sound-wave.playing {
            opacity: 1;
        }

        .bar {
            width: 3px;
            background-color: var(--text-primary);
            border-radius: 2px;
            animation: soundWave 1s ease-in-out infinite;
            animation-play-state: paused;
        }

        .sound-wave.playing .bar {
            animation-play-state: running;
        }

        .bar:nth-child(1) { height: 40%; animation-delay: 0s; }
        .bar:nth-child(2) { height: 80%; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 60%; animation-delay: 0.4s; }
        .bar:nth-child(4) { height: 100%; animation-delay: 0.6s; }

        @keyframes soundWave {
            0%, 100% { height: 30%; }
            50% { height: 100%; }
        }

        .audio-control {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .audio-slider {
            width: 80px;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .hero-title { margin-bottom: 20px; }
            .hero-avatar { width: 120px; height: 120px; }
            .video-overlay {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                left: 20px;
                right: 20px;
            }
        }
    </style>
</head>

    <script>
        const textToType = "radw.";
        const typewriterElement = document.getElementById('typewriter');
        const splashScreen = document.getElementById('splash-screen');
        const enterBtn = document.getElementById('enterBtn');
        const meBtn = document.getElementById('meBtn');
        const socialModal = document.getElementById('socialModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        let charIndex = 0;
        let hasInteracted = false;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typewriterElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 180);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeWriter, 200);
            updateClock();
            setInterval(updateClock, 1000);
            
            document.querySelectorAll('video.section-vid').forEach(video => {
                video.muted = true;
                video.pause();
            });
        });

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockText').innerText = `${hours}:${minutes}:${seconds}`;
        }

        function startSite() {
            if (hasInteracted) return;
            hasInteracted = true;
            
            splashScreen.classList.add('fade-out');
            checkVisibleVideo();
        }

        enterBtn.addEventListener('click', startSite);
        enterBtn.addEventListener('touchend', startSite);

        meBtn.addEventListener('click', () => socialModal.classList.add('open'));
        closeModalBtn.addEventListener('click', () => socialModal.classList.remove('open'));
        socialModal.addEventListener('click', (e) => {
            if (e.target === socialModal) socialModal.classList.remove('open');
        });

        setInterval(() => {
            document.getElementById('ping-text').innerText = (Math.floor(Math.random() * 8) + 12) + ' ms';
        }, 3000);

        const sections = document.querySelectorAll('#mainContainer > section');
        
        function toggleSoundWave(section, play) {
            const wave = section.querySelector('.sound-wave');
            const slider = section.querySelector('.audio-slider');
            
            if (wave) {
                if (play && slider && parseFloat(slider.value) > 0) {
                    wave.classList.add('playing');
                } else {
                    wave.classList.remove('playing');
                }
            }
        }

        const observerOptions = {
            root: null,
            threshold: 0.5
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const section = entry.target;
                const video = section.querySelector('video');
                
                if (entry.isIntersecting) {
                    section.classList.add('in-view');
                    
                    if (video && hasInteracted) {
                        requestAnimationFrame(() => {
                            video.currentTime = 0;
                            const slider = section.querySelector('.audio-slider');
                            const vol = slider ? parseFloat(slider.value) : 0.5;
                            video.volume = vol;
                            video.muted = (vol === 0);
                            
                            video.play().then(() => {
                                toggleSoundWave(section, vol > 0);
                            }).catch(() => {});
                        });
                    }
                } else {
                    section.classList.remove('in-view');
                    
                    if (video) {
                        video.pause();
                        video.muted = true;
                        toggleSoundWave(section, false);
                    }
                }
            });
        }, observerOptions);

        sections.forEach(section => {
            observer.observe(section);
        });

        function checkVisibleVideo() {
            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                const video = section.querySelector('video');
                
                if (rect.top >= -50 && rect.top < window.innerHeight / 2 && video && hasInteracted) {
                    requestAnimationFrame(() => {
                        video.currentTime = 0;
                        const slider = section.querySelector('.audio-slider');
                        const vol = slider ? parseFloat(slider.value) : 0.5;
                        video.volume = vol;
                        video.muted = (vol === 0);
                        
                        video.play().then(() => {
                            toggleSoundWave(section, vol > 0);
                        }).catch(() => {});
                    });
                }
            });
        }

        document.querySelectorAll('.audio-slider').forEach(slider => {
            slider.addEventListener('input', (e) => {
                const section = e.target.closest('section');
                const videoElement = section.querySelector('video');
                const volume = parseFloat(e.target.value);
                
                if (videoElement) {
                    videoElement.volume = volume;
                    videoElement.muted = (volume === 0);
                    toggleSoundWave(section, volume > 0);
                }
            });
        });
    </script>
</body>
</html>
